<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — The Cave Handbook</title>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .library-layout { display: grid; grid-template-columns: 220px 1fr; gap: 32px; }
  @media (max-width: 760px) { .library-layout { grid-template-columns: 1fr; } }

  .sidebar-section { margin-bottom: 26px; }
  .sidebar-section h3 {
    font: 700 12px "Barlow Condensed", sans-serif;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 10px;
  }
  .filter-list { list-style: none; margin: 0; padding: 0; }
  .filter-list li a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    border-radius: 8px;
    font: 600 13.5px Barlow, sans-serif;
    color: var(--text-secondary);
  }
  .filter-list li a:hover { background: var(--bg-soft); }
  .filter-list li a.active { background: var(--navy); color: #fff; }
  .filter-list li a .n { font-size: 11px; color: var(--text-faint); }
  .filter-list li a.active .n { color: rgba(255,255,255,.6); }
  .filter-list li a .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; display: inline-block; }

  .library-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .library-header h1 { font: 700 34px/1 "Barlow Condensed", sans-serif; letter-spacing: .03em; text-transform: uppercase; }
  .view-toggle { display: flex; gap: 4px; background: var(--card-bg); border-radius: 8px; padding: 3px; }
  .view-toggle button {
    border: none; background: transparent; padding: 6px 14px; border-radius: 6px;
    font: 700 12.5px Barlow, sans-serif; color: var(--text-muted); cursor: pointer;
  }
  .view-toggle button.active { background: #fff; color: var(--navy); box-shadow: var(--shadow-card); }

  .sop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .sop-grid.view-list { grid-template-columns: 1fr; }

  .sop-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-top: 4px solid transparent;
    border-radius: var(--radius-md);
    padding: 16px;
    transition: transform .08s, box-shadow .12s;
  }
  .sop-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
  .sop-card.st-current { border-top-color: var(--green); }
  .sop-card.st-review-due { border-top-color: var(--amber); }
  .sop-card.st-overdue { border-top-color: var(--red); }
  .sop-card.st-draft { border-top-color: var(--draft); }

  .sop-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .sop-card .title { font: 600 15px/1.3 Barlow, sans-serif; color: var(--navy); margin-bottom: 4px; }
  .sop-card .subtitle { font-size: 12.5px; color: var(--text-muted); }
  .sop-card .meta-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .sop-card .meta-row .reviewed { font-size: 12px; color: var(--text-faint); }

  .sop-grid.view-list .sop-card { display: flex; align-items: center; gap: 16px; border-top: none; border-left: 4px solid transparent; }
  .sop-grid.view-list .sop-card.st-current { border-left-color: var(--green); }
  .sop-grid.view-list .sop-card.st-review-due { border-left-color: var(--amber); }
  .sop-grid.view-list .sop-card.st-overdue { border-left-color: var(--red); }
  .sop-grid.view-list .sop-card.st-draft { border-left-color: var(--draft); }
  .sop-grid.view-list .sop-card .top-row { flex: 1; margin-bottom: 0; }
  .sop-grid.view-list .sop-card .meta-row { margin-top: 0; flex: 0 0 auto; }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a href="index.html" class="brand"><span class="brand-mark">🎱</span> Cave <strong>&nbsp;Handbook</strong></a>
    <nav class="topnav">
      <a href="index.html">Home</a>
      <a href="library.html" class="active">Library</a>
      <a href="library.html">My Queue</a>
      <a href="#">Changelog</a>
      <a href="#">People</a>
    </nav>
    <div class="topbar-right">
      <div class="search-box">
        <span>&#128269;</span>
        <input type="text" id="search-input" placeholder="Search SOPs...">
      </div>
      <div class="avatar">AD</div>
    </div>
  </header>

  <div class="page-body">
    <div class="library-layout">
      <aside>
        <div class="sidebar-section">
          <h3>Departments</h3>
          <ul class="filter-list" id="dept-filter"></ul>
        </div>
        <div class="sidebar-section">
          <h3>Status</h3>
          <ul class="filter-list" id="status-filter"></ul>
        </div>
      </aside>

      <main>
        <div class="library-header">
          <h1 id="dept-heading">All SOPs</h1>
          <div class="view-toggle">
            <button data-view="grid" class="active">Grid</button>
            <button data-view="list">List</button>
          </div>
        </div>
        <div class="sop-grid" id="sop-container"></div>
      </main>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  let state = {
    dept: params.get("dept") || "all",
    status: params.get("status") || "all",
    query: "",
    view: "grid",
  };

  const STATUS_COLOR = { current: "var(--green)", "review-due": "var(--amber)", overdue: "var(--red)", draft: "var(--draft)" };

  function setParam(key, val) {
    const u = new URL(location.href);
    if (val === "all") u.searchParams.delete(key); else u.searchParams.set(key, val);
    history.replaceState(null, "", u);
  }

  function renderDeptFilter() {
    const counts = { all: SOPS.length };
    DEPARTMENTS.forEach((d) => (counts[d.id] = sopsByDepartment(d.id).length));
    const items = [{ id: "all", name: "All SOPs" }, ...DEPARTMENTS];
    document.getElementById("dept-filter").innerHTML = items
      .map(
        (d) => `<li><a href="#" data-dept="${d.id}" class="${state.dept === d.id ? "active" : ""}">
          <span>${d.name}</span><span class="n">${counts[d.id]}</span></a></li>`
      )
      .join("");
  }

  function renderStatusFilter() {
    const pool = state.dept === "all" ? SOPS : sopsByDepartment(state.dept);
    const items = [{ id: "all", label: "All statuses" }, ...STATUSES];
    document.getElementById("status-filter").innerHTML = items
      .map((s) => {
        const n = s.id === "all" ? pool.length : pool.filter((x) => x.status === s.id).length;
        const dot = s.id === "all" ? "" : `<span class="dot" style="background:${STATUS_COLOR[s.id]}"></span>`;
        return `<li><a href="#" data-status="${s.id}" class="${state.status === s.id ? "active" : ""}">
          <span>${dot}${s.label || s.id}</span><span class="n">${n}</span></a></li>`;
      })
      .join("");
  }

  function renderHeading() {
    document.getElementById("dept-heading").textContent =
      state.dept === "all" ? "All SOPs" : getDepartment(state.dept).name;
  }

  function renderCards() {
    let list = state.dept === "all" ? SOPS.slice() : sopsByDepartment(state.dept);
    if (state.status !== "all") list = list.filter((s) => s.status === state.status);
    if (state.query) {
      const q = state.query.toLowerCase();
      list = list.filter((s) => s.title.toLowerCase().includes(q) || (s.subtitle || "").toLowerCase().includes(q));
    }
    const el = document.getElementById("sop-container");
    if (!list.length) {
      el.innerHTML = `<div class="empty-state">No SOPs match these filters.</div>`;
      return;
    }
    el.innerHTML = list
      .map((s) => {
        const reviewed = s.lastReviewed ? `Reviewed ${s.lastReviewed}` : "Not yet reviewed";
        return `
        <a class="sop-card st-${s.status}" href="sop.html?id=${s.id}">
          <div class="top-row">
            <div>
              <div class="title">${s.title}</div>
              <div class="subtitle">${s.subtitle || ""}</div>
            </div>
            <span class="badge badge-${s.status}">${statusMeta(s.status).label}</span>
          </div>
          <div class="meta-row">
            <span class="pill-avatar">${s.owner.initials}</span>
            <span class="reviewed">${s.owner.name} &middot; ${reviewed}</span>
          </div>
        </a>`;
      })
      .join("");
  }

  function renderAll() {
    renderDeptFilter();
    renderStatusFilter();
    renderHeading();
    renderCards();
  }

  document.getElementById("dept-filter").addEventListener("click", (e) => {
    const a = e.target.closest("a[data-dept]");
    if (!a) return;
    e.preventDefault();
    state.dept = a.dataset.dept;
    state.status = "all";
    setParam("dept", state.dept);
    setParam("status", "all");
    renderAll();
  });

  document.getElementById("status-filter").addEventListener("click", (e) => {
    const a = e.target.closest("a[data-status]");
    if (!a) return;
    e.preventDefault();
    state.status = a.dataset.status;
    setParam("status", state.status);
    renderAll();
  });

  document.getElementById("search-input").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderCards();
  });

  document.querySelectorAll(".view-toggle button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".view-toggle button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.view = btn.dataset.view;
      document.getElementById("sop-container").classList.toggle("view-list", state.view === "list");
    });
  });

  renderAll();
</script>
</body>
</html>
