name: Deploy Cave Handbook to GitHub Pages

# Triggers on pushes to this repo's actual default branch. If that branch
# is ever renamed (e.g. merged into a real `main`), update the branch name
# below to match, or this workflow silently stops firing.
on:
  push:
    branches: [claude/sop-repository-hub-qb5c2i]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
