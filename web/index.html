// Builds the org-chart shape from reportsTo pointers: a map of managerId
// -> their direct reports, plus the list of "roots" to start rendering
// from (no manager, or a manager that no longer exists). A person whose
// reports_to chain forms a cycle disconnected from any real root would
// otherwise never render at all -- stranded entries are appended as
// extra roots so nobody silently disappears from the chart.
function buildDirectoryTree(entries) {
  const byId = new Map(entries.map((p) => [p.id, p]));
  const childrenOf = new Map();
  entries.forEach((p) => {
    const managerId = p.reportsTo && byId.has(p.reportsTo) ? p.reportsTo : null;
    if (managerId) {
      if (!childrenOf.has(managerId)) childrenOf.set(managerId, []);
      childrenOf.get(managerId).push(p);
    }
  });
  childrenOf.forEach((kids) => kids.sort((a, b) => a.name.localeCompare(b.name)));

  const roots = entries.filter((p) => !(p.reportsTo && byId.has(p.reportsTo))).sort((a, b) => a.name.localeCompare(b.name));
  const reached = new Set();
  const markReached = (id) => {
    if (reached.has(id)) return;
    reached.add(id);
    (childrenOf.get(id) || []).forEach((c) => markReached(c.id));
  };
  roots.forEach((r) => markReached(r.id));
  const stranded = entries.filter((p) => !reached.has(p.id));

  return { roots: [...roots, ...stranded], childrenOf };
}

function directoryActionsHtml(p) {
  if (p.status === "draft") {
    return isAdmin(CURRENT_VIEWER)
      ? `<button class="btn btn-secondary" data-edit-person="${p.id}">Edit</button> <button class="btn btn-secondary" data-approve-person="${p.id}">Approve</button> <button class="btn btn-danger" data-remove-person="${p.id}">Remove</button>`
      : `<span class="muted small">Awaiting Admin approval</span>`;
  }
  if (CURRENT_VIEWER) {
    return `<button class="btn btn-secondary" data-edit-person="${p.id}">Edit</button>${isAdmin(CURRENT_VIEWER) ? ` <button class="btn btn-danger" data-remove-person="${p.id}">Remove</button>` : ""}`;
  }
  return "";
}

// Renders a person's direct reports. When they belong to more than one
// department, groups them under a labeled sub-branch per department
// (e.g. Ross's reports split into an "Operations" cluster and an
// "Installations" cluster) instead of one flat, mixed row -- using the
// same <li>/.org-branch structure a person node uses, so the existing
// connector-line CSS handles the extra tier for free. If everyone
// shares one department, there's nothing to clarify, so it skips
// straight to a flat row like before.
function renderOrgChildren(kids, childrenOf) {
  if (!kids.length) return "";
  const deptIds = [...new Set(kids.map((k) => k.department))];
  if (deptIds.length <= 1) {
    return `<ul class="org-branch">${kids.map((c) => renderOrgNode(c, childrenOf)).join("")}</ul>`;
  }
  const groups = deptIds.map((deptId) => {
    const dept = getDepartment(deptId);
    const groupKids = kids.filter((k) => k.department === deptId).sort((a, b) => a.name.localeCompare(b.name));
    return `<li>
      <div class="org-group-label">${escapeHtml(dept ? dept.name : deptId)}</div>
      <ul class="org-branch">${groupKids.map((c) => renderOrgNode(c, childrenOf)).join("")}</ul>
    </li>`;
  }).join("");
  return `<ul class="org-branch">${groups}</ul>`;
}

// A tree node shows just a circular photo (or initials if none) --
// hovering it (or tapping it, for touch screens with no hover) reveals
// the full details in a popover. The popover is a descendant of the
// same element the CSS :hover rule watches, so moving the pointer into
// it to click Edit/Approve/Remove doesn't dismiss it.
function renderOrgNode(p, childrenOf) {
  const dept = getDepartment(p.department);
  const kids = childrenOf.get(p.id) || [];
  const contactBits = [
    p.email ? `<a href="mailto:${escapeAttr(p.email)}">${escapeHtml(p.email)}</a>` : "",
    p.phone ? `<a href="tel:${escapeAttr(p.phone)}">${escapeHtml(p.phone)}</a>` : "",
  ].filter(Boolean).join(" &middot; ");
  const avatarInner = p.photoUrl ? `<img src="${escapeAttr(p.photoUrl)}" alt="${escapeAttr(p.name)}">` : escapeHtml(initialsFrom(p.name));
  return `<li>
    <div class="person-node" data-person-node="${p.id}">
      <div class="person-avatar">${avatarInner}</div>
      <div class="person-role-label">${escapeHtml(p.role)}</div>
      <div class="person-tooltip">
        <div class="org-card">
          <div class="org-name">${escapeHtml(p.name)} ${p.status === "draft" ? `<span class="badge badge-draft">Pending</span>` : ""}</div>
          <div class="muted small">${escapeHtml(p.role)}${dept ? " &middot; " + dept.name : ""}</div>
          ${contactBits ? `<div class="muted small">${contactBits}</div>` : ""}
          ${p.notes ? `<div class="muted small">${escapeHtml(p.notes)}</div>` : ""}
          <div class="row" style="gap:8px;margin-top:6px">${directoryActionsHtml(p)}</div>
        </div>
      </div>
    </div>
    ${renderOrgChildren(kids, childrenOf)}
  </li>`;
}

function renderDirectory() {
  const q = directorySearchQuery.trim().toLowerCase();
  let bodyHtml;

  if (q) {
    const entries = DIRECTORY
      .filter((p) => {
        const dept = getDepartment(p.department);
        return [p.name, p.role, p.email, dept ? dept.name : ""].join(" ").toLowerCase().includes(q);
      })
      .sort((a, b) => a.name.localeCompare(b.name));

    bodyHtml = entries.length
      ? entries.map((p) => {
          const dept = getDepartment(p.department);
          const contactBits = [
            p.email ? `<a href="mailto:${escapeAttr(p.email)}">${escapeHtml(p.email)}</a>` : "",
            p.phone ? `<a href="tel:${escapeAttr(p.phone)}">${escapeHtml(p.phone)}</a>` : "",
          ].filter(Boolean).join(" &middot; ");
          const avatarInner = p.photoUrl ? `<img src="${escapeAttr(p.photoUrl)}" alt="${escapeAttr(p.name)}">` : escapeHtml(initialsFrom(p.name));
          return `<div class="review-item">
            <div class="row" style="gap:10px;align-items:center">
              <div class="person-avatar" style="width:36px;height:36px;font-size:12px;flex:none">${avatarInner}</div>
              <div class="suggestion-meta">
                <span class="suggestion-dept">${escapeHtml(p.name)}</span>
                ${p.status === "draft" ? `<span class="badge badge-draft">Pending</span>` : ""}
              </div>
            </div>
            <div class="target">${escapeHtml(p.role)}${dept ? " &middot; " + dept.name : ""}</div>
            ${contactBits ? `<p class="suggestion-text muted small">${contactBits}</p>` : ""}
            ${p.notes ? `<p class="muted small">${escapeHtml(p.notes)}</p>` : ""}
            <div class="review-footer">${directoryActionsHtml(p)}</div>
          </div>`;
        }).join("")
      : `<div class="empty-state">No one matches your search.</div>`;
  } else {
    const { roots, childrenOf } = buildDirectoryTree(DIRECTORY);
    bodyHtml = roots.length
      ? `<div class="org-tree-wrap" style="zoom:${directoryZoom}"><ul class="org-tree">${roots.map((r) => renderOrgNode(r, childrenOf)).join("")}</ul></div>`
      : `<div class="empty-state">No one in the directory yet.</div>`;
  }

  // Zoom only makes sense for the tree view -- the flat search-result
  // list already reads fine at any width and doesn't need it.
  const zoomControlsHtml = q ? "" : `
    <div class="row" style="gap:4px;align-items:center">
      <button class="btn btn-secondary" id="zoom-out-btn" title="Zoom out">&minus;</button>
      <span class="muted small" id="zoom-level" style="min-width:40px;text-align:center">${Math.round(directoryZoom * 100)}%</span>
      <button class="btn btn-secondary" id="zoom-in-btn" title="Zoom in">+</button>
      <button class="btn btn-secondary" id="zoom-reset-btn" title="Reset zoom">Reset</button>
    </div>`;

  pageBody.innerHTML = `
    <div class="library-header">
      <h1>Directory</h1>
      <div class="row" style="gap:10px;flex-wrap:wrap">
        <input id="directory-search" class="ef-input" placeholder="Search name, role, department..." value="${escapeAttr(directorySearchQuery)}" style="max-width:240px">
        ${zoomControlsHtml}
        ${CURRENT_VIEWER
          ? `<button class="btn btn-secondary" id="add-person-btn">+ Add person</button>`
          : `<button class="btn btn-secondary" id="add-person-btn" disabled title="Log in to add a person">+ Add person</button>`}
      </div>
    </div>
    <div id="directory-list" style="overflow-x:auto">${bodyHtml}</div>`;

  document.getElementById("directory-search").addEventListener("input", (e) => {
    directorySearchQuery = e.target.value;
    renderDirectory();
  });
  const zoomOutBtn = document.getElementById("zoom-out-btn");
  if (zoomOutBtn) zoomOutBtn.addEventListener("click", () => {
    directoryZoom = Math.max(DIRECTORY_ZOOM_MIN, Math.round((directoryZoom - 0.1) * 10) / 10);
    renderDirectory();
  });
  const zoomInBtn = document.getElementById("zoom-in-btn");
  if (zoomInBtn) zoomInBtn.addEventListener("click", () => {
    directoryZoom = Math.min(DIRECTORY_ZOOM_MAX, Math.round((directoryZoom + 0.1) * 10) / 10);
    renderDirectory();
  });
  const zoomResetBtn = document.getElementById("zoom-reset-btn");
  if (zoomResetBtn) zoomResetBtn.addEventListener("click", () => {
    directoryZoom = 1;
    renderDirectory();
  });
  const addBtn = document.getElementById("add-person-btn");
  if (addBtn && !addBtn.disabled) addBtn.addEventListener("click", () => go("/directory/new"));
  document.querySelectorAll("[data-edit-person]").forEach((el) => el.addEventListener("click", () => go("/directory/edit/" + el.dataset.editPerson)));
  document.querySelectorAll("[data-approve-person]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!CURRENT_VIEWER) return;
      btn.disabled = true;
      btn.textContent = "Approving...";
      try {
        await API.approveDirectoryEntry(btn.dataset.approvePerson, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName);
        const p = DIRECTORY.find((x) => x.id === btn.dataset.approvePerson);
        if (p) p.status = "current";
        renderDirectory();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Approve";
        alert("Couldn't approve: " + err.message);
      }
    });
  });
  document.querySelectorAll("[data-remove-person]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!CURRENT_VIEWER) return;
      const ok = confirm("Remove this person from the directory?");
      if (!ok) return;
      btn.disabled = true;
      btn.textContent = "Removing...";
      try {
        await API.disapproveDirectoryEntry(btn.dataset.removePerson, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName);
        DIRECTORY = DIRECTORY.filter((x) => x.id !== btn.dataset.removePerson);
        renderDirectory();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Remove";
        alert("Couldn't remove: " + err.message);
      }
    });
  });

  // Tapping an avatar toggles its tooltip (touch screens have no
  // :hover); see the single document-level listener near the top of
  // this script that closes whichever one is open on an outside click.
  // positionPersonTooltip flips the tooltip above the node instead of
  // below when there isn't enough room in the viewport underneath it
  // (e.g. someone near the bottom of a tall tree) -- otherwise it'd
  // render off the bottom of the page and need a scroll to even see.
  document.querySelectorAll("[data-person-node]").forEach((el) => {
    el.addEventListener("mouseenter", () => positionPersonTooltip(el));
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      positionPersonTooltip(el);
      const wasOpen = el.classList.contains("open");
      document.querySelectorAll(".person-node.open").forEach((o) => o.classList.remove("open"));
      if (!wasOpen) el.classList.add("open");
    });
  });
}
function positionPersonTooltip(el) {
  const tooltip = el.querySelector(".person-tooltip");
  if (!tooltip) return;
  tooltip.classList.remove("flip-up");
  const prevDisplay = tooltip.style.display;
  const prevVisibility = tooltip.style.visibility;
  tooltip.style.visibility = "hidden";
  tooltip.style.display = "block";
  const nodeRect = el.getBoundingClientRect();
  const tooltipHeight = tooltip.offsetHeight;
  tooltip.style.display = prevDisplay;
  tooltip.style.visibility = prevVisibility;
  if (nodeRect.bottom + tooltipHeight + 16 > window.innerHeight) {
    tooltip.classList.add("flip-up");
  }
}

      <button class="btn btn-secondary" id="edit-cancel">Cancel</button>
      <button class="btn btn-primary" id="edit-save">${memberProposing ? "Submit for approval" : "Save changes"}</button>

  document.getElementById("crumb-dir4").addEventListener("click", () => go("/directory"));

    const name = document.getElementById("ef-person-name").value.trim();
    if (!name) { statusEl.textContent = "Name can't be empty."; return; }
    const role = document.getElementById("ef-person-role").value.trim();
    if (!role) { statusEl.textContent = "Role can't be empty."; return; }
    const reportsTo = document.getElementById("ef-person-reports-to").value;
    const photoFile = document.getElementById("ef-person-photo").files[0];
    const fields = {
      name, role,
      department: document.getElementById("ef-person-department").value,
      email: document.getElementById("ef-person-email").value.trim(),
      phone: document.getElementById("ef-person-phone").value.trim(),
      notes: document.getElementById("ef-person-notes").value.trim(),
      reports_to: reportsTo,
      photo_url: p.photoUrl || "",

    saveBtn.disabled = true;
    saveBtn.textContent = memberProposing ? "Submitting..." : "Saving...";
    try {
      if (photoFile) {
        saveBtn.textContent = "Uploading photo...";
        fields.photo_url = await API.uploadDirectoryPhoto(photoFile);

      if (memberProposing) {

        DIRECTORY_EDIT_PROPOSALS.push({

          lastName: CURRENT_VIEWER.lastName, fields, status: "pending", ts: Date.now(),

/* ============================== BOOT ============================== */
function mapSop(row) {
  return {
    id: row.id,
    sopId: row.sop_id || undefined,
    title: row.title,
    department: row.department,
    status: row.status,
    confidential: row.confidential || undefined,
    owner: { name: row.owner_name, initials: row.owner_initials },
    lastReviewed: row.last_reviewed,
    nextReview: row.next_review,
    version: row.version,
    subtitle: row.subtitle,
    neverDoThis: row.never_do_this || undefined,
    beforeYouStart: row.before_you_start || [],
    toolsSystems: row.tools_systems || [],
    steps: row.steps || [],
    successCriteria: row.success_criteria || [],
    escalation: row.escalation || [],
    forms: row.forms || [],
    relatedIds: row.related_ids || [],
    blackoutPeriods: row.blackout_periods && row.blackout_periods.length ? row.blackout_periods : undefined,
    blackoutFlag: row.blackout_flag || undefined,
    signedOffBy: row.signed_off_by || [],
  };
}
function loginLabel(id) {
  const l = LOGINS.find((x) => x.id === id);
  return l ? l.name : (id || "");
}
function mapEvent(row) {
  return { sopId: row.sop_id, kind: row.kind, loginId: row.login_id, lastName: row.actor_last_name, loginName: loginLabel(row.login_id), ts: row.ts, fullDate: row.full_date, monthYear: row.month_year };
}
function mapSuggestion(row) {
  return {
    id: row.id,
    sopId: row.sop_id,
    loginId: row.login_id,
    loginName: loginLabel(row.login_id),
    lastName: row.last_name,
    text: row.text,
    ts: row.ts,
    status: row.status,
    approvedBy: row.approved_by_login_id ? { loginId: row.approved_by_login_id, lastName: row.approved_by_last_name } : undefined,
    approvedDate: row.approved_date || undefined,
  };
}
function mapEditProposal(row) {
  return {
    id: row.id,
    sopId: row.sop_id,
    loginId: row.login_id,
    loginName: loginLabel(row.login_id),
    lastName: row.last_name,
    fields: row.fields || {},
    status: row.status,
    decidedByLastName: row.decided_by_last_name || undefined,
    decidedDate: row.decided_date || undefined,
    ts: row.ts,
  };
}
function mapDirectoryEntry(row) {
  return {
    id: row.id, name: row.name, role: row.role, department: row.department,
    email: row.email || "", phone: row.phone || "", notes: row.notes || "",
    reportsTo: row.reports_to || null,
    photoUrl: row.photo_url || "",
    status: row.status,
  };
}
function mapDirectoryProposal(row) {
  return {
    id: row.id,
    entryId: row.entry_id,
    loginId: row.login_id,
    loginName: loginLabel(row.login_id),
    lastName: row.last_name,
    fields: row.fields || {},
    status: row.status,
    decidedByLastName: row.decided_by_last_name || undefined,
    decidedDate: row.decided_date || undefined,
    ts: row.ts,
  };
}

async function boot() {
  if (!API.configured()) {
    pageBody.innerHTML = `<div class="empty-state">
      <p><strong>Not set up yet.</strong></p>
      <p class="muted small">Fill in your Supabase project URL and anon key in web/js/config.js, then reload. See SETUP.md.</p>
    </div>`;
    appShell.style.display = "block";
    return;
  }
  pageBody.innerHTML = `<div class="empty-state"><p class="muted">Loading the handbook...</p></div>`;
  try {
    const [sopsRows, eventRows, suggestionRows, proposalRows, directoryRows, directoryProposalRows] = await Promise.all([
      API.listSops(), API.listSopEvents(), API.listSuggestions(), API.listSopEditProposals(),
      API.listDirectory(), API.listDirectoryEditProposals(),
    ]);
    SOPS = sopsRows.map(mapSop);
    EVENTS = eventRows.map(mapEvent);
    SUGGESTIONS = suggestionRows.map(mapSuggestion);
    EDIT_PROPOSALS = proposalRows.map(mapEditProposal);
    DIRECTORY = directoryRows.map(mapDirectoryEntry);
    DIRECTORY_EDIT_PROPOSALS = directoryProposalRows.map(mapDirectoryProposal);
    render();
  } catch (err) {
    pageBody.innerHTML = `<div class="empty-state">
      <p><strong>Couldn't load the handbook.</strong></p>
      <p class="muted small">${escapeHtml(err.message)}</p>
      <button class="btn btn-secondary" id="boot-retry">Try again</button>
    </div>`;
    document.getElementById("boot-retry").addEventListener("click", boot);
  }
}
boot();
</script>
