<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cave Handbook</title>
<!-- Same mark as the in-page brand-mark (yellow rounded square + the
     8-ball emoji) -- an inline SVG data URI so the tab icon never needs
     a separate asset to go stale. apple-touch-icon.png is a real file
     (same design) since iOS home-screen icons want a raster image. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2722%27%20fill%3D%27%23ffe500%27%2F%3E%3Ctext%20x%3D%2750%27%20y%3D%2770%27%20font-size%3D%2758%27%20text-anchor%3D%27middle%27%3E%F0%9F%8E%B1%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root {
    --brand-navy: #16213a;
    --yellow: #ffe500;

    --navy: #16213a;
    --canvas: #e8e6e1;
    --surface: #ffffff;
    --bg-soft: #f6f5f2;
    --bg-soft-2: #eceae5;
    --card-bg: #f1f0ed;
    --border: #e5e3de;
    --border-strong: #d1d0cc;

    --text-primary: #16213a;
    --text-secondary: #374151;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;

    --red: #e5231b; --red-bg: #fdeceb; --red-dark: #7f1d1d;
    --green: #16a34a; --green-bg: #eaf6ed; --green-dark: #15803d;
    --amber: #f59e0b; --amber-bg: #fdf4e3; --amber-dark: #b45309;
    --draft: #6b7280; --draft-bg: #eceae5; --draft-dark: #374151;

    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 24px;
    --shadow-card: 0 1px 2px rgba(22,33,58,.06), 0 1px 1px rgba(22,33,58,.04);
    --shadow-pop: 0 12px 32px rgba(22,33,58,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #aab4d4;
      --canvas: #0b0f1a;
      --surface: #121826;
      --bg-soft: #161d2e;
      --bg-soft-2: #1b2338;
      --card-bg: #182034;
      --border: #2a3350;
      --border-strong: #3c4770;
      --text-primary: #eef0f7;
      --text-secondary: #c3c8dc;
      --text-muted: #9299b8;
      --text-faint: #6b7291;
      --red: #ff6b61; --red-bg: rgba(229,35,27,.16); --red-dark: #ffb4ae;
      --green: #4ade80; --green-bg: rgba(22,163,74,.18); --green-dark: #86efac;
      --amber: #fbbf24; --amber-bg: rgba(245,158,11,.18); --amber-dark: #fde68a;
      --draft: #9299b8; --draft-bg: #1b2338; --draft-dark: #c3c8dc;
    }
  }
  :root[data-theme="dark"] {
    --navy: #aab4d4;
    --canvas: #0b0f1a;
    --surface: #121826;
    --bg-soft: #161d2e;
    --bg-soft-2: #1b2338;
    --card-bg: #182034;
    --border: #2a3350;
    --border-strong: #3c4770;
    --text-primary: #eef0f7;
    --text-secondary: #c3c8dc;
    --text-muted: #9299b8;
    --text-faint: #6b7291;
    --red: #ff6b61; --red-bg: rgba(229,35,27,.16); --red-dark: #ffb4ae;
    --green: #4ade80; --green-bg: rgba(22,163,74,.18); --green-dark: #86efac;
    --amber: #fbbf24; --amber-bg: rgba(245,158,11,.18); --amber-dark: #fde68a;
    --draft: #9299b8; --draft-bg: #1b2338; --draft-dark: #c3c8dc;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--canvas);
    color: var(--text-primary);
    font: 400 15px/1.5 Barlow, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4 { margin: 0; font-family: Barlow, system-ui, sans-serif; }
  button, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .app-shell { max-width: 1360px; margin: 0 auto; padding: 20px 20px 64px; }

  .topbar {
    display: flex; align-items: center; gap: 24px;
    background: var(--brand-navy); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 14px 24px; position: relative;
  }
  .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px; background: var(--yellow); }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 20px/1 "Barlow Condensed", sans-serif; letter-spacing: .02em; color: #fff; text-transform: uppercase; white-space: nowrap; cursor: pointer; border: none; background: none; }
  .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--yellow); color: var(--brand-navy); font-size: 18px; }
  .topnav { display: flex; align-items: center; gap: 4px; flex: 1; }
  .topnav a { color: rgba(255,255,255,.72); font: 600 14px/1 Barlow, sans-serif; padding: 9px 14px; border-radius: 8px; transition: background .12s, color .12s; cursor: pointer; }
  .topnav a:hover { background: rgba(255,255,255,.08); color: #fff; }
  .topnav a.active { background: var(--yellow); color: var(--brand-navy); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .search-box { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 8px 14px; min-width: 200px; }
  .search-box input { background: transparent; border: none; outline: none; color: #fff; font: 500 13px Barlow, sans-serif; width: 100%; }
  .search-box input::placeholder { color: rgba(255,255,255,.5); }
  .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--yellow); color: var(--brand-navy); font: 700 13px "Barlow Condensed", sans-serif; flex-shrink: 0; border: none; cursor: pointer; }
  .theme-toggle { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); color: #fff; cursor: pointer; font-size: 15px; flex-shrink: 0; }
  .theme-toggle:disabled { opacity: .35; cursor: not-allowed; }

  .hamburger-btn { display: none; width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0; }

  .viewer-wrap { position: relative; }
  .viewer-menu {
    display: none; position: absolute; top: calc(100% + 10px); right: 0; z-index: 30;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop); padding: 8px; min-width: 240px;
  }
  .viewer-menu.open { display: block; }
  .viewer-menu .vm-label { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); padding: 6px 8px 4px; }
  .viewer-menu .vm-item {
    display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer;
    font: 600 13.5px Barlow, sans-serif; color: var(--text-primary);
  }
  .viewer-menu .vm-item:hover { background: var(--card-bg); }
  .viewer-menu .vm-item.selected { background: var(--bg-soft-2); }
  .viewer-menu .vm-item .vm-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border-strong); display: grid; place-items: center; font: 700 10px "Barlow Condensed", sans-serif; flex-shrink: 0; }
  .viewer-menu .vm-clear { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; }
  .vm-item-login { padding: 8px; border-radius: 8px; background: var(--card-bg); }
  .vm-passcode-input { width: 100%; font: 400 13.5px Barlow, sans-serif; color: var(--text-primary); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }

  /* ---- Login gate (shown before any page content until logged in) ---- */
  .login-gate-wrap { max-width: 420px; margin: 48px auto; text-align: center; }
  .login-gate-wrap .brand-mark { width: 56px; height: 56px; font-size: 28px; margin: 0 auto 18px; }
  .login-gate-wrap h1 { font: 700 27px "Barlow Condensed", sans-serif; letter-spacing: .02em; text-transform: uppercase; margin-bottom: 6px; }
  .login-gate-wrap > p { margin-bottom: 26px; }
  .login-gate { text-align: left; display: flex; flex-direction: column; gap: 8px; }
  .login-gate .vm-item { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 8px; cursor: pointer; font: 600 14px Barlow, sans-serif; color: var(--text-primary); background: var(--card-bg); border: 1px solid var(--border); }
  .login-gate .vm-item:hover { background: var(--bg-soft-2); }
  .login-gate .vm-item.selected { background: var(--bg-soft-2); border-color: var(--border-strong); }
  .login-gate .vm-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-strong); display: grid; place-items: center; font: 700 11px "Barlow Condensed", sans-serif; flex-shrink: 0; }
  .login-gate .vm-item-login { border: 1px solid var(--border-strong); }

  .waiting-cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .waiting-cta p { margin: 0; }

  .page-body { background: var(--surface); border-radius: 0 0 var(--radius-lg) var(--radius-lg); box-shadow: var(--shadow-card); padding: 36px; margin-top: 12px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 700 11px/1 "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-current { background: var(--green-bg); color: var(--green-dark); }
  .badge-review-due { background: var(--amber-bg); color: var(--amber-dark); }
  .badge-overdue { background: var(--red-bg); color: var(--red-dark); }
  .badge-draft { background: var(--draft-bg); color: var(--draft-dark); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 10px; padding: 11px 20px; font: 700 14px Barlow, sans-serif; cursor: pointer; transition: transform .08s, box-shadow .12s, background .12s; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-primary { background: var(--yellow); color: var(--brand-navy); }
  .btn-primary:hover { box-shadow: 0 4px 14px rgba(255,229,0,.4); }
  .btn-secondary { background: var(--card-bg); color: var(--navy); border: 1px solid var(--border-strong); }
  .btn-secondary:hover { background: var(--bg-soft-2); }
  .btn-danger { background: var(--red-bg); color: var(--red-dark); border: 1px solid var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }

  .pill-avatar { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--brand-navy); color: #fff; font: 700 11px "Barlow Condensed", sans-serif; flex-shrink: 0; }

  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; }
  .hr { height: 1px; background: var(--border); border: none; margin: 20px 0; }

  /* ---- Home ---- */
  .dash-greeting { margin-bottom: 28px; }
  .dash-greeting h1 { font: 700 27px/1.15 Barlow, sans-serif; letter-spacing: -.01em; margin-bottom: 3px; }
  .dept-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .dept-tile { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; transition: border-color .12s, transform .08s; display: block; cursor: pointer; }
  .dept-tile:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .dept-tile .count { font: 700 30px/1 "Barlow Condensed", sans-serif; color: var(--navy); font-variant-numeric: tabular-nums; }
  .dept-tile .name { font: 600 13px Barlow, sans-serif; color: var(--text-secondary); margin-top: 4px; }
  .dept-tile .bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 12px; overflow: hidden; display: flex; }
  .dept-tile .bar span { height: 100%; }
  .dash-columns { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .dash-columns { grid-template-columns: 1fr; } }
  .panel { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; }
  .panel h2 { font: 700 15px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 14px; }
  .queue-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .queue-item:first-of-type { border-top: none; }
  .queue-item .title { font: 600 14px Barlow, sans-serif; }
  .queue-item .sub { font-size: 12px; color: var(--text-muted); }
  .queue-item .go { margin-left: auto; }
  .health-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .health-row:first-of-type { border-top: none; }
  .health-row .dept-name { flex: 0 0 150px; font: 600 13px Barlow, sans-serif; }
  .health-track { flex: 1; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; display: flex; }
  .health-track span { height: 100%; }
  .health-count { flex: 0 0 auto; font: 600 12px Barlow, sans-serif; color: var(--text-muted); }

  /* ---- Library ---- */
  .library-layout { display: grid; grid-template-columns: 220px 1fr; gap: 32px; }
  @media (max-width: 760px) { .library-layout { grid-template-columns: 1fr; } }
  .sidebar-section { margin-bottom: 26px; }
  .sidebar-section h3 { font: 700 12px "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
  .filter-list { list-style: none; margin: 0; padding: 0; }
  .filter-list li a { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 8px; font: 600 13.5px Barlow, sans-serif; color: var(--text-secondary); cursor: pointer; }
  .filter-list li a:hover { background: var(--bg-soft); }
  .filter-list li a.active { background: var(--brand-navy); color: #fff; }
  .filter-list li a .n { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .filter-list li a.active .n { color: rgba(255,255,255,.6); }
  .filter-list li a .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; display: inline-block; }
  .library-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .library-header h1 { font: 700 34px/1 "Barlow Condensed", sans-serif; letter-spacing: .03em; text-transform: uppercase; }
  .view-toggle { display: flex; gap: 4px; background: var(--card-bg); border-radius: 8px; padding: 3px; }
  .view-toggle button { border: none; background: transparent; padding: 6px 14px; border-radius: 6px; font: 700 12.5px Barlow, sans-serif; color: var(--text-muted); cursor: pointer; }
  .view-toggle button.active { background: var(--surface); color: var(--navy); box-shadow: var(--shadow-card); }
  .sop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .sop-grid.view-list { grid-template-columns: 1fr; }
  .sop-card { background: var(--card-bg); border: 1px solid var(--border); border-top: 4px solid transparent; border-radius: var(--radius-md); padding: 16px; transition: transform .08s, box-shadow .12s; display: block; cursor: pointer; }
  .sop-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
  .sop-card.st-current { border-top-color: var(--green); }
  .sop-card.st-review-due { border-top-color: var(--amber); }
  .sop-card.st-overdue { border-top-color: var(--red); }
  .sop-card.st-draft { border-top-color: var(--draft); }
  .sop-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .sop-card .title { font: 600 15px/1.3 Barlow, sans-serif; color: var(--navy); margin-bottom: 4px; }
  .sop-card .subtitle { font-size: 12.5px; color: var(--text-muted); }
  .sop-card .meta-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .sop-card .meta-row .reviewed { font-size: 12px; color: var(--text-faint); }
  .sop-grid.view-list .sop-card { display: flex; align-items: center; gap: 16px; border-top: none; border-left: 4px solid transparent; }
  .sop-grid.view-list .sop-card.st-current { border-left-color: var(--green); }
  .sop-grid.view-list .sop-card.st-review-due { border-left-color: var(--amber); }
  .sop-grid.view-list .sop-card.st-overdue { border-left-color: var(--red); }
  .sop-grid.view-list .sop-card.st-draft { border-left-color: var(--draft); }
  .sop-grid.view-list .sop-card .top-row { flex: 1; margin-bottom: 0; }
  .sop-grid.view-list .sop-card .meta-row { margin-top: 0; flex: 0 0 auto; }
  .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }

  /* ---- SOP detail ---- */
  .breadcrumb { font: 600 12.5px Barlow, sans-serif; color: var(--text-muted); margin-bottom: 14px; }
  .breadcrumb a { cursor: pointer; }
  .breadcrumb a:hover { color: var(--navy); }
  .breadcrumb .sep { margin: 0 6px; color: var(--text-faint); }
  .sop-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .sop-header h1 { font: 600 38px/1.12 Barlow, sans-serif; letter-spacing: -.02em; max-width: 30ch; text-wrap: balance; }
  .sop-header .subtitle { color: var(--text-muted); margin-top: 8px; font-size: 15px; }
  .sop-actions { display: flex; gap: 8px; flex-shrink: 0; position: relative; }
  .history-panel {
    display: none; position: absolute; top: calc(100% + 10px); left: 0; z-index: 30;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop); padding: 8px; min-width: 280px; max-width: 340px;
  }
  .history-panel.open { display: block; }
  .history-panel .vm-label { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); padding: 6px 8px 4px; }
  .history-row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; font-size: 13px; }
  .history-row .name { flex: 1; }
  .history-row .date { color: var(--text-faint); font-size: 12px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .history-panel p.muted { padding: 6px 8px; }
  .sop-layout { display: grid; grid-template-columns: 1fr 300px; gap: 36px; }
  .sop-layout main, .sop-layout aside { min-width: 0; }
  @media (max-width: 900px) { .sop-layout { grid-template-columns: 1fr; } }
  .never-banner { display: flex; gap: 10px; align-items: flex-start; background: var(--red-bg); color: var(--red-dark); border: 1px solid var(--red); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 24px; font: 600 14px/1.4 Barlow, sans-serif; }
  .never-banner .tag { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }
  .blackout-banner { background: var(--amber-bg); color: var(--amber-dark); border: 1px solid var(--amber); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 24px; }
  .blackout-banner .tag { display: block; font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
  .blackout-banner ul { margin: 0; padding-left: 18px; }
  .blackout-banner li { font: 600 14px/1.5 Barlow, sans-serif; margin-bottom: 4px; }
  .document-embed { width: 100%; height: 70vh; min-height: 420px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
  .document-embed-inline { width: 100%; height: 360px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
  .document-embed-img { width: 100%; max-height: 70vh; object-fit: contain; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
  .document-open-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 18px; background: var(--card-bg); font: 600 14px Barlow, sans-serif; }
  .doc-download-link { display: inline-block; margin-top: 8px; font: 600 12.5px Barlow, sans-serif; text-decoration: underline; cursor: pointer; color: var(--text-secondary); }
  .blackout-banner .flag-note { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(138,75,0,.2); font: 600 13px/1.5 Barlow, sans-serif; }
  .section { margin-bottom: 32px; scroll-margin-top: 20px; }
  .section h2 { font: 600 19px Barlow, sans-serif; margin-bottom: 14px; }
  .before-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .before-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-secondary); cursor: pointer; user-select: none; border-radius: 8px; padding: 4px 6px; margin: 0 -6px; transition: background .12s, color .12s; }
  .before-list li:hover { background: var(--card-bg); }
  .before-list li::before { content: "\2713"; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; background: var(--card-bg); border: 1px solid var(--border-strong); font-size: 11px; color: transparent; flex-shrink: 0; transition: background .12s, border-color .12s, color .12s; }
  .before-list li.checked { color: var(--text-faint); text-decoration: line-through; }
  .before-list li.checked::before { content: "\2713"; background: var(--green); border-color: var(--green); color: var(--surface); }
  .step-row { display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid var(--border); }
  .step-row:first-of-type, .step-row.phase-first { border-top: none; }
  .step-num { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--card-bg); display: grid; place-items: center; font: 700 13px "Barlow Condensed", sans-serif; color: var(--navy); cursor: pointer; user-select: none; border: 2px solid transparent; transition: background .12s, border-color .12s, color .12s; }
  .step-num:hover { border-color: var(--border-strong); }
  .step-row.done .step-num { background: var(--green); color: var(--surface); }
  .step-row.done .step-num::before { content: "\2713"; }
  .step-row.done .step-num span { display: none; }
  .step-row.done h3, .step-row.done p { color: var(--text-faint); text-decoration: line-through; }
  .step-row h3 { font: 600 15.5px Barlow, sans-serif; margin-bottom: 4px; }
  .step-row p { font-size: 13.5px; color: var(--text-muted); margin: 0; }
  .step-row .step-type { font: 700 10.5px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin-left: 8px; }
  .forms-list, .related-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .forms-list a, .related-list a { display: flex; align-items: center; gap: 8px; font: 600 13.5px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; background: var(--card-bg); cursor: pointer; }
  .forms-list a:hover, .related-list a:hover { background: var(--bg-soft-2); }
  .form-flag { margin-left: auto; font: 700 10px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .04em; background: var(--amber-bg); color: var(--amber-dark); border-radius: 999px; padding: 2px 8px; flex-shrink: 0; }
  .rail-card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; margin-bottom: 16px; }
  .rail-card h3 { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin-bottom: 12px; }
  .meta-line { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13.5px; }
  .meta-line .k { color: var(--text-muted); }
  .meta-line .v { font-weight: 600; }
  .signoff-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .signoff-row .name { font-weight: 600; }
  .signoff-row .date { color: var(--text-faint); margin-left: auto; font-variant-numeric: tabular-nums; }
  .signoff-note { font-size: 12.5px; color: var(--green-dark); background: var(--green-bg); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .toc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .toc-list a { display: block; padding: 6px 10px; border-radius: 8px; font: 600 13px Barlow, sans-serif; color: var(--text-secondary); cursor: pointer; }
  .toc-list a:hover { background: var(--card-bg); color: var(--navy); }
  .phase-heading { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); padding: 22px 0 8px; border-top: 1px solid var(--border); margin-top: 4px; }
  .tag-chip { display: inline-flex; align-items: center; gap: 4px; font: 700 10.5px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; margin-left: 6px; }
  .tag-approval { background: var(--amber-bg); color: var(--amber-dark); }
  .tag-confidential { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-strong); }
  .tools-table { display: flex; flex-direction: column; gap: 10px; }
  .tools-row { display: flex; gap: 14px; padding: 10px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .tools-row:first-of-type { border-top: none; }
  .tools-row .name { flex: 0 0 200px; font: 600 13.5px Barlow, sans-serif; color: var(--navy); }
  .tools-row .note { font-size: 13px; color: var(--text-muted); flex: 1 1 260px; }
  .escalation-row { padding: 12px 0; border-top: 1px solid var(--border); }
  .escalation-row:first-of-type { border-top: none; }
  .escalation-row .when { font: 600 14px Barlow, sans-serif; color: var(--navy); margin-bottom: 3px; }
  .escalation-row .action { font-size: 13.5px; color: var(--text-muted); }
  .confidential-note { display: inline-flex; align-items: center; gap: 6px; font: 600 12px Barlow, sans-serif; color: var(--text-muted); background: var(--card-bg); border-radius: 999px; padding: 4px 10px; margin-left: 8px; }

  /* ---- Suggestions ---- */
  .suggestion-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .suggestion-item { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; }
  .suggestion-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .suggestion-dept { font: 700 10.5px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--navy); background: var(--card-bg); border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 9px; }
  .suggestion-status { font: 700 10.5px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; border-radius: 999px; padding: 3px 9px; }
  .suggestion-status-pending { background: var(--amber-bg); color: var(--amber-dark); }
  .suggestion-status-approved { background: var(--green-bg); color: var(--green-dark); }
  .suggestion-date { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; margin-left: auto; }
  .suggestion-text { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; white-space: pre-wrap; }
  .suggestion-form { background: var(--card-bg); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); padding: 14px; }
  .suggestion-form textarea { width: 100%; resize: vertical; font: 400 14px/1.5 Barlow, sans-serif; color: var(--text-primary); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .suggestion-form-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .suggestion-form-locked { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .review-item { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 12px; }
  .review-item .target { font: 600 14px Barlow, sans-serif; color: var(--navy); cursor: pointer; }
  .review-item .target:hover { text-decoration: underline; }
  .review-item .review-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .review-item .review-note { font-size: 12px; color: var(--text-faint); }

  /* Directory org chart: a real flat/wide branching tree -- each
     person's direct reports sit in a row underneath them (flexbox),
     connected with plain CSS lines (no chart library). This is the
     classic "pure CSS org chart" recipe: a branch's own ::before draws
     the vertical drop from the parent, and each child li's ::before/
     ::after draw the horizontal half-lines that meet its siblings. */
  /* justify-content: center clips the start side of the content when it
     overflows a scrollable flex container -- most browsers only let you
     scroll "forward" past centered content, not into the side that got
     pushed left of the initial scroll position. "safe center" (with
     plain "center" first, for browsers that don't know the keyword)
     falls back to start-alignment once it overflows so it's all
     reachable by scrolling, which matters once zoom/a wide tree pushes
     this past the visible width. */
  .org-tree-wrap { display: flex; justify-content: center; justify-content: safe center; align-items: flex-start; overflow-x: auto; min-height: 50vh; padding: 40px 0; }
  .org-tree { display: flex; justify-content: center; gap: 28px; list-style: none; margin: 0; padding: 0; }
  .org-tree > li { display: flex; flex-direction: column; align-items: center; }

  .org-branch { display: flex; justify-content: center; list-style: none; margin: 0; padding-top: 28px; position: relative; }
  .org-branch > li { position: relative; display: flex; flex-direction: column; align-items: center; padding: 28px 8px 0 8px; }
  .org-branch > li::before, .org-branch > li::after {
    content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 28px; border-top: 2px solid var(--border);
  }
  .org-branch > li::after { right: auto; left: 50%; border-left: 2px solid var(--border); }
  .org-branch > li:first-child::before { border: none; }
  .org-branch > li:last-child::after { border-top: none; }
  .org-branch > li:only-child::before, .org-branch > li:only-child::after { display: none; }
  .org-branch > li:only-child { padding-top: 0; padding-left: 0; padding-right: 0; }
  .org-branch::before {
    content: ""; position: absolute; top: 0; left: 50%; width: 0; height: 28px; border-left: 2px solid var(--border);
  }

  .org-card { display: inline-flex; flex-direction: column; gap: 2px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px; min-width: 200px; max-width: 320px; text-align: left; }
  .org-card .org-name { font: 700 14px Barlow, sans-serif; color: var(--text-primary); }

  /* A department cluster label, standing in for a person node when a
     manager's direct reports split across more than one department --
     see renderOrgChildren(). */
  .org-group-label { font: 700 12px Barlow, sans-serif; color: var(--text-secondary); background: var(--card-bg); border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 16px; white-space: nowrap; }

  /* Each node is a circular photo (initials if none) with its role
     underneath -- hovering or tapping it reveals an .org-card with the
     full details (name, department, contact, notes). */
  .person-node { position: relative; display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
  .person-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--card-bg); border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font: 700 22px Barlow, sans-serif; color: var(--text-secondary); overflow: hidden; cursor: pointer; flex: none; }
  .person-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .person-role-label { font: 600 12px Barlow, sans-serif; color: var(--text-secondary); text-align: center; max-width: 120px; line-height: 1.3; }
  .person-tooltip { display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); z-index: 30; margin-top: 8px; }
  .person-node:hover .person-tooltip, .person-node.open .person-tooltip { display: block; }
  /* Set by positionPersonTooltip() in JS when there's no room below. */
  .person-tooltip.flip-up { top: auto; bottom: 100%; margin-top: 0; margin-bottom: 8px; }

  /* ---- SOP edit form ---- */
  .edit-field { margin-bottom: 20px; max-width: 1100px; }
  .edit-field label { display: block; font: 700 12px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); margin-bottom: 6px; }
  .ef-input, .edit-field textarea { width: 100%; font: 400 14px/1.5 Barlow, sans-serif; color: var(--text-primary); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 12px; }
  .edit-field textarea { resize: vertical; }
  #steps-editor { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
  .step-edit-block { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .step-edit-row { display: flex; gap: 8px; align-items: center; }
  .step-edit-row .se-phase { flex: 1; font: 400 13px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .step-edit-row .se-type { font: 600 13px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .se-title { width: 100%; font: 600 14px Barlow, sans-serif; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .se-body, .se-items, .se-options { width: 100%; font: 400 13.5px/1.5 Barlow, sans-serif; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); resize: vertical; }
  .se-tags { display: flex; gap: 16px; }
  .se-tags label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-muted); cursor: pointer; }
  .se-move-btn { padding: 8px 12px; line-height: 1; }
  .se-move-btn:disabled { opacity: 0.35; cursor: default; }
  .se-insert-after { align-self: center; font-size: 12.5px; padding: 6px 12px; opacity: 0.85; }
  .se-after-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .se-after-row .se-after-label { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
  .se-after-row .se-after-mode { font: 400 13px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .se-after-row .se-after-goto { width: 90px; font: 400 13px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }

  /* Two-column "+ Add row" editor (Tools & systems, Escalation, Forms) */
  .kv-editor { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .kv-row { display: flex; gap: 8px; align-items: center; }
  .kv-row .kv-a { flex: 1; font: 400 13.5px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .kv-row .kv-b { flex: 1; font: 400 13.5px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .kv-row .kv-remove { padding: 6px 12px; line-height: 1; }

  /* Decision-step options: label, detail, and an optional "go to step #" */
  .do-editor { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .do-row { display: flex; gap: 8px; align-items: center; }
  .do-row .do-label { flex: 2; font: 400 13.5px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .do-row .do-detail { flex: 2; font: 400 13.5px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .do-row .do-goto { flex: 1; min-width: 0; font: 400 13.5px Barlow, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .do-row .do-remove { padding: 6px 12px; line-height: 1; }

  /* Progressive disclosure for the less-common Add/Edit SOP fields */
  .edit-details { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 4px 16px 16px; margin-bottom: 20px; }
  .edit-details summary { cursor: pointer; padding: 12px 0; font: 700 13px Barlow, sans-serif; color: var(--text-secondary); list-style: none; }
  .edit-details summary::-webkit-details-marker { display: none; }
  .edit-details summary::before { content: "\25b8"; display: inline-block; margin-right: 8px; transition: transform .12s; }
  .edit-details[open] summary::before { transform: rotate(90deg); }
  .edit-details .edit-field:last-child { margin-bottom: 0; }

  /* Add-SOP-as-document modal + confirmation popup */
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,14,26,.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 28px; max-width: 420px; text-align: center; }
  .modal-box h3 { font: 700 18px Barlow, sans-serif; margin-bottom: 10px; }
  .modal-box p { color: var(--text-secondary); margin-bottom: 20px; font-size: 14px; line-height: 1.5; }
  .modal-box.modal-box-wide { max-width: 560px; }
  .choice-row { display: flex; gap: 14px; margin-top: 4px; }
  .choice-card { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 22px 16px; cursor: pointer; font: inherit; color: var(--text-primary); transition: border-color .12s, transform .12s; }
  .choice-card:hover { border-color: var(--yellow); transform: translateY(-2px); }
  .choice-icon { font-size: 30px; margin-bottom: 4px; }
  .choice-title { font: 700 15px Barlow, sans-serif; }
  .choice-desc { font: 400 12.5px/1.4 Barlow, sans-serif; color: var(--text-secondary); }
  @media (max-width: 520px) { .choice-row { flex-direction: column; } }
  .edit-actions { display: flex; gap: 10px; margin-top: 24px; }

  /* ---- Run mode ---- */
  #run-root { display: none; min-height: 100vh; background: var(--canvas); }
  .run-shell { width: 100%; max-width: 460px; min-height: 100vh; margin: 0 auto; background: var(--surface); display: flex; flex-direction: column; box-shadow: 0 0 0 1px var(--border); }
  .run-top { padding: 16px 20px 12px; }
  .run-top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .run-top-row .exit { font: 600 13px Barlow, sans-serif; color: var(--text-muted); cursor: pointer; }
  .run-top-row .exit:hover { color: var(--navy); }
  .run-top-row .pause-btn { font: 600 13px Barlow, sans-serif; color: var(--text-muted); background: none; border: none; cursor: pointer; }
  .run-top-row .pause-btn:hover { color: var(--navy); }
  .progress-track { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--yellow); transition: width .2s ease; }
  .step-counter { display: flex; justify-content: space-between; margin-top: 8px; }
  .run-body { flex: 1; padding: 4px 20px 20px; display: flex; flex-direction: column; }
  .sop-name { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 6px; }
  .step-card { flex: 1; }
  .step-card h2 { font: 600 27px/1.2 Barlow, sans-serif; letter-spacing: -.01em; text-wrap: balance; margin-bottom: 14px; }
  .step-card .body-text { font-size: 15px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 20px; }
  .check-item { display: flex; align-items: center; gap: 12px; padding: 14px 14px; border-radius: var(--radius-md); background: var(--card-bg); border: 1px solid var(--border); margin-bottom: 10px; cursor: pointer; font: 600 14.5px Barlow, sans-serif; transition: background .12s, border-color .12s; }
  .check-item.checked { background: var(--green-bg); border-color: var(--green); }
  .check-item .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border-strong); flex-shrink: 0; display: grid; place-items: center; background: var(--surface); font-size: 12px; color: transparent; }
  .check-item.checked .box { background: var(--green); border-color: var(--green); color: var(--surface); }
  .option-item { display: flex; flex-direction: column; gap: 3px; padding: 14px; border-radius: var(--radius-md); background: var(--card-bg); border: 2px solid var(--border); margin-bottom: 10px; cursor: pointer; }
  .option-item .label { font: 700 15px Barlow, sans-serif; }
  .option-item .detail { font-size: 12.5px; color: var(--text-muted); }
  .option-item.selected { border-color: var(--navy); background: var(--surface); }
  .flag-link { align-self: flex-start; font: 600 13px Barlow, sans-serif; color: var(--text-faint); background: none; border: none; cursor: pointer; margin-top: auto; padding-top: 16px; }
  .flag-link:hover { color: var(--navy); }
  .flag-link.flagged { color: var(--amber-dark); }
  .step-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .phase-eyebrow { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 2px; }
  .run-footer { padding: 16px 20px 24px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
  .run-footer .btn { flex: 1; }
  .run-footer .btn-secondary { flex: 0 0 auto; padding-left: 18px; padding-right: 18px; }
  .pause-overlay { position: fixed; inset: 0; background: rgba(10,14,26,.88); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 20; color: #fff; text-align: center; padding: 20px; }
  .pause-overlay.show { display: flex; }
  .pause-overlay h3 { font: 600 22px Barlow, sans-serif; }
  .complete-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 0; }
  .complete-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--green-bg); color: var(--green); display: grid; place-items: center; font-size: 30px; margin-bottom: 18px; }
  .complete-screen h2 { font: 600 30px/1.15 Barlow, sans-serif; letter-spacing: -.015em; margin-bottom: 6px; text-wrap: balance; }
  .complete-screen .sub { color: var(--text-muted); margin-bottom: 24px; }

<script>
/* ============================== DATA ============================== */
const DEPARTMENTS = [
  { id: "operations", name: "Operations" },
  { id: "sales", name: "Sales" },
  { id: "cx", name: "Customer Experience" },
  { id: "installations", name: "Installations" },
  { id: "marketing", name: "Marketing" },
  { id: "accounts", name: "Accounts" },
  { id: "exec", name: "General HR" },
];

const STATUSES = [
  { id: "current", label: "Current" },
  { id: "review-due", label: "Review due" },
  { id: "overdue", label: "Overdue" },
  { id: "draft", label: "Draft" },
];

const DEPT_CODES = { operations: "OPS", sales: "SAL", cx: "CX", installations: "INS", marketing: "MKT", accounts: "ACC", exec: "EXA" };
// There are only 2 shared logins now: Admin (full management rights) and
// Member (can view, suggest, and add a new SOP, but an edit to an
// EXISTING SOP goes in as a pending proposal an Admin must approve --
// see proposeSopEdit/approveSopEdit/rejectSopEdit). DEPARTMENTS above is
// now purely a categorization tag on a SOP (which team it belongs to),
// unrelated to who's logged in.
const LOGINS = [
  { id: "admin", name: "Admin", code: "ADM" },
  { id: "member", name: "Member", code: "MEM" },
];
function isAdmin(viewer) {
  return !!viewer && viewer.id === "admin";
}
// CURRENT_VIEWER also carries `passcode` and `lastName` fields -- the
// shared login passcode and the person's own last name (for attribution
// only, not auth), both cached in this browser so writes don't ask for
// them every time. Neither ever leaves the browser except as arguments to
// the passcode-gated RPC calls in api.js, each of which re-verifies the
// passcode server-side; the last name is never itself verified, only
// recorded.
function getViewer() {
  try {
    const raw = localStorage.getItem("cave-handbook-viewer");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function setViewer(role) {
  try {
    role ? localStorage.setItem("cave-handbook-viewer", JSON.stringify(role)) : localStorage.removeItem("cave-handbook-viewer");
  } catch (e) {}
}
let CURRENT_VIEWER = getViewer();

/* ============================== SUGGESTIONS (shared, per-SOP) ============================== */
let SUGGESTIONS = [];
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return escapeHtml(str || "").replace(/"/g, "&quot;");
}
// Step bodies are plain text from a textarea -- line breaks the author
// typed need to survive into the rendered <p>, which HTML otherwise
// collapses.
function bodyHtml(text) {
  return escapeHtml(text || "").replace(/\n/g, "<br>");
}
function initialsFrom(name) {
  return (name || "").split(/\s+/).filter(Boolean).map((w) => w[0]).join("").toUpperCase().slice(0, 3) || "NA";
}
function suggestionsFor(sopId) {
  return SUGGESTIONS.filter((s) => s.sopId === sopId).sort((a, b) => b.ts - a.ts);
}
function suggestionStatus(s) {
  return s.status || "pending";
}
// Admin can delete any suggestion; otherwise only whoever's cached
// last name matches the one on the suggestion -- same soft-identity
// model as the rest of the app (last name is attribution, not a real
// login, so this is a UI nicety backed by a matching server-side check
// in delete_suggestion, not a hard security boundary).
function canDeleteSuggestion(s) {
  if (!CURRENT_VIEWER) return false;
  return isAdmin(CURRENT_VIEWER) || CURRENT_VIEWER.lastName === s.lastName;
}
function suggestionItemHtml(s) {
  const deleteBtn = canDeleteSuggestion(s)
    ? `<div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn btn-danger" data-delete-suggestion="${s.id}">Delete</button></div>`
    : "";
  return `<div class="suggestion-item">
    <div class="suggestion-meta"><span class="suggestion-dept">${escapeHtml(s.lastName)} (${s.loginName})</span><span class="suggestion-status suggestion-status-${suggestionStatus(s)}">${suggestionStatus(s) === "approved" ? "Approved" : "Pending"}</span><span class="suggestion-date">${new Date(s.ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span></div>
    <p class="suggestion-text">${escapeHtml(s.text)}</p>
    ${deleteBtn}
  </div>`;
}
function suggestionsSectionHtml(sop) {
  const list = suggestionsFor(sop.id);
  const items = list.length
    ? list.map(suggestionItemHtml).join("")
    : `<p class="muted small">No suggestions yet. Be the first to flag an improvement.</p>`;
  const prompt = CURRENT_VIEWER
    ? `<div class="suggestion-form">
        <textarea id="suggestion-input" rows="3" placeholder="Suggest an improvement to this SOP..."></textarea>
        <div class="suggestion-form-row">
          <span class="muted small">Posting as <strong>${escapeHtml(CURRENT_VIEWER.lastName)}</strong> (${CURRENT_VIEWER.name})</span>
          <button class="btn btn-primary" id="suggestion-submit">Send suggestion</button>
        </div>
        <p class="muted small" id="suggestion-status" style="min-height:16px"></p>
      </div>`
    : `<div class="suggestion-form suggestion-form-locked">
        <p class="muted small">Log in to leave a suggestion.</p>
        <button class="btn btn-secondary" id="suggestion-pick-viewer">Log in</button>
      </div>`;
  return `<div class="section" id="section-suggestions">
    <h2>Suggestions &amp; feedback</h2>
    <div class="suggestion-list" id="suggestion-list">${items}</div>
    ${prompt}
  </div>`;
}
function wireDeleteSuggestionButtons(afterDelete) {
  document.querySelectorAll("[data-delete-suggestion]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!CURRENT_VIEWER) return;
      const ok = confirm("Delete this suggestion?");
      if (!ok) return;
      btn.disabled = true;
      btn.textContent = "Deleting...";
      try {
        await API.deleteSuggestion(btn.dataset.deleteSuggestion, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName);
        SUGGESTIONS = SUGGESTIONS.filter((s) => s.id !== btn.dataset.deleteSuggestion);
        afterDelete();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Delete";
        alert("Couldn't delete: " + err.message);
      }
    });
  });
}
function wireSuggestionsSection(sop) {
  function refreshSuggestionList() {
    document.getElementById("suggestion-list").innerHTML = suggestionsFor(sop.id).length
      ? suggestionsFor(sop.id).map(suggestionItemHtml).join("")
      : `<p class="muted small">No suggestions yet. Be the first to flag an improvement.</p>`;
    wireDeleteSuggestionButtons(refreshSuggestionList);
  }
  const pickBtn = document.getElementById("suggestion-pick-viewer");
  if (pickBtn) pickBtn.addEventListener("click", (e) => { e.stopPropagation(); openViewerMenu(); });
  wireDeleteSuggestionButtons(refreshSuggestionList);
  const submitBtn = document.getElementById("suggestion-submit");
  if (!submitBtn) return;
  submitBtn.addEventListener("click", async (e) => {
    const input = document.getElementById("suggestion-input");
    const status = document.getElementById("suggestion-status");
    const text = input.value.trim();
    if (!text) { status.textContent = "Write a suggestion before sending."; return; }
    if (!CURRENT_VIEWER) { e.stopPropagation(); openViewerMenu(); return; }
    submitBtn.disabled = true;
    status.textContent = "Sending...";
    try {
      const id = await API.addSuggestion(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName, text);
      SUGGESTIONS.push({ id, sopId: sop.id, loginId: CURRENT_VIEWER.id, loginName: CURRENT_VIEWER.name, lastName: CURRENT_VIEWER.lastName, text, ts: Date.now(), status: "pending" });
      refreshSuggestionList();
      input.value = "";
      status.textContent = "Saved to the shared board.";
    } catch (err) {
      status.textContent = "Couldn't send: " + err.message;
    }
    submitBtn.disabled = false;
  });
}

let SOPS = []; // populated from the DB at boot (see loadData())
let DIRECTORY = []; // populated from directory_entries at boot (see boot())
let DIRECTORY_EDIT_PROPOSALS = []; // populated from directory_edit_proposals at boot (see boot())

function getSop(id) { return SOPS.find((s) => s.id === id); }
function getDepartment(id) { return DEPARTMENTS.find((d) => d.id === id); }
function sopsByDepartment(deptId) { return SOPS.filter((s) => s.department === deptId); }
function statusMeta(statusId) { return STATUSES.find((s) => s.id === statusId); }
// sop.version was stored as a single string baked in at creation time
// (e.g. "v1 (draft)") and nothing ever updates it when the SOP is later
// approved/edited -- it just goes stale ("(draft)" shown next to an
// already-Current badge). The status badge is the live source of truth,
// so this only ever shows the plain "v1" part.
function versionLabel(v) { return (v || "").replace(/\s*\([^)]*\)\s*$/, "").trim(); }

/* ============================== SOP HISTORY (approvals + edits) ============================== */
let EVENTS = []; // populated from the sop_events table at boot (see loadData())
function sopTimeline(sopId) {
  return EVENTS.filter((e) => e.sopId === sopId).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}
const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function eventStamp() {
  const now = new Date();
  return {
    ts: now.getTime(),
    fullDate: `${now.getDate()} ${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}`,
    monthYear: `${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}`,
  };
}

const STATUS_COLOR = { current: "var(--green)", "review-due": "var(--amber)", overdue: "var(--red)", draft: "var(--draft)" };
const appShell = document.getElementById("app-shell");
const runRoot = document.getElementById("run-root");
const pageBody = document.getElementById("page-body");

/* ============================== THEME ============================== */
(function initTheme() {
  let stored = null;
  try { stored = localStorage.getItem("cave-handbook-theme"); } catch (e) {}
  if (stored === "dark" || stored === "light") document.documentElement.setAttribute("data-theme", stored);
  updateThemeIcon();
})();
function updateThemeIcon() {
  const attr = document.documentElement.getAttribute("data-theme");
  const btn = document.getElementById("theme-toggle");
  btn.textContent = attr === "dark" ? String.fromCharCode(9728) : attr === "light" ? String.fromCharCode(9789) : String.fromCharCode(9681);
}
document.getElementById("theme-toggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  let next;
  if (!current) next = sysDark ? "light" : "dark";
  else if (current === "dark") next = "light";
  else next = null;
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try { next ? localStorage.setItem("cave-handbook-theme", next) : localStorage.removeItem("cave-handbook-theme"); } catch (e) {}
  updateThemeIcon();
});

/* ============================== VIEWER ("who's viewing?") ============================== */
function updateViewerAvatar() {
  document.getElementById("viewer-btn").textContent = CURRENT_VIEWER ? CURRENT_VIEWER.code : "?";
}
// Picking Admin/Member doesn't log you in by itself -- it shows last-name
// and passcode fields. login() re-verifies the passcode against the
// database on every call; a wrong passcode never sets CURRENT_VIEWER.
let pendingLoginId = null;
function renderViewerMenu() {
  const menu = document.getElementById("viewer-menu");
  const items = LOGINS.map((l) => {
    const selected = CURRENT_VIEWER && CURRENT_VIEWER.id === l.id;
    if (pendingLoginId === l.id) {
      return `<div class="vm-item-login" data-login="${l.id}">
        <div class="vm-item selected"><span class="vm-dot">${l.code}</span><span>${l.name}</span></div>
        <input type="text" class="vm-passcode-input" id="vm-lastname-input" placeholder="Your last name" autocomplete="off">
        <input type="password" class="vm-passcode-input" id="vm-passcode-input" placeholder="Passcode" autocomplete="off">
        <div class="row" style="gap:8px;margin-top:8px">
          <button class="btn btn-primary" id="vm-login-btn" style="flex:1">Log in</button>
          <button class="btn btn-secondary" id="vm-login-cancel">Cancel</button>
        </div>
        <p class="muted small" id="vm-login-error" style="min-height:16px;margin-top:6px"></p>
      </div>`;
    }
    return `<div class="vm-item ${selected ? "selected" : ""}" data-login="${l.id}">
      <span class="vm-dot">${l.code}</span><span>${l.name}</span>
    </div>`;
  }).join("");
  menu.innerHTML = `
    <div class="vm-label">Log in as</div>
    ${items}
    <div class="vm-clear"><div class="vm-item" id="vm-clear-item"><span class="vm-dot">?</span><span>Not sure / log out</span></div></div>`;

  menu.querySelectorAll(".vm-item[data-login]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      pendingLoginId = el.dataset.login;
      renderViewerMenu();
      const input = document.getElementById("vm-lastname-input");
      if (input) input.focus();
    });
  });

  const loginBtn = document.getElementById("vm-login-btn");
  if (loginBtn) {
    const lastNameInput = document.getElementById("vm-lastname-input");
    const input = document.getElementById("vm-passcode-input");
    const errEl = document.getElementById("vm-login-error");
    const doLogin = async () => {
      const lastName = lastNameInput.value.trim();
      const passcode = input.value;
      if (!lastName) { errEl.textContent = "Enter your last name."; return; }
      if (!passcode) { errEl.textContent = "Enter the passcode."; return; }
      loginBtn.disabled = true;
      loginBtn.textContent = "Checking...";
      try {
        const login = await API.login(pendingLoginId, passcode);
        CURRENT_VIEWER = { id: login.id, name: login.name, code: login.code, passcode, lastName };
        setViewer(CURRENT_VIEWER);
        pendingLoginId = null;
        updateViewerAvatar();
        closeViewerMenu();
        render();
      } catch (err) {
        loginBtn.disabled = false;
        loginBtn.textContent = "Log in";
        errEl.textContent = "Wrong passcode.";
      }
    };
    loginBtn.addEventListener("click", (e) => { e.stopPropagation(); doLogin(); });
    input.addEventListener("click", (e) => e.stopPropagation());
    lastNameInput.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
    lastNameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") input.focus(); });
    document.getElementById("vm-login-cancel").addEventListener("click", (e) => {
      e.stopPropagation();
      pendingLoginId = null;
      renderViewerMenu();
    });
  }

  document.getElementById("vm-clear-item").addEventListener("click", () => {
    CURRENT_VIEWER = null;
    setViewer(null);
    pendingLoginId = null;
    updateViewerAvatar();
    closeViewerMenu();
    render();
  });
}
function openViewerMenu() {
  renderViewerMenu();
  document.getElementById("viewer-menu").classList.add("open");
  document.getElementById("viewer-btn").setAttribute("aria-expanded", "true");
}
function closeViewerMenu() {
  document.getElementById("viewer-menu").classList.remove("open");
  document.getElementById("viewer-btn").setAttribute("aria-expanded", "false");
  pendingLoginId = null;
}
updateViewerAvatar();
document.getElementById("viewer-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  const menu = document.getElementById("viewer-menu");
  menu.classList.contains("open") ? closeViewerMenu() : openViewerMenu();
});
document.addEventListener("click", (e) => {
  const wrap = document.querySelector(".viewer-wrap");
  if (wrap && !wrap.contains(e.target)) closeViewerMenu();
});

/* ============================== MOBILE MENU ============================== */
document.getElementById("hamburger-btn").addEventListener("click", (e) => {

document.addEventListener("click", (e) => {

// Closes an open Directory org-chart tooltip (tapped open for touch
// screens, since they have no :hover) on any click outside it.
document.addEventListener("click", () => {
  document.querySelectorAll(".person-node.open").forEach((o) => o.classList.remove("open"));
});

/* ============================== ROUTER ============================== */
function parseHash() {
  let hash = location.hash.slice(1) || "/";
  const qIdx = hash.indexOf("?");
  const path = qIdx === -1 ? hash : hash.slice(0, qIdx);
  const params = new URLSearchParams(qIdx === -1 ? "" : hash.slice(qIdx + 1));
  return { path, params };
}
function go(path) { location.hash = "#" + path; }

let NAV_STACK = [];
function pushNav() {
  const h = location.hash || "#/";
  if (NAV_STACK[NAV_STACK.length - 1] !== h) NAV_STACK.push(h);
  if (NAV_STACK.length > 50) NAV_STACK.shift();
}
// Always clickable, even with no in-app history yet (fresh page load or
// a direct/shared link) -- it just goes Home in that case, rather than
// being disabled and looking broken. NAV_STACK only lives in memory, so
// a page refresh always starts it empty regardless of where the browser
// itself has actually been.
function goBack() {
  if (NAV_STACK.length > 1) {
    NAV_STACK.pop();
    location.hash = NAV_STACK[NAV_STACK.length - 1];
  } else {
    go("/");
  }
}
document.getElementById("nav-back-btn").addEventListener("click", goBack);

document.getElementById("brand-link").addEventListener("click", () => go("/"));
document.getElementById("topnav").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-route]");
  if (!a) return;
  document.getElementById("topnav").classList.remove("open");
  const r = a.dataset.route;
  if (r === "#") return;
  go(r);
});

let librarySearchQuery = "";
const globalSearch = document.getElementById("global-search");
globalSearch.addEventListener("input", (e) => {
  librarySearchQuery = e.target.value;
  const { path } = parseHash();
  if (path === "/library") {
    renderCards();
  } else if (librarySearchQuery.trim()) {
    go("/library");
  }
});

// Shown instead of any page content until someone logs in. Similar
// reveal-a-passcode-field pattern to the topbar viewer menu, laid out as a
// full page instead of a dropdown -- but with its OWN pending-selection
// state (gatePendingLoginId), deliberately not shared with the topbar
// menu's pendingLoginId. The gate lives inside #page-body, outside
// .viewer-wrap, so any click on it also bubbles to the document-level
// "close the topbar menu on outside click" listener; that listener resets
// pendingLoginId as a side effect, which was clobbering this gate's
// selection out from under it when the two shared one variable.
let gatePendingLoginId = null;
function renderLoginGate() {
  const items = LOGINS.map((l) => {
    if (gatePendingLoginId === l.id) {
      return `<div class="vm-item-login" data-login="${l.id}">
        <div class="vm-item selected"><span class="vm-dot">${l.code}</span><span>${l.name}</span></div>
        <input type="text" class="vm-passcode-input" id="gate-lastname-input" placeholder="Your last name" autocomplete="off">
        <input type="password" class="vm-passcode-input" id="gate-passcode-input" placeholder="Passcode" autocomplete="off">
        <div class="row" style="gap:8px;margin-top:8px">
          <button class="btn btn-primary" id="gate-login-btn" style="flex:1">Log in</button>
          <button class="btn btn-secondary" id="gate-login-cancel">Cancel</button>
        </div>
        <p class="muted small" id="gate-login-error" style="min-height:16px;margin-top:6px"></p>
      </div>`;
    }
    return `<div class="vm-item" data-login="${l.id}"><span class="vm-dot">${l.code}</span><span>${l.name}</span></div>`;
  }).join("");

  pageBody.innerHTML = `
    <div class="login-gate-wrap">
      <div class="brand-mark">&#127921;</div>
      <h1>Cave Handbook</h1>
      <p class="muted">Log in and enter your last name to continue.</p>
      <div class="login-gate">${items}</div>
    </div>`;

  pageBody.querySelectorAll(".login-gate .vm-item[data-login]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      gatePendingLoginId = el.dataset.login;
      renderLoginGate();
      const input = document.getElementById("gate-lastname-input");
      if (input) input.focus();
    });
  });

  const loginBtn = document.getElementById("gate-login-btn");
  if (loginBtn) {
    const lastNameInput = document.getElementById("gate-lastname-input");
    const input = document.getElementById("gate-passcode-input");
    const errEl = document.getElementById("gate-login-error");
    const doLogin = async () => {
      const lastName = lastNameInput.value.trim();
      const passcode = input.value;
      if (!lastName) { errEl.textContent = "Enter your last name."; return; }
      if (!passcode) { errEl.textContent = "Enter the passcode."; return; }
      loginBtn.disabled = true;
      loginBtn.textContent = "Checking...";
      try {
        const login = await API.login(gatePendingLoginId, passcode);
        CURRENT_VIEWER = { id: login.id, name: login.name, code: login.code, passcode, lastName };
        setViewer(CURRENT_VIEWER);
        gatePendingLoginId = null;
        updateViewerAvatar();
        render();
      } catch (err) {
        loginBtn.disabled = false;
        loginBtn.textContent = "Log in";
        errEl.textContent = "Wrong passcode.";
      }
    };
    loginBtn.addEventListener("click", (e) => { e.stopPropagation(); doLogin(); });
    input.addEventListener("click", (e) => e.stopPropagation());
    lastNameInput.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
    lastNameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") input.focus(); });
    document.getElementById("gate-login-cancel").addEventListener("click", (e) => {
      e.stopPropagation();
      gatePendingLoginId = null;
      renderLoginGate();
    });
  }
}

function render() {
  if (!CURRENT_VIEWER) {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderLoginGate();
    return;
  }
  const { path, params } = parseHash();
  window.scrollTo(0, 0);
  pushNav();
  document.querySelectorAll("#topnav a").forEach((a) => a.classList.remove("active"));
  if (path === "/") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    document.querySelector('#topnav a[data-route="/"]').classList.add("active");
    renderHome();
  } else if (path === "/library") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    document.querySelectorAll('#topnav a[data-route="/library"]')[0].classList.add("active");
    globalSearch.value = librarySearchQuery;
    renderLibrary(params);
  } else if (path === "/suggestions") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    document.querySelectorAll('#topnav a[data-route="/suggestions"]')[0].classList.add("active");
    renderSuggestionsPage();
  } else if (path === "/queue") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    document.querySelectorAll('#topnav a[data-route="/queue"]')[0].classList.add("active");
    renderQueue();
  } else if (path === "/directory") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    document.querySelectorAll('#topnav a[data-route="/directory"]')[0].classList.add("active");
    renderDirectory();
  } else if (path === "/directory/new") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderDirectoryNew();
  } else if (path.indexOf("/directory/edit/") === 0) {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderDirectoryEdit(decodeURIComponent(path.slice(16)));
  } else if (path === "/new") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderSopNew();
  } else if (path === "/new/document") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderSopNewDocument();
  } else if (path.indexOf("/edit/") === 0) {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderSopEdit(decodeURIComponent(path.slice(6)));
  } else if (path.indexOf("/sop/") === 0) {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderSopDetail(decodeURIComponent(path.slice(5)));
  } else if (path.indexOf("/run/") === 0) {
    appShell.style.display = "none"; runRoot.style.display = "block";
    renderRun(decodeURIComponent(path.slice(5)));
  } else {
    go("/");
  }
}
window.addEventListener("hashchange", render);

/* ============================== HOME ============================== */
function renderHome() {
  const h = new Date().getHours();
  const word = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";

  const tiles = DEPARTMENTS.map((d) => {
    const sops = sopsByDepartment(d.id);
    const total = sops.length;
    const segments = STATUSES.map((s) => {
      const n = sops.filter((x) => x.status === s.id).length;
      if (!n) return "";
      const pct = (n / total) * 100;
      return `<span style="width:${pct}%;background:${STATUS_COLOR[s.id]}"></span>`;
    }).join("");
    return `<a class="dept-tile" data-dept="${d.id}"><div class="count">${total}</div><div class="name">${d.name}</div><div class="bar">${segments}</div></a>`;
  }).join("");

  let waiting;
  if (!CURRENT_VIEWER) {
    waiting = `<div class="waiting-cta"><p class="muted small">Log in to see what needs attention.</p><button class="btn btn-secondary" id="waiting-set-viewer">Log in</button></div>`;
  } else if (!isAdmin(CURRENT_VIEWER)) {
    waiting = `<p class="muted small">SOP approvals are handled by an Admin.</p>`;
  } else {
    const mine = SOPS.filter((s) => s.status === "overdue" || s.status === "review-due");
    waiting = mine.length
      ? mine.map((s) => {
          const label = s.status === "overdue" ? "Sign off" : "Review due";
          return `<div class="queue-item">
            <span class="badge badge-${s.status}">${statusMeta(s.status).label}</span>
            <div><div class="title">${label}: ${s.title}</div><div class="sub">${s.owner.name}</div></div>
            <a class="btn btn-secondary go" data-sop="${s.id}">Open</a>
          </div>`;
        }).join("")
      : `<p class="muted small">Nothing needs attention right now.</p>`;
  }

  const health = DEPARTMENTS.map((d) => {
    const sops = sopsByDepartment(d.id);
    const total = sops.length || 1;
    const segments = STATUSES.map((s) => {
      const n = sops.filter((x) => x.status === s.id).length;
      if (!n) return "";
      const pct = (n / total) * 100;
      return `<span style="width:${pct}%;background:${STATUS_COLOR[s.id]}"></span>`;
    }).join("");
    const overdue = sops.filter((s) => s.status === "overdue").length;
    return `<div class="health-row"><div class="dept-name">${d.name}</div><div class="health-track">${segments}</div><div class="health-count">${overdue ? overdue + " overdue" : "on track"}</div></div>`;
  }).join("");

  pageBody.innerHTML = `
    <div class="dash-greeting">
      <h1>${word}.</h1>
      <p class="muted">${CURRENT_VIEWER ? "Here's what's happening across the Handbook today, " + escapeHtml(CURRENT_VIEWER.lastName) + "." : "Here's what's happening across the Handbook today."}</p>
    </div>
    <div class="dept-tiles">${tiles}</div>
    <div class="dash-columns">
      <div class="panel"><h2>Needs attention</h2>${waiting}</div>
      <div class="panel"><h2>Team health</h2>${health}</div>
    </div>`;

  pageBody.querySelectorAll(".dept-tile").forEach((el) => el.addEventListener("click", () => go("/library?dept=" + el.dataset.dept)));
  const waitingBtn = document.getElementById("waiting-set-viewer");
  if (waitingBtn) waitingBtn.addEventListener("click", (e) => { e.stopPropagation(); openViewerMenu(); });
  pageBody.querySelectorAll("[data-sop]").forEach((el) => el.addEventListener("click", () => go("/sop/" + el.dataset.sop)));
}

  document.getElementById("status-filter").innerHTML = items.map((s) => {

    const dot = s.id === "all" ? "" : `<span class="dot" style="background:${STATUS_COLOR[s.id]}"></span>`;
