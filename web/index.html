/* ============================== SUGGESTIONS REVIEW ============================== */
let reviewFilter = "pending";
function renderSuggestionsPage() {
  const all = SUGGESTIONS.slice().sort((a, b) => b.ts - a.ts);
  const counts = {
    all: all.length,
    pending: all.filter((s) => suggestionStatus(s) === "pending").length,
    approved: all.filter((s) => suggestionStatus(s) === "approved").length,
  };
  const list = reviewFilter === "all" ? all : all.filter((s) => suggestionStatus(s) === reviewFilter);

  const filterDefs = [
    { id: "pending", label: "Pending" },
    { id: "approved", label: "Approved" },
    { id: "all", label: "All" },
  ];
  const filters = filterDefs.map((f) => `<button data-filter="${f.id}" class="${reviewFilter === f.id ? "active" : ""}">${f.label} (${counts[f.id]})</button>`).join("");

  const rows = list.length
    ? list.map((s) => {
        const sop = getSop(s.sopId);
        const sopDept = sop ? getDepartment(sop.department) : null;
        const status = suggestionStatus(s);
        let actionHtml = "";
        if (status === "approved") {
          actionHtml = `<span class="review-note">Approved by ${s.approvedBy ? s.approvedBy.lastName : "—"}${s.approvedDate ? " · " + s.approvedDate : ""}</span>`;
        } else if (!sop) {
          actionHtml = `<span class="review-note">This SOP no longer exists.</span>`;
        } else if (!CURRENT_VIEWER) {
          actionHtml = `<button class="btn btn-secondary" disabled title="Log in as Admin to approve">Approve</button>`;
        } else if (!isAdmin(CURRENT_VIEWER)) {
          actionHtml = `<button class="btn btn-secondary" disabled title="Only an Admin can approve this">Approve</button>`;
        } else {
          actionHtml = `<button class="btn btn-secondary" data-approve="${s.id}">Approve</button>`;
        }
        const targetHtml = sop
          ? `<div class="target" data-sop="${sop.id}">${sop.title}${sopDept ? " &middot; " + sopDept.name : ""}</div>`
          : `<div class="target">Unknown SOP</div>`;
        const deleteBtn = canDeleteSuggestion(s) ? `<button class="btn btn-danger" data-delete-suggestion="${s.id}">Delete</button>` : "";
        return `<div class="review-item">
          <div class="suggestion-meta">
            <span class="suggestion-dept">${escapeHtml(s.lastName)} (${s.loginName})</span>
            <span class="suggestion-status suggestion-status-${status}">${status === "approved" ? "Approved" : "Pending"}</span>
            <span class="suggestion-date">${new Date(s.ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span>
          </div>
          ${targetHtml}
          <p class="suggestion-text">${escapeHtml(s.text)}</p>
          <div class="review-footer">${actionHtml}${deleteBtn}</div>
        </div>`;
      }).join("")
    : `<div class="empty-state">No ${reviewFilter === "all" ? "" : reviewFilter + " "}suggestions yet.</div>`;

  pageBody.innerHTML = `
    <div class="library-header">
      <h1>Suggestions &amp; feedback</h1>
      <div class="view-toggle" id="review-filters">${filters}</div>
    </div>
    <div id="review-list">${rows}</div>
    <div id="edit-proposals-section" style="margin-top:32px">${editProposalsSectionHtml()}</div>
    <div id="directory-proposals-section" style="margin-top:32px">${directoryProposalsSectionHtml()}</div>`;

  document.querySelectorAll("#review-filters [data-filter]").forEach((btn) => {
    btn.addEventListener("click", () => { reviewFilter = btn.dataset.filter; renderSuggestionsPage(); });
  });
  document.querySelectorAll(".review-item .target[data-sop]").forEach((el) => {
    el.addEventListener("click", () => go("/sop/" + el.dataset.sop));
  });
  document.querySelectorAll("[data-approve]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const s = SUGGESTIONS.find((x) => x.id === btn.dataset.approve);
      if (!s || !CURRENT_VIEWER) return;
      btn.disabled = true;
      btn.textContent = "Approving...";
      try {
        await API.approveSuggestion(s.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName);
        s.status = "approved";
        s.approvedBy = { loginId: CURRENT_VIEWER.id, lastName: CURRENT_VIEWER.lastName };
        s.approvedDate = eventStamp().fullDate;
        renderSuggestionsPage();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Approve";
        alert("Couldn't approve: " + err.message);
      }
    });
  });
  wireDeleteSuggestionButtons(() => renderSuggestionsPage());
  wireEditProposalsSection();
  wireDirectoryProposalsSection();
}

/* ============================== PENDING SOP EDITS (Member proposals) ====== */
let EDIT_PROPOSALS = []; // populated from sop_edit_proposals at boot (see boot())
const EDIT_FIELD_LABELS = {
  title: "Title", subtitle: "Subtitle", department: "Department", never_do_this: "Never do this",
  before_you_start: "Before you start", tools_systems: "Tools & systems", steps: "Steps",
  success_criteria: "Success criteria", escalation: "Escalation path", forms: "Additional links",
  source_document_url: "Document", source_document_name: "Document name",
};
const EDIT_FIELD_CAMEL = {
  title: "title", subtitle: "subtitle", department: "department", never_do_this: "neverDoThis",
  before_you_start: "beforeYouStart", tools_systems: "toolsSystems", steps: "steps",
  success_criteria: "successCriteria", escalation: "escalation", forms: "forms",
  source_document_url: "sourceDocumentUrl", source_document_name: "sourceDocumentName",
};
function formatFieldValue(v) {
  if (v === null || v === undefined) return "(none)";
  if (typeof v === "string") return v || "(empty)";
  if (Array.isArray(v)) {
    if (!v.length) return "(none)";
    return v.map((item) => (typeof item === "string" ? item : Object.values(item).filter(Boolean).join(" — "))).join("\n");
  }
  return JSON.stringify(v);
}
// Compares the proposal's saved field values against the SOP's CURRENT
// values and returns only the fields that actually differ -- this is what
// lets the review UI highlight just what changed, not the whole SOP.
function diffProposalFields(sop, fields) {
  const out = [];
  Object.keys(fields || {}).forEach((key) => {
    const camel = EDIT_FIELD_CAMEL[key];
    if (!camel) return;
    let oldVal = sop ? sop[camel] : undefined;
    let newVal = fields[key];
    if (JSON.stringify(oldVal == null ? null : oldVal) === JSON.stringify(newVal == null ? null : newVal)) return;
    if (key === "department") {
      oldVal = (getDepartment(oldVal) || {}).name || oldVal;
      newVal = (getDepartment(newVal) || {}).name || newVal;
    }
    out.push({ key, label: EDIT_FIELD_LABELS[key] || key, oldVal, newVal });
  });
  return out;
}
let editProposalFilter = "pending";
// deptFilterSet (a Set of department ids, or falsy for no filtering) scopes
// this down to proposals on SOPs tagged with one of those departments --
// used by renderQueue()'s "my teams" view. The Suggestions page calls this
// with no argument and sees everything, same as before.
function editProposalsSectionHtml(deptFilterSet) {
  const all = EDIT_PROPOSALS.slice().sort((a, b) => b.ts - a.ts);
  // deptFilterSet (My Queue's "my teams" scoping) only narrows what counts
  // as needing MY attention -- Pending. Approved/Rejected/All stay a
  // complete cross-department record, since those are already-decided
  // history, not an action queue -- otherwise an approved/rejected item
  // outside your own department would just vanish from view entirely.
  const inScope = (p) => !deptFilterSet || (getSop(p.sopId) && deptFilterSet.has(getSop(p.sopId).department));
  const pendingScoped = all.filter((p) => p.status === "pending" && inScope(p));
  const counts = {
    all: all.length,
    pending: pendingScoped.length,
    approved: all.filter((p) => p.status === "approved").length,
    rejected: all.filter((p) => p.status === "rejected").length,
  };
  const list = editProposalFilter === "pending" ? pendingScoped : editProposalFilter === "all" ? all : all.filter((p) => p.status === editProposalFilter);
  const filterDefs = [
    { id: "pending", label: "Pending" },
    { id: "approved", label: "Approved" },
    { id: "rejected", label: "Rejected" },
    { id: "all", label: "All" },
  ];
  const filters = filterDefs.map((f) => `<button data-epfilter="${f.id}" class="${editProposalFilter === f.id ? "active" : ""}">${f.label} (${counts[f.id]})</button>`).join("");

  const rows = list.length
    ? list.map((p) => {
        const sop = getSop(p.sopId);
        const diff = diffProposalFields(sop, p.fields);
        const diffHtml = diff.length
          ? diff.map((d) => `
            <div style="margin-bottom:10px">
              <div class="muted small" style="font-weight:600">${escapeHtml(d.label)}</div>
              <div style="color:var(--red);white-space:pre-wrap">&minus; ${escapeHtml(formatFieldValue(d.oldVal))}</div>
              <div style="color:var(--green);white-space:pre-wrap">+ ${escapeHtml(formatFieldValue(d.newVal))}</div>
            </div>`).join("")
          : `<p class="muted small">No changes detected.</p>`;
        let actionHtml = "";
        if (p.status === "approved") {
          actionHtml = `<span class="review-note">Approved by ${escapeHtml(p.decidedByLastName || "—")}${p.decidedDate ? " · " + p.decidedDate : ""}</span>`;
        } else if (p.status === "rejected") {
          actionHtml = `<span class="review-note">Rejected by ${escapeHtml(p.decidedByLastName || "—")}${p.decidedDate ? " · " + p.decidedDate : ""}</span>`;

const DIRECTORY_FIELD_LABELS = { name: "Name", role: "Role", department: "Department", email: "Email", phone: "Phone", notes: "Notes", reports_to: "Reports to", photo_url: "Photo" };
function personName(id) {
  const p = DIRECTORY.find((x) => x.id === id);
  return p ? p.name : null;
}
function diffDirectoryProposalFields(entry, fields) {
  const out = [];
  Object.keys(fields || {}).forEach((key) => {
    if (!(key in DIRECTORY_FIELD_LABELS)) return;
    const oldVal = entry ? (key === "reports_to" ? entry.reportsTo : key === "photo_url" ? entry.photoUrl : entry[key]) : undefined;
    const newVal = fields[key];
    if ((oldVal || "") === (newVal || "")) return;
    const display = (v) => {
      if (key === "department") return (getDepartment(v) || {}).name || v || "(none)";
      if (key === "reports_to") return v ? (personName(v) || v) : "(none)";
      if (key === "photo_url") return v ? "(photo)" : "(no photo)";
      return v || "(empty)";
    };
    out.push({ key, label: DIRECTORY_FIELD_LABELS[key], oldVal: display(oldVal), newVal: display(newVal) });
  });
  return out;
}
let directoryProposalFilter = "pending";

/* ============================== MY QUEUE (admin approvals) ============================== */
// Matches the last name typed at login against the Directory (same
// soft-identity model as everywhere else -- never verified, just a
// convenience match) so My Queue can scope itself to "my teams" by
// default. If nobody in the Directory shares that last name, or the
// admin picks "Show everything", no filtering happens -- this never
// silently hides anything, it's purely a default declutter.
// Checks every word in the Directory entry's name, not just the last one
// -- a person matches on their actual last name ("Allsop" -> "Ross
// Allsop"), but this also lets a team-style entry like "VNC Team" match
// on "VNC" typed at login, so a group with no single owner can still log
// in as Admin and get scoped to their own team's queue.
function findDirectoryPersonByLastName(lastName) {
  const norm = (lastName || "").trim().toLowerCase();
  if (!norm) return [];
  return DIRECTORY.filter((p) => {
    const parts = (p.name || "").trim().toLowerCase().split(/\s+/);
    return parts.includes(norm);
  });
}
function directoryDescendants(personId) {
  const out = [];
  const seen = new Set();
  const stack = DIRECTORY.filter((p) => p.reportsTo === personId);
  while (stack.length) {
    const p = stack.pop();
    if (seen.has(p.id)) continue;
    seen.add(p.id);
    out.push(p);
    DIRECTORY.filter((c) => c.reportsTo === p.id).forEach((c) => stack.push(c));
  }
  return out;
}
// Returns a Set of department ids this person (matched by last name)
// manages -- their own department plus every direct/indirect report's --
// or null if their last name doesn't match anyone in the Directory.
function myManagedDepartments(lastName) {
  const matches = findDirectoryPersonByLastName(lastName);
  if (!matches.length) return null;
  const deptIds = new Set();
  matches.forEach((person) => {
    deptIds.add(person.department);
    directoryDescendants(person.id).forEach((d) => deptIds.add(d.department));
  });
  return deptIds;
}

// Decides how to present an attached document/link: a real embed when the
// destination allows being framed, otherwise a plain "Open" card. Claude
// artifact pages set frame-ancestors 'self' in their CSP -- they can
// never be embedded on another site, only linked to, so that's a card,
// not an iframe. Loom's /share/ links get rewritten to their dedicated
// /embed/ URL, which Loom explicitly supports framing for.
// Pulls the video id out of any of YouTube's URL shapes (watch, youtu.be
// short links, already-an-embed link, or a Shorts link) so it can be
// pointed at youtube.com/embed/ -- YouTube's own supported embed path,
// same idea as Loom's /embed/ below.
function youtubeEmbedId(url) {
  let u;
  try { u = new URL(url); } catch (e) { return null; }
  const host = u.hostname.replace(/^(www\.|m\.)/, "");
  if (host === "youtu.be") return u.pathname.slice(1).split("/")[0] || null;
  if (host === "youtube.com") {
    if (u.pathname === "/watch") return u.searchParams.get("v");
    const m = /^\/(embed|shorts|live)\/([^/?]+)/.exec(u.pathname);
    if (m) return m[2];
  }
  return null;
}
function documentEmbedHtml(url, name) {
  let hostname = "";
  try { hostname = new URL(url).hostname; } catch (e) {}
  const label = name || "Document";

  if (/(^|\.)claude\.ai$/.test(hostname)) {
    return {
      embedHtml: `<div class="document-open-card"><span>&#129513; Claude Artifact${name ? ": " + escapeHtml(name) : ""}</span><a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">Open artifact</a></div>`,
      showOpenLink: false,
    };
  }
  const loomMatch = /loom\.com\/share\/([a-zA-Z0-9]+)/.exec(url);
  if (loomMatch) {
    const embedUrl = `https://www.loom.com/embed/${loomMatch[1]}`;
    return {
      embedHtml: `<iframe src="${embedUrl}" class="document-embed" allow="autoplay; fullscreen" allowfullscreen title="${escapeAttr(label)}"></iframe>`,
      showOpenLink: true,
    };
  }
  const ytId = youtubeEmbedId(url);
  if (ytId) {
    const embedUrl = `https://www.youtube.com/embed/${ytId}`;
    return {
      embedHtml: `<iframe src="${embedUrl}" class="document-embed" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="${escapeAttr(label)}"></iframe>`,
      showOpenLink: true,
    };
  }
  const ext = (name || url).split(".").pop().toLowerCase();
  if (ext === "pdf") {
    // A plain <iframe src="the-pdf-url"> only renders inline on browsers
    // with a built-in PDF plugin wired up for iframes -- desktop Chrome
    // has one, but Chrome/Safari/etc on phones don't, so mobile viewers
    // just saw a broken "can't preview, tap Open" placeholder. Instead of
    // relying on the browser's own (inconsistent) PDF handling, point
    // the iframe at our own vendored copy of PDF.js (web/vendor/pdfjs --
    // a pinned stable release, not Mozilla's live/dev build, which broke
    // in testing on a recent Chromium) so the exact same JS-rendered
    // viewer runs identically on every device.
    const viewerUrl = "vendor/pdfjs/web/viewer.html?file=" + encodeURIComponent(url);
    return {
      embedHtml: `<iframe src="${viewerUrl}" class="document-embed" title="${escapeAttr(label)}"></iframe>`,
      showOpenLink: true,
    };
  }
  if (["png", "jpg", "jpeg", "gif", "webp"].includes(ext)) {
    return {
      embedHtml: `<img src="${url}" class="document-embed-img" alt="${escapeAttr(label)}">`,
      showOpenLink: true,
    };
  }
  return {
    embedHtml: `<div class="document-open-card"><span>&#128196; ${escapeHtml(label)}</span><a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">Open document</a></div>`,
    showOpenLink: false,
  };
}

function fieldsFromSop(sop) {

    steps: (sop.steps || []).filter((s) => !s.placeholder),

// A simple "+ Add row" editor for two-column data (Tools & systems,
// Escalation path, Forms) -- replaces the old "Name | Note, one per
// line" textareas, which were an easy syntax to get wrong with no
// feedback when it was. Each row is just two plain inputs.
function kvRowHtml(aVal, bVal, aPh, bPh) {
  return `<div class="kv-row">
    <input class="kv-a" placeholder="${escapeAttr(aPh)}" value="${escapeAttr(aVal)}">
    <input class="kv-b" placeholder="${escapeAttr(bPh)}" value="${escapeAttr(bVal)}">
    <button type="button" class="btn btn-secondary kv-remove" title="Remove this row">&times;</button>
  </div>`;
}
function kvEditorHtml(id, rows, aPh, bPh, addLabel) {
  const body = (rows && rows.length ? rows : [{ a: "", b: "" }]).map((r) => kvRowHtml(r.a, r.b, aPh, bPh)).join("");
  return `<div class="kv-editor" id="${id}">${body}</div>
    <button type="button" class="btn btn-secondary kv-add-btn" data-target="${id}" data-a-ph="${escapeAttr(aPh)}" data-b-ph="${escapeAttr(bPh)}">${addLabel}</button>`;
}
// Call once after setting the form's innerHTML -- wires every kv-editor
// on the page at once (there are up to 3: tools, escalation, forms).
function wireKvEditors() {
  document.querySelectorAll(".kv-remove").forEach((btn) => {
    btn.addEventListener("click", () => btn.closest(".kv-row").remove());
  });
  document.querySelectorAll(".kv-add-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const target = document.getElementById(btn.dataset.target);
      const holder = document.createElement("div");
      holder.innerHTML = kvRowHtml("", "", btn.dataset.aPh, btn.dataset.bPh);
      const row = holder.firstElementChild;
      target.appendChild(row);
      row.querySelector(".kv-remove").addEventListener("click", () => row.remove());
      row.querySelector(".kv-a").focus();
    });
  });
}
function readKvEditor(id, keyA, keyB) {
  return Array.from(document.querySelectorAll("#" + id + " .kv-row"))
    .map((row) => ({ [keyA]: row.querySelector(".kv-a").value.trim(), [keyB]: row.querySelector(".kv-b").value.trim() }))
    .filter((r) => r[keyA] || r[keyB]);
}
// A browser happily accepts a bare "youtube.com/..." or "loom.com/..."
// typed into a plain text field, but stored as-is it's broken: as an
// <a href> it resolves as a path on this site instead of out to the
// real destination, and new URL() elsewhere (embed detection, hostname
// checks) throws on a schemeless string. Assume https, same as a
// browser's own address bar does with a bare domain.
function normalizeUrl(value) {
  const v = (value || "").trim();
  if (!v || /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v)) return v;
  return "https://" + v;
}
// Forms are special: a row with no URL stays a plain string (matches

// becomes {name, href}.
function readFormsKvEditor(id) {
  return Array.from(document.querySelectorAll("#" + id + " .kv-row"))
    .map((row) => {
      const name = row.querySelector(".kv-a").value.trim();
      const href = normalizeUrl(row.querySelector(".kv-b").value.trim());
      if (!name && !href) return null;
      return href ? { name, href } : name;
    })
    .filter(Boolean);
}
function toolsRows(toolsSystems) { return (toolsSystems || []).map((t) => ({ a: t.name || "", b: t.note || "" })); }
function escalationRows(escalation) { return (escalation || []).map((e) => ({ a: e.when || "", b: e.action || "" })); }
function formsKvRows(forms) { return (forms || []).map((f) => (typeof f === "string" ? { a: f, b: "" } : { a: f.name || "", b: f.href || "" })); }

// One row per decision option: label, detail, and an optional "Go to
// step #" -- Run mode jumps straight there when that option is picked
// instead of just falling through to the next step in the list. Blank
// means "no branch, just continue" (matches every decision step made
// before this existed). References a step by its plain position number
// (the same "Step 1/2/3" numbering shown on the SOP page) rather than a
// stable id, since steps don't have one -- reordering steps afterward
// can silently point a jump at the wrong step, same tradeoff as
// reordering numbered items in most simple flowchart tools.
function decisionOptionRowHtml(o) {
  o = o || {};
  return `<div class="do-row">
    <input class="do-label" placeholder="Option label (e.g. Dining / American table)" value="${escapeAttr(o.label || "")}">
    <input class="do-detail" placeholder="Detail (optional)" value="${escapeAttr(o.detail || "")}">
    <input class="do-goto" type="number" min="1" placeholder="Go to step #" value="${o.goToStep || ""}" title="Which step to jump to if this option is picked while running the SOP. Leave blank to just continue to the next step.">
    <button type="button" class="btn btn-secondary do-remove" title="Remove this option">&times;</button>
  </div>`;
}
function decisionOptionsEditorHtml(options) {
  const rows = (options && options.length ? options : [{}]).map(decisionOptionRowHtml).join("");
  return `<div class="do-editor">${rows}</div><button type="button" class="btn btn-secondary do-add-btn">+ Add option</button>`;
}
function bindDecisionOptionRow(row) {
  row.querySelector(".do-remove").addEventListener("click", () => row.remove());
}
function bindDecisionOptionsEditor(wrap) {
  wrap.querySelectorAll(".do-row").forEach(bindDecisionOptionRow);
  const addBtn = wrap.querySelector(".do-add-btn");
  addBtn.addEventListener("click", () => {
    const holder = document.createElement("div");
    holder.innerHTML = decisionOptionRowHtml();
    const row = holder.firstElementChild;
    wrap.querySelector(".do-editor").appendChild(row);
    bindDecisionOptionRow(row);
    row.querySelector(".do-label").focus();
  });
}
function readDecisionOptions(wrap) {
  return Array.from(wrap.querySelectorAll(".do-row")).map((row) => {
    const label = row.querySelector(".do-label").value.trim();
    const detail = row.querySelector(".do-detail").value.trim();
    const gotoVal = row.querySelector(".do-goto").value.trim();
    const opt = { label, detail };
    if (gotoVal) opt.goToStep = parseInt(gotoVal, 10);
    return opt;
  }).filter((o) => o.label);
}
// "After this step" control -- lets ANY step (not just a decision's own
// options) say where Run mode goes next, so a step that's only ever
// reached by one branch can finish or jump on its own instead of
// falling through into the next branch's steps.
function bindStepAfterControl(block) {
  const modeSel = block.querySelector(".se-after-mode");
  const gotoInput = block.querySelector(".se-after-goto");
  modeSel.addEventListener("change", () => { gotoInput.style.display = modeSel.value === "goto" ? "inline-block" : "none"; });
}
function readStepAfter(block) {
  const mode = block.querySelector(".se-after-mode").value;
  if (mode === "finish") return "finish";
  if (mode === "goto") {
    const v = parseInt(block.querySelector(".se-after-goto").value, 10);
    if (v) return v;
  }
  return undefined;
}
function stepEditBlockHtml(step, idx) {
  const st = step || { type: "info" };
  const itemsVal = (st.items || []).join("\n");
  const tags = st.tags || [];
  const afterMode = st.afterStep === "finish" ? "finish" : typeof st.afterStep === "number" ? "goto" : "continue";
  const afterGotoVal = typeof st.afterStep === "number" ? st.afterStep : "";
  return `<div class="step-edit-block" data-idx="${idx}">
    <div class="step-edit-row">
      <input class="se-phase" placeholder="Phase (optional)" value="${escapeAttr(st.phase || "")}">
      <select class="se-type">
        <option value="info" ${st.type === "info" || !st.type ? "selected" : ""}>Info</option>
        <option value="checklist" ${st.type === "checklist" ? "selected" : ""}>Checklist</option>
        <option value="decision" ${st.type === "decision" ? "selected" : ""}>Decision</option>
      </select>
      <button type="button" class="btn btn-secondary se-move-btn se-move-up" title="Move step up">&uarr;</button>
      <button type="button" class="btn btn-secondary se-move-btn se-move-down" title="Move step down">&darr;</button>
      <button type="button" class="btn btn-secondary se-remove">Remove step</button>
    </div>
    <input class="se-title" placeholder="Step title" value="${escapeAttr(st.title || "")}">
    <textarea class="se-body" placeholder="Step description" rows="2">${escapeHtml(st.body || "")}</textarea>
    <div class="se-checklist-wrap" style="display:${st.type === "checklist" ? "block" : "none"}">
      <textarea class="se-items" placeholder="One checklist item per line" rows="3">${escapeHtml(itemsVal)}</textarea>
    </div>
    <div class="se-decision-wrap" style="display:${st.type === "decision" ? "block" : "none"}">
      ${decisionOptionsEditorHtml(st.options)}
    </div>
    <div class="se-after-row">
      <span class="se-after-label">After this step (if not overridden by a decision option above):</span>
      <select class="se-after-mode">
        <option value="continue" ${afterMode === "continue" ? "selected" : ""}>Continue to next step</option>
        <option value="finish" ${afterMode === "finish" ? "selected" : ""}>Finish &amp; sign off here</option>
        <option value="goto" ${afterMode === "goto" ? "selected" : ""}>Jump to step #</option>
      </select>
      <input class="se-after-goto" type="number" min="1" placeholder="Step #" value="${afterGotoVal}" style="display:${afterMode === "goto" ? "inline-block" : "none"}">
    </div>
    <div class="se-tags">
      <label><input type="checkbox" class="se-tag-approval" ${tags.includes("approval") ? "checked" : ""}> Approval required</label>
      <label><input type="checkbox" class="se-tag-confidential" ${tags.includes("confidential") ? "checked" : ""}> Confidential</label>
    </div>
    <button type="button" class="btn btn-secondary se-insert-after">+ Insert step below</button>
  </div>`;
}

      </select>
    </div>
    ${!sop.sourceDocumentUrl ? `<div class="edit-field"><label>Subtitle</label><input id="ef-subtitle" class="ef-input" value="${escapeAttr(f.subtitle)}"></div>` : ""}
    ${sop.sourceDocumentUrl ? `
    <div class="edit-field">
      <label>Document</label>
      <div class="document-open-card" style="margin-bottom:10px">
        <span>&#128196; ${escapeHtml(sop.sourceDocumentName || "Document")}</span>
        <a class="btn btn-secondary" href="${sop.sourceDocumentUrl}" target="_blank" rel="noopener">View current</a>
      </div>
      <input type="file" id="ef-doc-file" accept=".pdf,.doc,.docx,.txt,image/*">
      <p class="muted small" style="margin-top:6px">Choose a file to replace the current document (optional).</p>
      <input type="url" id="ef-doc-link" class="ef-input" placeholder="Or paste a link instead (Claude artifact, Loom video, or any URL)" style="margin-top:8px">
    </div>
    <div class="edit-field"><label>Description</label><textarea id="ef-doc-description" rows="3" placeholder="A short description of this document">${escapeHtml(docDescription)}</textarea></div>
    ` : ""}
    <div class="edit-field"><label>Before you start <span class="muted small">(one item per line)</span></label><textarea id="ef-before" rows="3">${escapeHtml(f.beforeYouStart.join("\n"))}</textarea></div>

    <div class="edit-field">
      <label>Steps ${sop.sourceDocumentUrl ? `<span class="muted small">(optional &mdash; in addition to the document)</span>` : ""}</label>
      <div id="steps-editor">${f.steps.map((s, i) => stepEditBlockHtml(s, i)).join("")}</div>
      <button type="button" class="btn btn-secondary" id="add-step-btn">+ Add step</button>
    </div>

    <div class="edit-field"><label>Success criteria <span class="muted small">(one per line)</span></label><textarea id="ef-success" rows="3">${escapeHtml(f.successCriteria.join("\n"))}</textarea></div>

    <details class="edit-details" open>
      <summary>Additional details (optional)</summary>
      <div class="edit-field"><label>Never do this</label><input id="ef-never" class="ef-input" value="${escapeAttr(f.neverDoThis)}"></div>
      <div class="edit-field"><label>Tools &amp; systems</label>${kvEditorHtml("tools-editor", toolsRows(f.toolsSystems), "Tool or system name", "Note (optional)", "+ Add tool or system")}</div>

    <div class="edit-actions">

      <button class="btn btn-primary" id="edit-save">${memberProposing ? "Submit for approval" : "Save changes"}</button>

    <p class="muted small" id="edit-status" style="min-height:16px;margin-top:8px"></p>`;

  document.getElementById("crumb-sop").addEventListener("click", () => go("/sop/" + sop.id));
  document.getElementById("edit-cancel").addEventListener("click", () => go("/sop/" + sop.id));
  wireKvEditors();

  function updateStepMoveButtons() {
    const blocks = Array.from(document.querySelectorAll(".step-edit-block"));
    blocks.forEach((block, i) => {
      block.querySelector(".se-move-up").disabled = i === 0;
      block.querySelector(".se-move-down").disabled = i === blocks.length - 1;
    });
  }
  function bindStepBlock(block) {
    const typeSel = block.querySelector(".se-type");
    const checklistWrap = block.querySelector(".se-checklist-wrap");
    const decisionWrap = block.querySelector(".se-decision-wrap");
    bindDecisionOptionsEditor(decisionWrap);
    bindStepAfterControl(block);
    typeSel.addEventListener("change", () => {
      checklistWrap.style.display = typeSel.value === "checklist" ? "block" : "none";
      decisionWrap.style.display = typeSel.value === "decision" ? "block" : "none";
    });
    block.querySelector(".se-remove").addEventListener("click", () => { block.remove(); updateStepMoveButtons(); });
    block.querySelector(".se-move-up").addEventListener("click", () => {
      const prev = block.previousElementSibling;
      if (!prev) return;
      block.parentNode.insertBefore(block, prev);
      updateStepMoveButtons();
      block.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    block.querySelector(".se-move-down").addEventListener("click", () => {
      const next = block.nextElementSibling;
      if (!next) return;
      block.parentNode.insertBefore(next, block);

      block.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    block.querySelector(".se-insert-after").addEventListener("click", () => {

      holder.innerHTML = stepEditBlockHtml({ type: "info" }, 0);
      const newBlock = holder.firstElementChild;
      block.insertAdjacentElement("afterend", newBlock);
      bindStepBlock(newBlock);
      updateStepMoveButtons();
      newBlock.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  }
  document.querySelectorAll(".step-edit-block").forEach(bindStepBlock);
  updateStepMoveButtons();
  document.getElementById("add-step-btn").addEventListener("click", () => {
    const wrap = document.getElementById("steps-editor");
    const holder = document.createElement("div");
    holder.innerHTML = stepEditBlockHtml({ type: "info" }, wrap.children.length);
    const block = holder.firstElementChild;
    wrap.appendChild(block);
    bindStepBlock(block);
    updateStepMoveButtons();
    block.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  document.getElementById("edit-save").addEventListener("click", async () => {
    const saveBtn = document.getElementById("edit-save");
    const statusEl = document.getElementById("edit-status");

    const linesOf = (el) => el.value.split("\n").map((s) => s.trim()).filter(Boolean);

    const steps = Array.from(document.querySelectorAll(".step-edit-block")).map((block) => {
      const type = block.querySelector(".se-type").value;
      const step = {
        type,
        title: block.querySelector(".se-title").value.trim(),
        body: block.querySelector(".se-body").value.trim(),

      const phase = block.querySelector(".se-phase").value.trim();
      if (phase) step.phase = phase;
      const afterStep = readStepAfter(block);
      if (afterStep !== undefined) step.afterStep = afterStep;
      const tags = [];
      if (block.querySelector(".se-tag-approval").checked) tags.push("approval");
      if (block.querySelector(".se-tag-confidential").checked) tags.push("confidential");
      if (tags.length) step.tags = tags;
      if (type === "checklist") step.items = linesOf(block.querySelector(".se-items"));
      else if (type === "decision") step.options = readDecisionOptions(block.querySelector(".se-decision-wrap"));
      return step;
    }).filter((s) => s.title);

    const title = document.getElementById("ef-title").value.trim();
    if (!title) { statusEl.textContent = "Title can't be empty."; return; }
    if (!steps.length && !sop.sourceDocumentUrl) { statusEl.textContent = "Add at least one step before saving."; return; }

    let docUrl, docName;
    const docFileInput = document.getElementById("ef-doc-file");
    const docLinkVal = document.getElementById("ef-doc-link")?.value.trim();
    if (sop.sourceDocumentUrl && docFileInput && docFileInput.files[0]) {
      saveBtn.disabled = true;
      saveBtn.textContent = "Uploading document...";
      try {
        docUrl = await API.uploadSopDocument(docFileInput.files[0]);
        docName = docFileInput.files[0].name;
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = memberProposing ? "Submit for approval" : "Save changes";
        statusEl.textContent = "Couldn't upload document: " + err.message;
        return;
      }
    } else if (sop.sourceDocumentUrl && docLinkVal) {
      docUrl = normalizeUrl(docLinkVal);
      docName = null;
    } else if (sop.sourceDocumentUrl) {
      docUrl = sop.sourceDocumentUrl;
      docName = sop.sourceDocumentName;
    }
    // The placeholder step (its "description") isn't part of the Steps
    // editor -- re-inserted here from the dedicated Description field so
    // it survives the save, ahead of whatever real steps were added. That
    // same description doubles as the subtitle (there's no separate
    // Subtitle field for a document SOP) so it actually shows up on the
    // Library card, not just on the SOP page itself.
    let finalSteps = steps;
    let docDescriptionVal;
    if (sop.sourceDocumentUrl) {
      docDescriptionVal = document.getElementById("ef-doc-description").value.trim();
      finalSteps = [{ title: "Uploaded document", body: docDescriptionVal, type: "info", placeholder: true }, ...steps];
    }

    const fields = {
      title,
      department: document.getElementById("ef-department").value,
      subtitle: sop.sourceDocumentUrl ? (docDescriptionVal || "Hosted as an uploaded document.") : document.getElementById("ef-subtitle").value.trim(),
      beforeYouStart: linesOf(document.getElementById("ef-before")),
      toolsSystems: readKvEditor("tools-editor", "name", "note"),
      steps: finalSteps,
      successCriteria: linesOf(document.getElementById("ef-success")),
      escalation: readKvEditor("escalation-editor", "when", "action"),
      forms: readFormsKvEditor("forms-editor"),
    };
    const neverVal = document.getElementById("ef-never").value.trim();
    fields.neverDoThis = neverVal || undefined;
    if (sop.sourceDocumentUrl) {
      fields.sourceDocumentUrl = docUrl;
      fields.sourceDocumentName = docName;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = memberProposing ? "Submitting..." : "Saving...";
    const snakeFields = {
      title: fields.title,
      subtitle: fields.subtitle,
      department: fields.department,
      before_you_start: fields.beforeYouStart,
      tools_systems: fields.toolsSystems,
      steps: fields.steps,
      success_criteria: fields.successCriteria,
      escalation: fields.escalation,
      forms: fields.forms,
      never_do_this: neverVal || null,
    };
    if (sop.sourceDocumentUrl) {
      snakeFields.source_document_url = docUrl;
      snakeFields.source_document_name = docName;
    }
    try {
      if (memberProposing) {
        const proposalId = await API.proposeSopEdit(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName, snakeFields);
        EDIT_PROPOSALS.push({
          id: proposalId, sopId: sop.id, loginId: CURRENT_VIEWER.id, loginName: CURRENT_VIEWER.name,
          lastName: CURRENT_VIEWER.lastName, fields: snakeFields, status: "pending", ts: Date.now(),
        });
        go("/sop/" + sop.id);
      } else {
        await API.editSop(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName, snakeFields);
        Object.assign(sop, fields);
        sop.status = "review-due";
        EVENTS.push({ sopId: sop.id, kind: "edited", lastName: CURRENT_VIEWER.lastName, loginName: CURRENT_VIEWER.name, fields: snakeFields, ...eventStamp() });
        go("/sop/" + sop.id);
      }
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = memberProposing ? "Submit for approval" : "Save changes";
      statusEl.textContent = "Couldn't save: " + err.message;
    }
  });
}

      block.insertAdjacentElement("afterend", newBlock);
      bindStepBlock(newBlock);
      updateStepMoveButtons();
      newBlock.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  }
  document.querySelectorAll(".step-edit-block").forEach(bindStepBlock);
  updateStepMoveButtons();
  document.getElementById("add-step-btn").addEventListener("click", () => {
    const wrap = document.getElementById("steps-editor");
    const holder = document.createElement("div");
    holder.innerHTML = stepEditBlockHtml({ type: "info" }, wrap.children.length);
    const block = holder.firstElementChild;
    wrap.appendChild(block);
    bindStepBlock(block);
    updateStepMoveButtons();
    block.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  document.getElementById("edit-save").addEventListener("click", async () => {
    const saveBtn = document.getElementById("edit-save");
    const statusEl = document.getElementById("edit-status");

    const linesOf = (el) => el.value.split("\n").map((s) => s.trim()).filter(Boolean);

    const steps = Array.from(document.querySelectorAll(".step-edit-block")).map((block) => {
      const type = block.querySelector(".se-type").value;
      const step = {
        type,
        title: block.querySelector(".se-title").value.trim(),
        body: block.querySelector(".se-body").value.trim(),
      };
      const phase = block.querySelector(".se-phase").value.trim();
      if (phase) step.phase = phase;
      const afterStep = readStepAfter(block);
      if (afterStep !== undefined) step.afterStep = afterStep;
      const tags = [];
      if (block.querySelector(".se-tag-approval").checked) tags.push("approval");
      if (block.querySelector(".se-tag-confidential").checked) tags.push("confidential");
      if (tags.length) step.tags = tags;
      if (type === "checklist") step.items = linesOf(block.querySelector(".se-items"));
      else if (type === "decision") step.options = readDecisionOptions(block.querySelector(".se-decision-wrap"));
      return step;
    }).filter((s) => s.title);

    const departmentTag = document.getElementById("ef-department").value;
    if (!departmentTag) { statusEl.textContent = "Choose which department this SOP belongs to."; return; }
    const title = document.getElementById("ef-title").value.trim();
    if (!title) { statusEl.textContent = "Title can't be empty."; return; }
    if (!steps.length) { statusEl.textContent = "Add at least one step before saving."; return; }

    const addedBy = CURRENT_VIEWER.lastName;
    const addedByInitials = initialsFrom(addedBy);
    const subtitle = document.getElementById("ef-subtitle").value.trim();
    const beforeYouStart = linesOf(document.getElementById("ef-before"));
    const toolsSystems = readKvEditor("tools-editor", "name", "note");
    const forms = readFormsKvEditor("forms-editor");
    const successCriteria = linesOf(document.getElementById("ef-success"));
    const escalation = readKvEditor("escalation-editor", "when", "action");
    const neverVal = document.getElementById("ef-never").value.trim();

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";
    try {
      const newId = await API.addSop(CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName, departmentTag, {
        title, subtitle,
        before_you_start: beforeYouStart, tools_systems: toolsSystems,
        steps, success_criteria: successCriteria, escalation, forms,
        never_do_this: neverVal || null,
      });
      const newSop = {
        id: newId, title, department: departmentTag, status: "draft",
        owner: { name: addedBy, initials: addedByInitials },
        lastReviewed: null, nextReview: null, version: "v1 (draft)",
        subtitle, beforeYouStart, toolsSystems, signedOffBy: [], relatedIds: [],
        forms, steps, successCriteria, escalation,
      };
      if (neverVal) newSop.neverDoThis = neverVal;
      SOPS.push(newSop);
      go("/sop/" + newSop.id);
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save as draft";
      statusEl.textContent = "Couldn't save: " + err.message;
    }
  });
}

/* ============================== RUN MODE ============================== */
function renderRun(id) {
  const sop = getSop(id);
  if (!sop) {
    runRoot.innerHTML = `<div class="run-shell"><p class="muted" style="padding:40px 20px">SOP not found. <a id="back-lib2" style="text-decoration:underline;cursor:pointer">Back to the library</a>.</p></div>`;
    document.getElementById("back-lib2").addEventListener("click", () => go("/library"));
    return;
  }

  runRoot.innerHTML = `
    <div class="run-shell" id="run-shell">
      <div class="run-top">
        <div class="run-top-row">
          <a class="exit" id="exit-link">&larr; Exit run</a>
          <button class="pause-btn" id="pause-btn">Pause</button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="step-counter"><span class="small muted" id="step-label">Step 1 of 1</span><span class="small muted" id="step-tag"></span></div>
      </div>
      <div class="run-body" id="run-body"></div>
      <div class="pause-overlay" id="pause-overlay">
        <h3>Paused</h3>
        <p class="muted" style="color:rgba(255,255,255,.7)">Take your time. Nothing is lost if you close the tab.</p>
        <button class="btn btn-primary" id="resume-btn">Resume</button>
      </div>
    </div>`;

  document.getElementById("exit-link").addEventListener("click", () => go("/sop/" + sop.id));
  document.getElementById("pause-btn").addEventListener("click", () => document.getElementById("pause-overlay").classList.add("show"));
  document.getElementById("resume-btn").addEventListener("click", () => document.getElementById("pause-overlay").classList.remove("show"));

  const steps = (sop.steps || []).filter((s) => !s.placeholder);
  const totalSteps = steps.length + 1;
  let stepIndex = 0;
  const checklistState = steps.map((s) => (s.items ? s.items.map(() => false) : []));
  const decisionChoice = {};
  const flagged = new Set();
  const historyStack = [];

  function nextIndexFor(i) {
    const step = steps[i];
    if (!step) return i + 1;
    if (step.type === "decision" && decisionChoice[i] !== undefined) {
      const opt = step.options[decisionChoice[i]];
      if (opt && opt.goToStep) return Math.max(0, Math.min(steps.length, opt.goToStep - 1));
    }
    // A step's own "after this step" setting -- lets a step reached by
    // only one branch (like a decision's target step) finish or jump on
    // its own instead of falling through into the next branch's steps.
    if (step.afterStep === "finish") return steps.length;
    if (typeof step.afterStep === "number") return Math.max(0, Math.min(steps.length, step.afterStep - 1));
    return i + 1;
  }
  function isStepComplete(i) {
    const step = steps[i];
    if (!step) return true;
    if (step.type === "checklist" && step.items) return checklistState[i].every(Boolean);
    if (step.type === "decision") return decisionChoice[i] !== undefined;
    return true;
  }
  function renderProgress() {
    const pct = Math.min(100, Math.round((stepIndex / (totalSteps - 1)) * 100));
    document.getElementById("progress-fill").style.width = pct + "%";
    const shown = Math.min(stepIndex + 1, totalSteps);
    document.getElementById("step-label").textContent = stepIndex >= steps.length ? "Sign off" : `Step ${shown} of ${steps.length}`;
    document.getElementById("step-tag").textContent = flagged.has(stepIndex) ? "Flagged" : "";
  }
  function renderStep() {
    const body = document.getElementById("run-body");
    if (stepIndex >= steps.length) { renderComplete(body); renderFooterComplete(); renderProgress(); return; }
    const step = steps[stepIndex];
    const tagChip = { approval: `<span class="tag-chip tag-approval">Approval required</span>`, confidential: `<span class="tag-chip tag-confidential">&#128274; Confidential</span>` };
    let inner = `<div class="sop-name">${sop.title}</div>`;
    if (stepIndex === 0 && sop.blackoutPeriods && sop.blackoutPeriods.length) {
      inner += `<div class="blackout-banner"><span class="tag">Blackout periods</span><ul>${sop.blackoutPeriods.map((p) => `<li>${p}</li>`).join("")}</ul></div>`;
    }
    if (step.phase) inner += `<div class="phase-eyebrow">${step.phase}</div>`;
    inner += `<div class="step-card"><h2>${step.title}</h2>`;
    if (step.tags && step.tags.length) inner += `<div class="step-tags">${step.tags.map((t) => tagChip[t] || "").join("")}</div>`;
    if (step.body) inner += `<p class="body-text">${bodyHtml(step.body)}</p>`;
    if (step.type === "checklist" && step.items) inner += step.items.map((it, idx) => `<div class="check-item ${checklistState[stepIndex][idx] ? "checked" : ""}" data-idx="${idx}"><span class="box">&#10003;</span><span>${it}</span></div>`).join("");
    if (step.type === "decision" && step.options) inner += step.options.map((o, idx) => `<div class="option-item ${decisionChoice[stepIndex] === idx ? "selected" : ""}" data-idx="${idx}"><span class="label">${o.label}</span><span class="detail">${o.detail}</span></div>`).join("");
    inner += `</div><button class="flag-link ${flagged.has(stepIndex) ? "flagged" : ""}" id="flag-btn">${flagged.has(stepIndex) ? "⚑ Flagged as unclear" : "Flag this step as unclear"}</button>`;
    body.innerHTML = inner;
    body.querySelectorAll(".check-item").forEach((el) => el.addEventListener("click", () => { const idx = Number(el.dataset.idx); checklistState[stepIndex][idx] = !checklistState[stepIndex][idx]; renderStep(); renderFooter(); }));
    body.querySelectorAll(".option-item").forEach((el) => el.addEventListener("click", () => { decisionChoice[stepIndex] = Number(el.dataset.idx); renderStep(); renderFooter(); }));
    document.getElementById("flag-btn").addEventListener("click", () => { flagged.has(stepIndex) ? flagged.delete(stepIndex) : flagged.add(stepIndex); renderStep(); renderProgress(); });
    renderFooter(); renderProgress();
  }
  function renderComplete(body) {
    let recapRows = "";
    steps.forEach((s, i) => { if (s.type === "decision" && decisionChoice[i] !== undefined) recapRows += `<div class="recap-row"><span class="muted">${s.title}</span><span style="font-weight:600">${s.options[decisionChoice[i]].label}</span></div>`; });
    body.innerHTML = `<div class="complete-screen">
      <div class="complete-icon">&#10003;</div>
      <h2>${sop.title.split(" — ")[0]}. Done.</h2>
      <p class="sub">${CURRENT_VIEWER ? "Nice work, " + escapeHtml(CURRENT_VIEWER.lastName) + "." : "Nice work."}</p>
      ${recapRows ? `<div class="recap-card"><h3>This run</h3>${recapRows}</div>` : ""}
      ${flagged.size ? `<div class="flag-note">You flagged step${flagged.size > 1 ? "s" : ""} ${[...flagged].map((i) => i + 1).join(", ")} as unclear. ${sop.owner.name} will see it in the review queue.</div>` : ""}
    </div>`;
  }
  function renderFooter() {
    let footer = document.getElementById("run-footer");
    if (!footer) { footer = document.createElement("div"); footer.className = "run-footer"; footer.id = "run-footer"; document.getElementById("run-shell").insertBefore(footer, document.getElementById("pause-overlay")); }
    const complete = isStepComplete(stepIndex);
    const isLast = nextIndexFor(stepIndex) >= steps.length;
    footer.innerHTML = `<button class="btn btn-secondary" id="back-btn" ${historyStack.length === 0 ? "disabled" : ""}>Back</button><button class="btn btn-primary" id="next-btn" ${complete ? "" : "disabled"}>${isLast ? "Finish & sign off" : "Next step"}</button>`;
    document.getElementById("back-btn").addEventListener("click", () => { if (historyStack.length) { stepIndex = historyStack.pop(); renderStep(); } });
    document.getElementById("next-btn").addEventListener("click", () => { if (!isStepComplete(stepIndex)) return; historyStack.push(stepIndex); stepIndex = nextIndexFor(stepIndex); renderStep(); });
  }
  function renderFooterComplete() {
    const footer = document.getElementById("run-footer");
    footer.innerHTML = `<a class="btn btn-primary" id="back-to-sop" style="text-align:center">Back to the SOP</a>`;
    document.getElementById("back-to-sop").addEventListener("click", () => go("/sop/" + sop.id));
  }

  renderStep();
}

// Builds the org-chart shape from reportsTo pointers: a map of managerId
// -> their direct reports, plus the list of "roots" to start rendering
// from (no manager, or a manager that no longer exists). A person whose
// reports_to chain forms a cycle disconnected from any real root would
// otherwise never render at all -- stranded entries are appended as
// extra roots so nobody silently disappears from the chart.
function buildDirectoryTree(entries) {
  const byId = new Map(entries.map((p) => [p.id, p]));
  const childrenOf = new Map();
  entries.forEach((p) => {
    const managerId = p.reportsTo && byId.has(p.reportsTo) ? p.reportsTo : null;
    if (managerId) {
      if (!childrenOf.has(managerId)) childrenOf.set(managerId, []);
      childrenOf.get(managerId).push(p);
    }
  });
  childrenOf.forEach((kids) => kids.sort((a, b) => a.name.localeCompare(b.name)));

  const roots = entries.filter((p) => !(p.reportsTo && byId.has(p.reportsTo))).sort((a, b) => a.name.localeCompare(b.name));
  const reached = new Set();
  const markReached = (id) => {
    if (reached.has(id)) return;
    reached.add(id);
    (childrenOf.get(id) || []).forEach((c) => markReached(c.id));
  };
  roots.forEach((r) => markReached(r.id));
  const stranded = entries.filter((p) => !reached.has(p.id));

  return { roots: [...roots, ...stranded], childrenOf };
}

function directoryActionsHtml(p) {
  if (p.status === "draft") {

  }

// Renders a person's direct reports. When they belong to more than one
// department, groups them under a labeled sub-branch per department
// (e.g. Ross's reports split into an "Operations" cluster and an
// "Installations" cluster) instead of one flat, mixed row -- using the
// same <li>/.org-branch structure a person node uses, so the existing
// connector-line CSS handles the extra tier for free. If everyone
// shares one department, there's nothing to clarify, so it skips
// straight to a flat row like before.
function renderOrgChildren(kids, childrenOf) {
  if (!kids.length) return "";
  const deptIds = [...new Set(kids.map((k) => k.department))];
  if (deptIds.length <= 1) {
    return `<ul class="org-branch">${kids.map((c) => renderOrgNode(c, childrenOf)).join("")}</ul>`;
  }
  const groups = deptIds.map((deptId) => {
    const dept = getDepartment(deptId);
    const groupKids = kids.filter((k) => k.department === deptId).sort((a, b) => a.name.localeCompare(b.name));
    return `<li>
      <div class="org-group-label">${escapeHtml(dept ? dept.name : deptId)}</div>
      <ul class="org-branch">${groupKids.map((c) => renderOrgNode(c, childrenOf)).join("")}</ul>
    </li>`;
  }).join("");
  return `<ul class="org-branch">${groups}</ul>`;
}

// A tree node shows just a circular photo (or initials if none) --
// hovering it (or tapping it, for touch screens with no hover) reveals
// the full details in a popover. The popover is a descendant of the
// same element the CSS :hover rule watches, so moving the pointer into
// it to click Edit/Approve/Remove doesn't dismiss it.
function renderOrgNode(p, childrenOf) {
  const dept = getDepartment(p.department);
  const kids = childrenOf.get(p.id) || [];
  const contactBits = [
    p.email ? `<a href="mailto:${escapeAttr(p.email)}">${escapeHtml(p.email)}</a>` : "",
    p.phone ? `<a href="tel:${escapeAttr(p.phone)}">${escapeHtml(p.phone)}</a>` : "",
  ].filter(Boolean).join(" &middot; ");
  const avatarInner = p.photoUrl ? `<img src="${escapeAttr(p.photoUrl)}" alt="${escapeAttr(p.name)}">` : escapeHtml(initialsFrom(p.name));
  return `<li>
    <div class="person-node" data-person-node="${p.id}">
      <div class="person-avatar">${avatarInner}</div>
      <div class="person-role-label">${escapeHtml(p.role)}</div>
      <div class="person-tooltip">
        <div class="org-card">
          <div class="org-name">${escapeHtml(p.name)} ${p.status === "draft" ? `<span class="badge badge-draft">Pending</span>` : ""}</div>

          ${contactBits ? `<div class="muted small">${contactBits}</div>` : ""}
          ${p.notes ? `<div class="muted small">${escapeHtml(p.notes)}</div>` : ""}

}

function renderDirectory() {
  const q = directorySearchQuery.trim().toLowerCase();
  let bodyHtml;

  if (q) {
    const entries = DIRECTORY
      .filter((p) => {
        const dept = getDepartment(p.department);
        return [p.name, p.role, p.email, dept ? dept.name : ""].join(" ").toLowerCase().includes(q);
      })
      .sort((a, b) => a.name.localeCompare(b.name));

    bodyHtml = entries.length
      ? entries.map((p) => {
          const dept = getDepartment(p.department);
          const contactBits = [
            p.email ? `<a href="mailto:${escapeAttr(p.email)}">${escapeHtml(p.email)}</a>` : "",
            p.phone ? `<a href="tel:${escapeAttr(p.phone)}">${escapeHtml(p.phone)}</a>` : "",
          ].filter(Boolean).join(" &middot; ");
          const avatarInner = p.photoUrl ? `<img src="${escapeAttr(p.photoUrl)}" alt="${escapeAttr(p.name)}">` : escapeHtml(initialsFrom(p.name));
          return `<div class="review-item">
            <div class="row" style="gap:10px;align-items:center">
              <div class="person-avatar" style="width:36px;height:36px;font-size:12px;flex:none">${avatarInner}</div>
              <div class="suggestion-meta">
                <span class="suggestion-dept">${escapeHtml(p.name)}</span>
                ${p.status === "draft" ? `<span class="badge badge-draft">Pending</span>` : ""}
              </div>
            </div>
            <div class="target">${escapeHtml(p.role)}${dept ? " &middot; " + dept.name : ""}</div>
            ${contactBits ? `<p class="suggestion-text muted small">${contactBits}</p>` : ""}
            ${p.notes ? `<p class="muted small">${escapeHtml(p.notes)}</p>` : ""}
            <div class="review-footer">${directoryActionsHtml(p)}</div>
          </div>`;
        }).join("")
      : `<div class="empty-state">No one matches your search.</div>`;
  } else {
    const { roots, childrenOf } = buildDirectoryTree(DIRECTORY);
    bodyHtml = roots.length
      ? `<div class="org-tree-wrap" style="zoom:${directoryZoom}"><ul class="org-tree">${roots.map((r) => renderOrgNode(r, childrenOf)).join("")}</ul></div>`
      : `<div class="empty-state">No one in the directory yet.</div>`;
  }

  // Zoom only makes sense for the tree view -- the flat search-result
  // list already reads fine at any width and doesn't need it.
  const zoomControlsHtml = q ? "" : `
    <div class="row" style="gap:4px;align-items:center">
      <button class="btn btn-secondary" id="zoom-out-btn" title="Zoom out">&minus;</button>
      <span class="muted small" id="zoom-level" style="min-width:40px;text-align:center">${Math.round(directoryZoom * 100)}%</span>
      <button class="btn btn-secondary" id="zoom-in-btn" title="Zoom in">+</button>
      <button class="btn btn-secondary" id="zoom-reset-btn" title="Reset zoom">Reset</button>
    </div>`;

  pageBody.innerHTML = `
    <div class="library-header">
      <h1>Directory</h1>
      <div class="row" style="gap:10px;flex-wrap:wrap">
        <input id="directory-search" class="ef-input" placeholder="Search name, role, department..." value="${escapeAttr(directorySearchQuery)}" style="max-width:240px">
        ${zoomControlsHtml}
        ${CURRENT_VIEWER
          ? `<button class="btn btn-secondary" id="add-person-btn">+ Add person</button>`
          : `<button class="btn btn-secondary" id="add-person-btn" disabled title="Log in to add a person">+ Add person</button>`}
      </div>
    </div>
    <div id="directory-list" style="overflow-x:auto">${bodyHtml}</div>`;

  document.getElementById("directory-search").addEventListener("input", (e) => {
    directorySearchQuery = e.target.value;
    renderDirectory();
  });
  const zoomOutBtn = document.getElementById("zoom-out-btn");
  if (zoomOutBtn) zoomOutBtn.addEventListener("click", () => {
    directoryZoom = Math.max(DIRECTORY_ZOOM_MIN, Math.round((directoryZoom - 0.1) * 10) / 10);
    renderDirectory();
  });
  const zoomInBtn = document.getElementById("zoom-in-btn");
  if (zoomInBtn) zoomInBtn.addEventListener("click", () => {
    directoryZoom = Math.min(DIRECTORY_ZOOM_MAX, Math.round((directoryZoom + 0.1) * 10) / 10);
    renderDirectory();
  });
  const zoomResetBtn = document.getElementById("zoom-reset-btn");
  if (zoomResetBtn) zoomResetBtn.addEventListener("click", () => {
    directoryZoom = 1;
    renderDirectory();
  });
  const addBtn = document.getElementById("add-person-btn");
  if (addBtn && !addBtn.disabled) addBtn.addEventListener("click", () => go("/directory/new"));
  document.querySelectorAll("[data-edit-person]").forEach((el) => el.addEventListener("click", () => go("/directory/edit/" + el.dataset.editPerson)));
  document.querySelectorAll("[data-approve-person]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!CURRENT_VIEWER) return;
      btn.disabled = true;
      btn.textContent = "Approving...";
      try {
        await API.approveDirectoryEntry(btn.dataset.approvePerson, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName);
        const p = DIRECTORY.find((x) => x.id === btn.dataset.approvePerson);
        if (p) p.status = "current";
        renderDirectory();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Approve";
        alert("Couldn't approve: " + err.message);
      }
    });
  });
  document.querySelectorAll("[data-remove-person]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!CURRENT_VIEWER) return;
      const ok = confirm("Remove this person from the directory?");
      if (!ok) return;
      btn.disabled = true;
      btn.textContent = "Removing...";
      try {
        await API.disapproveDirectoryEntry(btn.dataset.removePerson, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName);
        DIRECTORY = DIRECTORY.filter((x) => x.id !== btn.dataset.removePerson);
        renderDirectory();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Remove";
        alert("Couldn't remove: " + err.message);
      }
    });
  });

  // Tapping an avatar toggles its tooltip (touch screens have no
  // :hover); see the single document-level listener near the top of
  // this script that closes whichever one is open on an outside click.
  // positionPersonTooltip flips the tooltip above the node instead of
  // below when there isn't enough room in the viewport underneath it
  // (e.g. someone near the bottom of a tall tree) -- otherwise it'd
  // render off the bottom of the page and need a scroll to even see.
  document.querySelectorAll("[data-person-node]").forEach((el) => {
    el.addEventListener("mouseenter", () => positionPersonTooltip(el));
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      positionPersonTooltip(el);
      const wasOpen = el.classList.contains("open");
      document.querySelectorAll(".person-node.open").forEach((o) => o.classList.remove("open"));
      if (!wasOpen) el.classList.add("open");
    });
  });
}
function positionPersonTooltip(el) {
  const tooltip = el.querySelector(".person-tooltip");
  if (!tooltip) return;
  tooltip.classList.remove("flip-up");
  const prevDisplay = tooltip.style.display;
  const prevVisibility = tooltip.style.visibility;
  tooltip.style.visibility = "hidden";
  tooltip.style.display = "block";
  const nodeRect = el.getBoundingClientRect();
  const tooltipHeight = tooltip.offsetHeight;
  tooltip.style.display = prevDisplay;
  tooltip.style.visibility = prevVisibility;
  if (nodeRect.bottom + tooltipHeight + 16 > window.innerHeight) {
    tooltip.classList.add("flip-up");
  }
}

function mapSop(row) {
  return {
    id: row.id,
    sopId: row.sop_id || undefined,
    title: row.title,
    department: row.department,
    status: row.status,
    confidential: row.confidential || undefined,
    owner: { name: row.owner_name, initials: row.owner_initials },
    lastReviewed: row.last_reviewed,
    nextReview: row.next_review,
    version: row.version,
    subtitle: row.subtitle,
    neverDoThis: row.never_do_this || undefined,
    beforeYouStart: row.before_you_start || [],
    toolsSystems: row.tools_systems || [],
    steps: row.steps || [],
    successCriteria: row.success_criteria || [],
    escalation: row.escalation || [],
    forms: row.forms || [],
    relatedIds: row.related_ids || [],
    blackoutPeriods: row.blackout_periods && row.blackout_periods.length ? row.blackout_periods : undefined,
    blackoutFlag: row.blackout_flag || undefined,
    signedOffBy: row.signed_off_by || [],
    sourceDocumentUrl: row.source_document_url || undefined,
    sourceDocumentName: row.source_document_name || undefined,
  };
}
function loginLabel(id) {
  const l = LOGINS.find((x) => x.id === id);
  return l ? l.name : (id || "");
}
function mapEvent(row) {
  return { sopId: row.sop_id, kind: row.kind, loginId: row.login_id, lastName: row.actor_last_name, loginName: loginLabel(row.login_id), ts: row.ts, fullDate: row.full_date, monthYear: row.month_year };
}
function mapSuggestion(row) {
  return {
    id: row.id,
    sopId: row.sop_id,
    loginId: row.login_id,
    loginName: loginLabel(row.login_id),
    lastName: row.last_name,
    text: row.text,
    ts: row.ts,
    status: row.status,
    approvedBy: row.approved_by_login_id ? { loginId: row.approved_by_login_id, lastName: row.approved_by_last_name } : undefined,
    approvedDate: row.approved_date || undefined,
  };
}
function mapEditProposal(row) {
  return {
    id: row.id,
    sopId: row.sop_id,
    loginId: row.login_id,
    loginName: loginLabel(row.login_id),
    lastName: row.last_name,
    fields: row.fields || {},
    status: row.status,
    decidedByLastName: row.decided_by_last_name || undefined,
    decidedDate: row.decided_date || undefined,
    ts: row.ts,
  };
}
function mapDirectoryEntry(row) {
  return {
    id: row.id, name: row.name, role: row.role, department: row.department,
    email: row.email || "", phone: row.phone || "", notes: row.notes || "",
    reportsTo: row.reports_to || null,
    photoUrl: row.photo_url || "",
    status: row.status,
  };
}
function mapDirectoryProposal(row) {
  return {
    id: row.id,
    entryId: row.entry_id,
    loginId: row.login_id,
    loginName: loginLabel(row.login_id),
    lastName: row.last_name,
    fields: row.fields || {},
    status: row.status,
    decidedByLastName: row.decided_by_last_name || undefined,
    decidedDate: row.decided_date || undefined,
    ts: row.ts,
  };
}

async function boot() {
  if (!API.configured()) {
    pageBody.innerHTML = `<div class="empty-state">
      <p><strong>Not set up yet.</strong></p>
      <p class="muted small">Fill in your Supabase project URL and anon key in web/js/config.js, then reload. See SETUP.md.</p>
    </div>`;
    appShell.style.display = "block";
    return;
  }
  pageBody.innerHTML = `<div class="empty-state"><p class="muted">Loading the handbook...</p></div>`;
  try {
    const [sopsRows, eventRows, suggestionRows, proposalRows, directoryRows, directoryProposalRows] = await Promise.all([
      API.listSops(), API.listSopEvents(), API.listSuggestions(), API.listSopEditProposals(),
      API.listDirectory(), API.listDirectoryEditProposals(),
    ]);
    SOPS = sopsRows.map(mapSop);
    EVENTS = eventRows.map(mapEvent);
    SUGGESTIONS = suggestionRows.map(mapSuggestion);
    EDIT_PROPOSALS = proposalRows.map(mapEditProposal);
    DIRECTORY = directoryRows.map(mapDirectoryEntry);
    DIRECTORY_EDIT_PROPOSALS = directoryProposalRows.map(mapDirectoryProposal);
    render();
  } catch (err) {
    pageBody.innerHTML = `<div class="empty-state">
      <p><strong>Couldn't load the handbook.</strong></p>
      <p class="muted small">${escapeHtml(err.message)}</p>
      <button class="btn btn-secondary" id="boot-retry">Try again</button>
    </div>`;
    document.getElementById("boot-retry").addEventListener("click", boot);
  }
}
boot();
