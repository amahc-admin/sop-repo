}

/* ============================== SUGGESTIONS REVIEW ============================== */
let reviewFilter = "pending";
function renderSuggestionsPage() {
  const all = SUGGESTIONS.slice().sort((a, b) => b.ts - a.ts);
  const counts = {
    all: all.length,
    pending: all.filter((s) => suggestionStatus(s) === "pending").length,
    approved: all.filter((s) => suggestionStatus(s) === "approved").length,
  };
  const list = reviewFilter === "all" ? all : all.filter((s) => suggestionStatus(s) === reviewFilter);

  const filterDefs = [
    { id: "pending", label: "Pending" },
    { id: "approved", label: "Approved" },
    { id: "all", label: "All" },
  ];
  const filters = filterDefs.map((f) => `<button data-filter="${f.id}" class="${reviewFilter === f.id ? "active" : ""}">${f.label} (${counts[f.id]})</button>`).join("");

  const rows = list.length
    ? list.map((s) => {
        const sop = getSop(s.sopId);
        const sopDept = sop ? getDepartment(sop.department) : null;
        const status = suggestionStatus(s);
        let actionHtml = "";
        if (status === "approved") {
          actionHtml = `<span class="review-note">Approved by ${s.approvedBy ? s.approvedBy.deptName + " Team" : "—"}${s.approvedDate ? " · " + s.approvedDate : ""}</span>`;
        } else if (!sop) {
          actionHtml = `<span class="review-note">This SOP no longer exists.</span>`;
        } else if (!CURRENT_VIEWER) {
          actionHtml = `<button class="btn btn-secondary" disabled title="Set your department to approve">Approve</button>`;
        } else if (CURRENT_VIEWER.id !== sop.department) {
          actionHtml = `<button class="btn btn-secondary" disabled title="Only ${sopDept.name} can approve this">Approve</button>`;
        } else {
          actionHtml = `<button class="btn btn-secondary" data-approve="${s.id}">Approve</button>`;
        }
        const targetHtml = sop
          ? `<div class="target" data-sop="${sop.id}">${sop.title}${sopDept ? " &middot; " + sopDept.name : ""}</div>`
          : `<div class="target">Unknown SOP</div>`;
        return `<div class="review-item">
          <div class="suggestion-meta">
            <span class="suggestion-dept">${s.deptName}</span>
            <span class="suggestion-status suggestion-status-${status}">${status === "approved" ? "Approved" : "Pending"}</span>
            <span class="suggestion-date">${new Date(s.ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span>
          </div>
          ${targetHtml}
          <p class="suggestion-text">${escapeHtml(s.text)}</p>
          <div class="review-footer">${actionHtml}</div>
        </div>`;
      }).join("")
    : `<div class="empty-state">No ${reviewFilter === "all" ? "" : reviewFilter + " "}suggestions yet.</div>`;

  pageBody.innerHTML = `
    <div class="library-header">
      <h1>Suggestions &amp; feedback</h1>
      <div class="view-toggle" id="review-filters">${filters}</div>
    </div>
    <div id="review-list">${rows}</div>`;

  document.querySelectorAll("#review-filters [data-filter]").forEach((btn) => {
    btn.addEventListener("click", () => { reviewFilter = btn.dataset.filter; renderSuggestionsPage(); });
  });
  document.querySelectorAll(".review-item .target[data-sop]").forEach((el) => {
    el.addEventListener("click", () => go("/sop/" + el.dataset.sop));
  });
  document.querySelectorAll("[data-approve]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const s = SUGGESTIONS.find((x) => x.id === btn.dataset.approve);
      if (!s || !CURRENT_VIEWER) return;
      btn.disabled = true;
      btn.textContent = "Approving...";
      try {
        await API.approveSuggestion(s.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode);
        s.status = "approved";
        s.approvedBy = { deptId: CURRENT_VIEWER.id, deptName: CURRENT_VIEWER.name, deptCode: CURRENT_VIEWER.code };
        s.approvedDate = eventStamp().fullDate;
        renderSuggestionsPage();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Approve";
        alert("Couldn't approve: " + err.message);
      }
    });
  });
}

/* ============================== SOP DETAIL ============================== */
function renderSopDetail(id) {
  const sop = getSop(id);
  if (!sop) {
    pageBody.innerHTML = `<p class="muted">SOP not found. <a id="back-lib" style="text-decoration:underline;cursor:pointer">Back to the library</a>.</p>`;
    document.getElementById("back-lib").addEventListener("click", () => go("/library"));
    return;
  }
  const dept = getDepartment(sop.department);

  let approveHtml = "";
  if (sop.status !== "current") {
    if (!CURRENT_VIEWER) {
      approveHtml = `<button class="btn btn-secondary" id="approve-btn" disabled title="Set your department to approve this SOP">Approve</button>`;
    } else if (CURRENT_VIEWER.id !== sop.department) {
      approveHtml = `<button class="btn btn-secondary" id="approve-btn" disabled title="Only ${dept.name} can approve this SOP">Approve</button>`;
    } else {
      approveHtml = `<button class="btn btn-secondary" id="approve-btn" title="Mark this SOP as reviewed and current">Approve this SOP</button>`;
    }
  }

  let editHtml = "";
  if (!CURRENT_VIEWER) {
    editHtml = `<button class="btn btn-secondary" id="edit-btn" disabled title="Set your department to edit this SOP">Edit</button>`;
  } else if (CURRENT_VIEWER.id !== sop.department) {
    editHtml = `<button class="btn btn-secondary" id="edit-btn" disabled title="Only ${dept.name} can edit this SOP">Edit</button>`;
  } else {
    editHtml = `<button class="btn btn-secondary" id="edit-btn" title="Edit this SOP">Edit</button>`;
  }

  let disapproveHtml = "";
  if (!CURRENT_VIEWER) {
    disapproveHtml = `<button class="btn btn-danger" id="disapprove-btn" disabled title="Set your department to remove this SOP">Disapprove</button>`;
  } else if (CURRENT_VIEWER.id !== sop.department) {
    disapproveHtml = `<button class="btn btn-danger" id="disapprove-btn" disabled title="Only ${dept.name} can remove this SOP">Disapprove</button>`;
  } else {
    disapproveHtml = `<button class="btn btn-danger" id="disapprove-btn" title="Remove this SOP permanently">Disapprove</button>`;
  }

  const timeline = sopTimeline(sop.id);
  const historyRows = timeline.length
    ? timeline.map((e) => `
      <div class="history-row"><span class="pill-avatar">${e.deptCode}</span><span class="name">${e.deptName} Team ${e.kind === "edited" ? "edited" : "approved"} this SOP</span><span class="date">${e.fullDate}</span></div>`).join("")
    : `<p class="muted small">No updates yet.</p>`;
  const historyBtnHtml = timeline.length
    ? `<button class="btn btn-secondary" id="history-btn" title="View update history">History</button>`
    : `<button class="btn btn-secondary" id="history-btn" disabled title="No updates yet">History</button>`;

  let neverHtml = "";
  if (sop.neverDoThis) neverHtml = `<div class="never-banner"><span class="tag">Never do this</span><span>${sop.neverDoThis}</span></div>`;

  let blackoutHtml = "";
  if (sop.blackoutPeriods && sop.blackoutPeriods.length) {
    blackoutHtml = `<div class="blackout-banner" id="section-blackout">
      <span class="tag">Blackout periods — extra approval required</span>
      <ul>${sop.blackoutPeriods.map((p) => `<li>${p}</li>`).join("")}</ul>
      ${sop.blackoutFlag ? `<div class="flag-note">${sop.blackoutFlag}</div>` : ""}
    </div>`;
  }

  let beforeHtml = "";
  if (sop.beforeYouStart && sop.beforeYouStart.length) beforeHtml = `<div class="section" id="section-before"><h2>Before you start</h2><ul class="before-list">${sop.beforeYouStart.map((b) => `<li>${b}</li>`).join("")}</ul></div>`;

  let toolsHtml = "";
  if (sop.toolsSystems && sop.toolsSystems.length) toolsHtml = `<div class="section" id="section-tools"><h2>Tools &amp; systems</h2><div class="tools-table">${sop.toolsSystems.map((t) => `<div class="tools-row"><div class="name">${t.name}</div><div class="note">${t.note}</div></div>`).join("")}</div></div>`;

  const typeLabel = { info: "", checklist: "Checklist", decision: "Decision point" };
  const tagChip = { approval: `<span class="tag-chip tag-approval">Approval required</span>`, confidential: `<span class="tag-chip tag-confidential">&#128274; Confidential</span>` };
  let lastPhase = null;
  const stepsHtml = sop.steps.map((step, i) => {
    let phaseHtml = "";
    if (step.phase && step.phase !== lastPhase) { phaseHtml = `<div class="phase-heading">${step.phase}</div>`; lastPhase = step.phase; }
    let extra = "";
    if (step.type === "checklist" && step.items) extra = `<ul class="before-list" style="margin-top:8px">${step.items.map((it) => `<li>${it}</li>`).join("")}</ul>`;
    if (step.type === "decision" && step.options) extra = `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${step.options.map((o) => `<span class="badge" style="background:var(--card-bg);color:var(--text-secondary)">${o.label}</span>`).join("")}</div>`;
    const tags = (step.tags || []).map((t) => tagChip[t] || "").join("");
    return `${phaseHtml}<div class="step-row ${phaseHtml ? "phase-first" : ""}">
      <div class="step-num"><span>${i + 1}</span></div>
      <div><h3>${step.title}${typeLabel[step.type] ? `<span class="step-type">${typeLabel[step.type]}</span>` : ""}${tags}</h3><p>${step.body || ""}</p>${extra}</div>
    </div>`;
  }).join("");

  let successHtml = "";
  if (sop.successCriteria && sop.successCriteria.length) successHtml = `<div class="section" id="section-success"><h2>Success criteria</h2><ul class="before-list">${sop.successCriteria.map((c) => `<li>${c}</li>`).join("")}</ul></div>`;

  let escalationHtml = "";
  if (sop.escalation && sop.escalation.length) escalationHtml = `<div class="section" id="section-escalation"><h2>Escalation path</h2><div>${sop.escalation.map((e) => `<div class="escalation-row"><div class="when">${e.when}</div><div class="action">${e.action}</div></div>`).join("")}</div></div>`;

  let formsHtml = "";
  if (sop.forms && sop.forms.length) {
    const formItems = sop.forms.map((f) => {
      const name = typeof f === "string" ? f : f.name;
      const href = typeof f === "string" ? null : f.href;
      const flag = href ? "" : `<span class="form-flag" title="Not yet connected to an actual document">Not linked</span>`;
      return href
        ? `<li><a href="${href}" target="_blank" rel="noopener">&#128196; ${name}</a></li>`
        : `<li><a>&#128196; ${name}${flag}</a></li>`;
    }).join("");
    formsHtml = `<div class="section" id="section-forms"><h2>Forms</h2><ul class="forms-list">${formItems}</ul></div>`;
  }

  let relatedHtml = "";
  if (sop.relatedIds && sop.relatedIds.length) {
    const items = sop.relatedIds.map((rid) => { const r = getSop(rid); return r ? `<li><a data-sop="${r.id}">${r.title}</a></li>` : ""; }).join("");
    relatedHtml = `<div class="section" id="section-related"><h2>Related</h2><ul class="related-list">${items}</ul></div>`;
  }

  const toc = [
    sop.blackoutPeriods && sop.blackoutPeriods.length ? `<li><a href="#section-blackout">Blackout periods</a></li>` : "",
    sop.beforeYouStart && sop.beforeYouStart.length ? `<li><a href="#section-before">Before you start</a></li>` : "",
    sop.toolsSystems && sop.toolsSystems.length ? `<li><a href="#section-tools">Tools &amp; systems</a></li>` : "",
    `<li><a href="#section-steps">Steps</a></li>`,
    sop.successCriteria && sop.successCriteria.length ? `<li><a href="#section-success">Success criteria</a></li>` : "",
    sop.escalation && sop.escalation.length ? `<li><a href="#section-escalation">Escalation path</a></li>` : "",
    sop.forms && sop.forms.length ? `<li><a href="#section-forms">Forms</a></li>` : "",
    sop.relatedIds && sop.relatedIds.length ? `<li><a href="#section-related">Related</a></li>` : "",
    `<li><a href="#section-suggestions">Suggestions &amp; feedback</a></li>`,
  ].join("");

  let signoffHtml = `<p class="muted small">Not yet signed off.</p>`;
  if (sop.signedOffBy && sop.signedOffBy.length) {
    signoffHtml = sop.signedOffBy.map((p) => `<div class="signoff-row"><span class="pill-avatar">${(p.initials || p.name.split(" ").map((w) => w[0]).join("")).toUpperCase()}</span><span class="name">${p.name}</span><span class="date">${p.date}</span></div>`).join("");
  }

  pageBody.innerHTML = `
    <div class="breadcrumb">
      <a id="crumb-lib">Library</a><span class="sep">/</span>
      <a id="crumb-dept">${dept.name}</a><span class="sep">/</span>
      <span>${sop.title}</span>
    </div>
    <div class="sop-header">
      <div>
        <div class="row" style="gap:10px;margin-bottom:10px;">
          <span class="badge badge-${sop.status}">${statusMeta(sop.status).label}</span>
          <span class="faint small">${sop.sopId || ""}</span>
          <span class="faint small">${sop.version || ""}</span>
          ${sop.confidential ? `<span class="confidential-note">&#128274; Confidential</span>` : ""}
        </div>
        <h1>${sop.title}</h1>
        <p class="subtitle">${sop.subtitle || ""}</p>
      </div>
      <div class="sop-actions">
        ${historyBtnHtml}
        <div class="history-panel" id="history-panel">
          <div class="vm-label">Update history</div>
          ${historyRows}
        </div>
        ${approveHtml}
        ${editHtml}
        ${disapproveHtml}
        <a class="btn btn-primary" id="run-btn">Run this SOP</a>
      </div>
    </div>
    <div class="sop-layout">
      <main>
        ${neverHtml}
        ${blackoutHtml}
        ${beforeHtml}
        ${toolsHtml}
        <div class="section" id="section-steps"><h2>Steps</h2><div>${stepsHtml}</div></div>
        ${successHtml}
        ${escalationHtml}
        ${formsHtml}
        ${relatedHtml}
        ${suggestionsSectionHtml(sop)}
      </main>
      <aside>
        <div class="rail-card"><h3>On this page</h3><ul class="toc-list">${toc}</ul></div>
        <div class="rail-card">
          <h3>Details</h3>
          <div class="meta-line"><span class="k">Owner</span><span class="v"><span class="pill-avatar" style="margin-right:6px">${sop.owner.initials}</span>${sop.owner.name}</span></div>
          <div class="meta-line"><span class="k">Last reviewed</span><span class="v">${sop.lastReviewed || "—"}</span></div>
          <div class="meta-line"><span class="k">Next review</span><span class="v">${sop.nextReview || "—"}</span></div>
        </div>
        <div class="rail-card"><h3>Signed off by</h3>${signoffHtml}</div>
      </aside>
    </div>`;

  document.getElementById("crumb-lib").addEventListener("click", () => go("/library"));
  document.getElementById("crumb-dept").addEventListener("click", () => go("/library?dept=" + dept.id));
  document.getElementById("run-btn").addEventListener("click", () => go("/run/" + sop.id));
  const historyBtn = document.getElementById("history-btn");
  if (historyBtn && !historyBtn.disabled) {
    historyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("history-panel").classList.toggle("open");
    });
  }
  const editBtn = document.getElementById("edit-btn");
  if (editBtn && !editBtn.disabled) {
    editBtn.addEventListener("click", () => go("/edit/" + sop.id));
  }
  const approveBtn = document.getElementById("approve-btn");
  if (approveBtn && !approveBtn.disabled) {
    approveBtn.addEventListener("click", async () => {
      approveBtn.disabled = true;
      approveBtn.textContent = "Approving...";
      try {
        await API.approveSop(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode);
        const approval = { deptId: CURRENT_VIEWER.id, deptName: CURRENT_VIEWER.name, deptCode: CURRENT_VIEWER.code, ...eventStamp() };
        sop.status = "current";
        sop.lastReviewed = approval.monthYear;
        sop.signedOffBy = [...(sop.signedOffBy || []), { name: approval.deptName + " Team", initials: approval.deptCode, date: approval.fullDate }];
        EVENTS.push({ sopId: sop.id, kind: "approved", deptName: approval.deptName, deptCode: approval.deptCode, ts: approval.ts, fullDate: approval.fullDate });
        renderSopDetail(sop.id);
      } catch (err) {
        approveBtn.disabled = false;
        approveBtn.textContent = "Approve this SOP";
        alert("Couldn't approve: " + err.message);
      }
    });
  }
  const disapproveBtn = document.getElementById("disapprove-btn");
  if (disapproveBtn && !disapproveBtn.disabled) {
    disapproveBtn.addEventListener("click", async () => {
      const ok = confirm(`Remove "${sop.title}" permanently? This deletes the whole page and can't be undone.`);
      if (!ok) return;
      disapproveBtn.disabled = true;
      disapproveBtn.textContent = "Removing...";
      try {
        await API.disapproveSop(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode);
        const idx = SOPS.findIndex((s) => s.id === sop.id);
        if (idx !== -1) SOPS.splice(idx, 1);
        go("/library");
      } catch (err) {
        disapproveBtn.disabled = false;
        disapproveBtn.textContent = "Disapprove";
        alert("Couldn't remove: " + err.message);
      }
    });
  }
  wireSuggestionsSection(sop);
  pageBody.querySelectorAll(".before-list li").forEach((li) => li.addEventListener("click", () => li.classList.toggle("checked")));
  pageBody.querySelectorAll(".step-num").forEach((el) => el.addEventListener("click", () => el.closest(".step-row").classList.toggle("done")));
  pageBody.querySelectorAll("[data-sop]").forEach((a) => a.addEventListener("click", () => go("/sop/" + a.dataset.sop)));
  pageBody.querySelectorAll(".toc-list a").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    const target = document.querySelector(a.getAttribute("href"));
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}

/* ============================== SOP EDIT ============================== */
function fieldsFromSop(sop) {
  return {
    title: sop.title || "",
    subtitle: sop.subtitle || "",
    neverDoThis: sop.neverDoThis || "",
    beforeYouStart: sop.beforeYouStart || [],
    toolsSystems: sop.toolsSystems || [],
    steps: sop.steps || [],
    successCriteria: sop.successCriteria || [],
    escalation: sop.escalation || [],
    forms: sop.forms || [],
  };
}
function stepEditBlockHtml(step, idx) {
  const st = step || { type: "info" };
  const itemsVal = (st.items || []).join("\n");
  const optionsVal = (st.options || []).map((o) => `${o.label} | ${o.detail || ""}`).join("\n");
  const tags = st.tags || [];
  return `<div class="step-edit-block" data-idx="${idx}">
    <div class="step-edit-row">
      <input class="se-phase" placeholder="Phase (optional)" value="${escapeAttr(st.phase || "")}">
      <select class="se-type">
        <option value="info" ${st.type === "info" || !st.type ? "selected" : ""}>Info</option>
        <option value="checklist" ${st.type === "checklist" ? "selected" : ""}>Checklist</option>
        <option value="decision" ${st.type === "decision" ? "selected" : ""}>Decision</option>
      </select>
      <button type="button" class="btn btn-secondary se-remove">Remove step</button>
    </div>
    <input class="se-title" placeholder="Step title" value="${escapeAttr(st.title || "")}">
    <textarea class="se-body" placeholder="Step description" rows="2">${escapeHtml(st.body || "")}</textarea>
    <div class="se-checklist-wrap" style="display:${st.type === "checklist" ? "block" : "none"}">
      <textarea class="se-items" placeholder="One checklist item per line" rows="3">${escapeHtml(itemsVal)}</textarea>
    </div>
    <div class="se-decision-wrap" style="display:${st.type === "decision" ? "block" : "none"}">
      <textarea class="se-options" placeholder="Label | Detail (one option per line)" rows="3">${escapeHtml(optionsVal)}</textarea>
    </div>
    <div class="se-tags">
      <label><input type="checkbox" class="se-tag-approval" ${tags.includes("approval") ? "checked" : ""}> Approval required</label>
      <label><input type="checkbox" class="se-tag-confidential" ${tags.includes("confidential") ? "checked" : ""}> Confidential</label>
    </div>
  </div>`;
}
function renderSopEdit(id) {
  const sop = getSop(id);
  if (!sop) {
    pageBody.innerHTML = `<p class="muted">SOP not found. <a id="back-lib" style="text-decoration:underline;cursor:pointer">Back to the library</a>.</p>`;
    document.getElementById("back-lib").addEventListener("click", () => go("/library"));
    return;
  }
  if (!CURRENT_VIEWER || CURRENT_VIEWER.id !== sop.department) {
    const dept = getDepartment(sop.department);
    pageBody.innerHTML = `<div class="empty-state">
      <p>Only ${dept.name} can edit this SOP.</p>
      <button class="btn btn-secondary" id="back-sop">Back to the SOP</button>
    </div>`;
    document.getElementById("back-sop").addEventListener("click", () => go("/sop/" + sop.id));
    return;
  }

  const f = fieldsFromSop(sop);

  pageBody.innerHTML = `
    <div class="breadcrumb">
      <a id="crumb-sop">${sop.title}</a><span class="sep">/</span>
      <span>Edit</span>
    </div>
    <h1 style="margin-bottom:20px">Edit SOP</h1>

    <div class="edit-field"><label>Title</label><input id="ef-title" class="ef-input" value="${escapeAttr(f.title)}"></div>
    <div class="edit-field"><label>Subtitle</label><input id="ef-subtitle" class="ef-input" value="${escapeAttr(f.subtitle)}"></div>
    <div class="edit-field"><label>Never do this <span class="muted small">(optional)</span></label><input id="ef-never" class="ef-input" value="${escapeAttr(f.neverDoThis)}"></div>
    <div class="edit-field"><label>Before you start <span class="muted small">(one item per line)</span></label><textarea id="ef-before" rows="3">${escapeHtml(f.beforeYouStart.join("\n"))}</textarea></div>
    <div class="edit-field"><label>Tools &amp; systems <span class="muted small">(Name | Note — one per line)</span></label><textarea id="ef-tools" rows="3">${escapeHtml(f.toolsSystems.map((t) => `${t.name} | ${t.note || ""}`).join("\n"))}</textarea></div>

    <div class="edit-field">
      <label>Steps</label>
      <div id="steps-editor">${f.steps.map((s, i) => stepEditBlockHtml(s, i)).join("")}</div>
      <button type="button" class="btn btn-secondary" id="add-step-btn">+ Add step</button>
    </div>

    <div class="edit-field"><label>Success criteria <span class="muted small">(one per line)</span></label><textarea id="ef-success" rows="3">${escapeHtml(f.successCriteria.join("\n"))}</textarea></div>
    <div class="edit-field"><label>Escalation path <span class="muted small">(When | Action — one per line)</span></label><textarea id="ef-escalation" rows="3">${escapeHtml(f.escalation.map((e) => `${e.when} | ${e.action}`).join("\n"))}</textarea></div>
    <div class="edit-field"><label>Forms <span class="muted small">(one per line)</span></label><textarea id="ef-forms" rows="2">${escapeHtml(f.forms.join("\n"))}</textarea></div>

    <div class="edit-actions">
      <button class="btn btn-secondary" id="edit-cancel">Cancel</button>
      <button class="btn btn-primary" id="edit-save">Save changes</button>
    </div>
    <p class="muted small" id="edit-status" style="min-height:16px;margin-top:8px"></p>`;

  document.getElementById("crumb-sop").addEventListener("click", () => go("/sop/" + sop.id));
  document.getElementById("edit-cancel").addEventListener("click", () => go("/sop/" + sop.id));

  function bindStepBlock(block) {
    const typeSel = block.querySelector(".se-type");
    const checklistWrap = block.querySelector(".se-checklist-wrap");
    const decisionWrap = block.querySelector(".se-decision-wrap");
    typeSel.addEventListener("change", () => {
      checklistWrap.style.display = typeSel.value === "checklist" ? "block" : "none";
      decisionWrap.style.display = typeSel.value === "decision" ? "block" : "none";
    });
    block.querySelector(".se-remove").addEventListener("click", () => block.remove());
  }
  document.querySelectorAll(".step-edit-block").forEach(bindStepBlock);
  document.getElementById("add-step-btn").addEventListener("click", () => {
    const wrap = document.getElementById("steps-editor");
    const holder = document.createElement("div");
    holder.innerHTML = stepEditBlockHtml({ type: "info" }, wrap.children.length);
    const block = holder.firstElementChild;
    wrap.appendChild(block);
    bindStepBlock(block);
    block.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  document.getElementById("edit-save").addEventListener("click", async () => {
    const saveBtn = document.getElementById("edit-save");
    const statusEl = document.getElementById("edit-status");

    const linesOf = (el) => el.value.split("\n").map((s) => s.trim()).filter(Boolean);
    const pairsOf = (el, keyA, keyB) => linesOf(el).map((line) => {
      const [a, b] = line.split("|").map((s) => (s || "").trim());
      return { [keyA]: a, [keyB]: b || "" };
    });

    const steps = Array.from(document.querySelectorAll(".step-edit-block")).map((block) => {
      const type = block.querySelector(".se-type").value;
      const step = {
        type,
        title: block.querySelector(".se-title").value.trim(),
        body: block.querySelector(".se-body").value.trim(),
      };
      const phase = block.querySelector(".se-phase").value.trim();
      if (phase) step.phase = phase;
      const tags = [];
      if (block.querySelector(".se-tag-approval").checked) tags.push("approval");
      if (block.querySelector(".se-tag-confidential").checked) tags.push("confidential");
      if (tags.length) step.tags = tags;
      if (type === "checklist") step.items = linesOf(block.querySelector(".se-items"));
      else if (type === "decision") step.options = pairsOf(block.querySelector(".se-options"), "label", "detail");
      return step;
    }).filter((s) => s.title);

    const title = document.getElementById("ef-title").value.trim();
    if (!title) { statusEl.textContent = "Title can't be empty."; return; }
    if (!steps.length) { statusEl.textContent = "Add at least one step before saving."; return; }

    const fields = {
      title,
      subtitle: document.getElementById("ef-subtitle").value.trim(),
      beforeYouStart: linesOf(document.getElementById("ef-before")),
      toolsSystems: pairsOf(document.getElementById("ef-tools"), "name", "note"),
      steps,
      successCriteria: linesOf(document.getElementById("ef-success")),
      escalation: pairsOf(document.getElementById("ef-escalation"), "when", "action"),
      forms: linesOf(document.getElementById("ef-forms")),
    };
    const neverVal = document.getElementById("ef-never").value.trim();
    fields.neverDoThis = neverVal || undefined;

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";
    const snakeFields = {
      title: fields.title,
      subtitle: fields.subtitle,
      before_you_start: fields.beforeYouStart,
      tools_systems: fields.toolsSystems,
      steps: fields.steps,
      success_criteria: fields.successCriteria,
      escalation: fields.escalation,
      forms: fields.forms,
      never_do_this: neverVal || null,
    };
    try {
      await API.editSop(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, snakeFields);
      Object.assign(sop, fields);
      sop.status = "review-due";
      EVENTS.push({ sopId: sop.id, kind: "edited", deptName: CURRENT_VIEWER.name, deptCode: CURRENT_VIEWER.code, ...eventStamp() });
      go("/sop/" + sop.id);
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save changes";
      statusEl.textContent = "Couldn't save: " + err.message;
    }
  });
}
function renderSopNew() {
  if (!CURRENT_VIEWER) {
    pageBody.innerHTML = `<div class="empty-state">
      <p>Set your department to add a new SOP.</p>
      <button class="btn btn-secondary" id="new-pick-viewer">Which department?</button>
      <div style="margin-top:12px"><button class="btn btn-secondary" id="back-lib3">Back to the library</button></div>
    </div>`;
    document.getElementById("new-pick-viewer").addEventListener("click", (e) => { e.stopPropagation(); openViewerMenu(); });
    document.getElementById("back-lib3").addEventListener("click", () => go("/library"));
    return;
  }

  pageBody.innerHTML = `
    <div class="breadcrumb">
      <a id="crumb-lib3">Library</a><span class="sep">/</span>
      <span>New SOP</span>
    </div>
    <h1 style="margin-bottom:6px">Add a new SOP</h1>
    <p class="muted small" style="margin-bottom:20px">For ${CURRENT_VIEWER.name} &middot; starts as a draft until reviewed and approved.</p>

    <div class="edit-field"><label>Your name</label><input id="ef-added-by" class="ef-input" placeholder="e.g. Jordan Lee"></div>
    <div class="edit-field"><label>Title</label><input id="ef-title" class="ef-input" placeholder="e.g. Restocking the showroom fridge"></div>
    <div class="edit-field"><label>Subtitle</label><input id="ef-subtitle" class="ef-input" placeholder="One line describing what this SOP covers"></div>
    <div class="edit-field"><label>Never do this <span class="muted small">(optional)</span></label><input id="ef-never" class="ef-input"></div>
    <div class="edit-field"><label>Before you start <span class="muted small">(one item per line)</span></label><textarea id="ef-before" rows="3"></textarea></div>
    <div class="edit-field"><label>Tools &amp; systems <span class="muted small">(Name | Note — one per line)</span></label><textarea id="ef-tools" rows="3"></textarea></div>

    <div class="edit-field">
      <label>Steps</label>
      <div id="steps-editor">${stepEditBlockHtml({ type: "info" }, 0)}</div>
      <button type="button" class="btn btn-secondary" id="add-step-btn">+ Add step</button>
    </div>

    <div class="edit-field"><label>Success criteria <span class="muted small">(one per line)</span></label><textarea id="ef-success" rows="3"></textarea></div>
    <div class="edit-field"><label>Escalation path <span class="muted small">(When | Action — one per line)</span></label><textarea id="ef-escalation" rows="3"></textarea></div>
    <div class="edit-field"><label>Forms <span class="muted small">(one per line)</span></label><textarea id="ef-forms" rows="2"></textarea></div>

    <div class="edit-actions">
      <button class="btn btn-secondary" id="edit-cancel">Cancel</button>
      <button class="btn btn-primary" id="edit-save">Save as draft</button>
    </div>
    <p class="muted small" id="edit-status" style="min-height:16px;margin-top:8px"></p>`;

  document.getElementById("crumb-lib3").addEventListener("click", () => go("/library"));
  document.getElementById("edit-cancel").addEventListener("click", () => go("/library"));

  function bindStepBlock(block) {
    const typeSel = block.querySelector(".se-type");
    const checklistWrap = block.querySelector(".se-checklist-wrap");
    const decisionWrap = block.querySelector(".se-decision-wrap");
    typeSel.addEventListener("change", () => {
      checklistWrap.style.display = typeSel.value === "checklist" ? "block" : "none";
      decisionWrap.style.display = typeSel.value === "decision" ? "block" : "none";
    });
    block.querySelector(".se-remove").addEventListener("click", () => block.remove());
  }
  document.querySelectorAll(".step-edit-block").forEach(bindStepBlock);
  document.getElementById("add-step-btn").addEventListener("click", () => {
    const wrap = document.getElementById("steps-editor");
    const holder = document.createElement("div");
    holder.innerHTML = stepEditBlockHtml({ type: "info" }, wrap.children.length);
    const block = holder.firstElementChild;
    wrap.appendChild(block);
    bindStepBlock(block);
    block.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  document.getElementById("edit-save").addEventListener("click", async () => {
    const saveBtn = document.getElementById("edit-save");
    const statusEl = document.getElementById("edit-status");

    const linesOf = (el) => el.value.split("\n").map((s) => s.trim()).filter(Boolean);
    const pairsOf = (el, keyA, keyB) => linesOf(el).map((line) => {
      const [a, b] = line.split("|").map((s) => (s || "").trim());
      return { [keyA]: a, [keyB]: b || "" };
    });

    const steps = Array.from(document.querySelectorAll(".step-edit-block")).map((block) => {
      const type = block.querySelector(".se-type").value;
      const step = {
        type,
        title: block.querySelector(".se-title").value.trim(),
        body: block.querySelector(".se-body").value.trim(),
      };
      const phase = block.querySelector(".se-phase").value.trim();
      if (phase) step.phase = phase;
      const tags = [];
      if (block.querySelector(".se-tag-approval").checked) tags.push("approval");
      if (block.querySelector(".se-tag-confidential").checked) tags.push("confidential");
      if (tags.length) step.tags = tags;
      if (type === "checklist") step.items = linesOf(block.querySelector(".se-items"));
      else if (type === "decision") step.options = pairsOf(block.querySelector(".se-options"), "label", "detail");
      return step;
    }).filter((s) => s.title);

    const addedBy = document.getElementById("ef-added-by").value.trim();
    if (!addedBy) { statusEl.textContent = "Enter your name before saving."; return; }
    const title = document.getElementById("ef-title").value.trim();
    if (!title) { statusEl.textContent = "Title can't be empty."; return; }
    if (!steps.length) { statusEl.textContent = "Add at least one step before saving."; return; }

    const addedByInitials = addedBy.split(" ").filter(Boolean).map((w) => w[0]).join("").toUpperCase().slice(0, 3) || CURRENT_VIEWER.code;
    const subtitle = document.getElementById("ef-subtitle").value.trim();
    const beforeYouStart = linesOf(document.getElementById("ef-before"));
    const toolsSystems = pairsOf(document.getElementById("ef-tools"), "name", "note");
    const forms = linesOf(document.getElementById("ef-forms"));
    const successCriteria = linesOf(document.getElementById("ef-success"));
    const escalation = pairsOf(document.getElementById("ef-escalation"), "when", "action");
    const neverVal = document.getElementById("ef-never").value.trim();

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";
    try {
      const newId = await API.addSop(CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, {
        title, owner_name: addedBy, subtitle,
        before_you_start: beforeYouStart, tools_systems: toolsSystems,
        steps, success_criteria: successCriteria, escalation, forms,
        never_do_this: neverVal || null,
      });
      const newSop = {
        id: newId, title, department: CURRENT_VIEWER.id, status: "draft",
        owner: { name: addedBy, initials: addedByInitials },
        lastReviewed: null, nextReview: null, version: "v1 (draft)",
        subtitle, beforeYouStart, toolsSystems, signedOffBy: [], relatedIds: [],
        forms, steps, successCriteria, escalation,
      };
      if (neverVal) newSop.neverDoThis = neverVal;
      SOPS.push(newSop);
      go("/sop/" + newSop.id);
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save as draft";
      statusEl.textContent = "Couldn't save: " + err.message;
    }
  });
}

/* ============================== RUN MODE ============================== */
function renderRun(id) {
  const sop = getSop(id);
  if (!sop) {
    runRoot.innerHTML = `<div class="run-shell"><p class="muted" style="padding:40px 20px">SOP not found. <a id="back-lib2" style="text-decoration:underline;cursor:pointer">Back to the library</a>.</p></div>`;
    document.getElementById("back-lib2").addEventListener("click", () => go("/library"));
    return;
  }

  runRoot.innerHTML = `
    <div class="run-shell" id="run-shell">
      <div class="run-top">
        <div class="run-top-row">
          <a class="exit" id="exit-link">&larr; Exit run</a>
          <button class="pause-btn" id="pause-btn">Pause</button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="step-counter"><span class="small muted" id="step-label">Step 1 of 1</span><span class="small muted" id="step-tag"></span></div>
      </div>
      <div class="run-body" id="run-body"></div>
      <div class="pause-overlay" id="pause-overlay">
        <h3>Paused</h3>
        <p class="muted" style="color:rgba(255,255,255,.7)">Take your time. Nothing is lost if you close the tab.</p>
        <button class="btn btn-primary" id="resume-btn">Resume</button>
      </div>
    </div>`;

  document.getElementById("exit-link").addEventListener("click", () => go("/sop/" + sop.id));
  document.getElementById("pause-btn").addEventListener("click", () => document.getElementById("pause-overlay").classList.add("show"));
  document.getElementById("resume-btn").addEventListener("click", () => document.getElementById("pause-overlay").classList.remove("show"));

  const totalSteps = sop.steps.length + 1;
  let stepIndex = 0;
  const checklistState = sop.steps.map((s) => (s.items ? s.items.map(() => false) : []));
  const decisionChoice = {};
  const flagged = new Set();

  function isStepComplete(i) {
    const step = sop.steps[i];
    if (!step) return true;
    if (step.type === "checklist" && step.items) return checklistState[i].every(Boolean);
    if (step.type === "decision") return decisionChoice[i] !== undefined;
    return true;
  }
  function renderProgress() {
    const pct = Math.min(100, Math.round((stepIndex / (totalSteps - 1)) * 100));
    document.getElementById("progress-fill").style.width = pct + "%";
    const shown = Math.min(stepIndex + 1, totalSteps);
    document.getElementById("step-label").textContent = stepIndex >= sop.steps.length ? "Sign off" : `Step ${shown} of ${sop.steps.length}`;
    document.getElementById("step-tag").textContent = flagged.has(stepIndex) ? "Flagged" : "";
  }
  function renderStep() {
    const body = document.getElementById("run-body");
    if (stepIndex >= sop.steps.length) { renderComplete(body); renderFooterComplete(); renderProgress(); return; }
    const step = sop.steps[stepIndex];
    const tagChip = { approval: `<span class="tag-chip tag-approval">Approval required</span>`, confidential: `<span class="tag-chip tag-confidential">&#128274; Confidential</span>` };
    let inner = `<div class="sop-name">${sop.title}</div>`;
    if (stepIndex === 0 && sop.blackoutPeriods && sop.blackoutPeriods.length) {
      inner += `<div class="blackout-banner"><span class="tag">Blackout periods</span><ul>${sop.blackoutPeriods.map((p) => `<li>${p}</li>`).join("")}</ul></div>`;
    }
    if (step.phase) inner += `<div class="phase-eyebrow">${step.phase}</div>`;
    inner += `<div class="step-card"><h2>${step.title}</h2>`;
    if (step.tags && step.tags.length) inner += `<div class="step-tags">${step.tags.map((t) => tagChip[t] || "").join("")}</div>`;
    if (step.body) inner += `<p class="body-text">${step.body}</p>`;
    if (step.type === "checklist" && step.items) inner += step.items.map((it, idx) => `<div class="check-item ${checklistState[stepIndex][idx] ? "checked" : ""}" data-idx="${idx}"><span class="box">&#10003;</span><span>${it}</span></div>`).join("");
    if (step.type === "decision" && step.options) inner += step.options.map((o, idx) => `<div class="option-item ${decisionChoice[stepIndex] === idx ? "selected" : ""}" data-idx="${idx}"><span class="label">${o.label}</span><span class="detail">${o.detail}</span></div>`).join("");
    inner += `</div><button class="flag-link ${flagged.has(stepIndex) ? "flagged" : ""}" id="flag-btn">${flagged.has(stepIndex) ? "⚑ Flagged as unclear" : "Flag this step as unclear"}</button>`;
    body.innerHTML = inner;
    body.querySelectorAll(".check-item").forEach((el) => el.addEventListener("click", () => { const idx = Number(el.dataset.idx); checklistState[stepIndex][idx] = !checklistState[stepIndex][idx]; renderStep(); renderFooter(); }));
    body.querySelectorAll(".option-item").forEach((el) => el.addEventListener("click", () => { decisionChoice[stepIndex] = Number(el.dataset.idx); renderStep(); renderFooter(); }));
    document.getElementById("flag-btn").addEventListener("click", () => { flagged.has(stepIndex) ? flagged.delete(stepIndex) : flagged.add(stepIndex); renderStep(); renderProgress(); });
    renderFooter(); renderProgress();
  }
  function renderComplete(body) {
    let recapRows = "";
    sop.steps.forEach((s, i) => { if (s.type === "decision" && decisionChoice[i] !== undefined) recapRows += `<div class="recap-row"><span class="muted">${s.title}</span><span style="font-weight:600">${s.options[decisionChoice[i]].label}</span></div>`; });
    body.innerHTML = `<div class="complete-screen">
      <div class="complete-icon">&#10003;</div>
      <h2>${sop.title.split(" — ")[0]}. Done.</h2>
      <p class="sub">${CURRENT_VIEWER ? "Nice work, " + CURRENT_VIEWER.name + " team." : "Nice work."}</p>
      ${recapRows ? `<div class="recap-card"><h3>This run</h3>${recapRows}</div>` : ""}
      ${flagged.size ? `<div class="flag-note">You flagged step${flagged.size > 1 ? "s" : ""} ${[...flagged].map((i) => i + 1).join(", ")} as unclear. ${sop.owner.name} will see it in the review queue.</div>` : ""}
    </div>`;
  }
  function renderFooter() {
    let footer = document.getElementById("run-footer");
    if (!footer) { footer = document.createElement("div"); footer.className = "run-footer"; footer.id = "run-footer"; document.getElementById("run-shell").insertBefore(footer, document.getElementById("pause-overlay")); }
    const complete = isStepComplete(stepIndex);
    const isLast = stepIndex === sop.steps.length - 1;
    footer.innerHTML = `<button class="btn btn-secondary" id="back-btn" ${stepIndex === 0 ? "disabled" : ""}>Back</button><button class="btn btn-primary" id="next-btn" ${complete ? "" : "disabled"}>${isLast ? "Finish & sign off" : "Next step"}</button>`;
    document.getElementById("back-btn").addEventListener("click", () => { if (stepIndex > 0) { stepIndex--; renderStep(); } });
    document.getElementById("next-btn").addEventListener("click", () => { if (!isStepComplete(stepIndex)) return; stepIndex++; renderStep(); });
  }
  function renderFooterComplete() {
    const footer = document.getElementById("run-footer");
    footer.innerHTML = `<a class="btn btn-primary" id="back-to-sop" style="text-align:center">Back to the SOP</a>`;
    document.getElementById("back-to-sop").addEventListener("click", () => go("/sop/" + sop.id));
  }

  renderStep();
}

/* ============================== BOOT ============================== */
function mapSop(row) {
  return {
    id: row.id,
    sopId: row.sop_id || undefined,
    title: row.title,
    department: row.department,
    status: row.status,
    confidential: row.confidential || undefined,
    owner: { name: row.owner_name, initials: row.owner_initials },
    lastReviewed: row.last_reviewed,
    nextReview: row.next_review,
    version: row.version,
    subtitle: row.subtitle,
    neverDoThis: row.never_do_this || undefined,
    beforeYouStart: row.before_you_start || [],
    toolsSystems: row.tools_systems || [],
    steps: row.steps || [],
    successCriteria: row.success_criteria || [],
    escalation: row.escalation || [],
    forms: row.forms || [],
    relatedIds: row.related_ids || [],
    blackoutPeriods: row.blackout_periods && row.blackout_periods.length ? row.blackout_periods : undefined,
    blackoutFlag: row.blackout_flag || undefined,
    signedOffBy: row.signed_off_by || [],
  };
}
function mapEvent(row) {
  return { sopId: row.sop_id, kind: row.kind, deptName: row.department_name, deptCode: row.department_code, ts: row.ts, fullDate: row.full_date, monthYear: row.month_year };
}
function mapSuggestion(row) {
  return {
    id: row.id,
    sopId: row.sop_id,
    deptId: row.department_id,
    deptName: row.department_name,
    text: row.text,
    ts: row.ts,
    status: row.status,
    approvedBy: row.approved_by_dept_id ? { deptId: row.approved_by_dept_id, deptName: row.approved_by_dept_name } : undefined,
    approvedDate: row.approved_date || undefined,
  };
}

async function boot() {
  if (!API.configured()) {
    pageBody.innerHTML = `<div class="empty-state">
      <p><strong>Not set up yet.</strong></p>
      <p class="muted small">Fill in your Supabase project URL and anon key in web/js/config.js, then reload. See SETUP.md.</p>
    </div>`;
    appShell.style.display = "block";
    return;
  }
  pageBody.innerHTML = `<div class="empty-state"><p class="muted">Loading the handbook...</p></div>`;
  try {
    const [sopsRows, eventRows, suggestionRows] = await Promise.all([
      API.listSops(), API.listSopEvents(), API.listSuggestions(),
    ]);
    SOPS = sopsRows.map(mapSop);
    EVENTS = eventRows.map(mapEvent);
    SUGGESTIONS = suggestionRows.map(mapSuggestion);
    render();
  } catch (err) {
    pageBody.innerHTML = `<div class="empty-state">
      <p><strong>Couldn't load the handbook.</strong></p>
      <p class="muted small">${escapeHtml(err.message)}</p>
      <button class="btn btn-secondary" id="boot-retry">Try again</button>
    </div>`;
    document.getElementById("boot-retry").addEventListener("click", boot);
  }
}
boot();
</script>
