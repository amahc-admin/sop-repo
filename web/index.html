<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cave Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root {
    --brand-navy: #16213a;
    --yellow: #ffe500;

    --navy: #16213a;
    --canvas: #e8e6e1;
    --surface: #ffffff;
    --bg-soft: #f6f5f2;
    --bg-soft-2: #eceae5;
    --card-bg: #f1f0ed;
    --border: #e5e3de;
    --border-strong: #d1d0cc;

    --text-primary: #16213a;
    --text-secondary: #374151;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;

    --red: #e5231b; --red-bg: #fdeceb; --red-dark: #7f1d1d;
    --green: #16a34a; --green-bg: #eaf6ed; --green-dark: #15803d;
    --amber: #f59e0b; --amber-bg: #fdf4e3; --amber-dark: #b45309;
    --draft: #6b7280; --draft-bg: #eceae5; --draft-dark: #374151;

    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 24px;
    --shadow-card: 0 1px 2px rgba(22,33,58,.06), 0 1px 1px rgba(22,33,58,.04);
    --shadow-pop: 0 12px 32px rgba(22,33,58,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #aab4d4;
      --canvas: #0b0f1a;
      --surface: #121826;
      --bg-soft: #161d2e;
      --bg-soft-2: #1b2338;
      --card-bg: #182034;
      --border: #2a3350;
      --border-strong: #3c4770;
      --text-primary: #eef0f7;
      --text-secondary: #c3c8dc;
      --text-muted: #9299b8;
      --text-faint: #6b7291;
      --red: #ff6b61; --red-bg: rgba(229,35,27,.16); --red-dark: #ffb4ae;
      --green: #4ade80; --green-bg: rgba(22,163,74,.18); --green-dark: #86efac;
      --amber: #fbbf24; --amber-bg: rgba(245,158,11,.18); --amber-dark: #fde68a;
      --draft: #9299b8; --draft-bg: #1b2338; --draft-dark: #c3c8dc;
    }
  }
  :root[data-theme="dark"] {
    --navy: #aab4d4;
    --canvas: #0b0f1a;
    --surface: #121826;
    --bg-soft: #161d2e;
    --bg-soft-2: #1b2338;
    --card-bg: #182034;
    --border: #2a3350;
    --border-strong: #3c4770;
    --text-primary: #eef0f7;
    --text-secondary: #c3c8dc;
    --text-muted: #9299b8;
    --text-faint: #6b7291;
    --red: #ff6b61; --red-bg: rgba(229,35,27,.16); --red-dark: #ffb4ae;
    --green: #4ade80; --green-bg: rgba(22,163,74,.18); --green-dark: #86efac;
    --amber: #fbbf24; --amber-bg: rgba(245,158,11,.18); --amber-dark: #fde68a;
    --draft: #9299b8; --draft-bg: #1b2338; --draft-dark: #c3c8dc;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--canvas);
    color: var(--text-primary);
    font: 400 15px/1.5 Barlow, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4 { margin: 0; font-family: Barlow, system-ui, sans-serif; }
  button, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .app-shell { max-width: 1360px; margin: 0 auto; padding: 20px 20px 64px; }

  .topbar {
    display: flex; align-items: center; gap: 24px;
    background: var(--brand-navy); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 14px 24px; position: relative;
  }
  .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px; background: var(--yellow); }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 20px/1 "Barlow Condensed", sans-serif; letter-spacing: .02em; color: #fff; text-transform: uppercase; white-space: nowrap; cursor: pointer; border: none; background: none; }
  .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--yellow); color: var(--brand-navy); font-size: 18px; }
  .topnav { display: flex; align-items: center; gap: 4px; flex: 1; }
  .topnav a { color: rgba(255,255,255,.72); font: 600 14px/1 Barlow, sans-serif; padding: 9px 14px; border-radius: 8px; transition: background .12s, color .12s; cursor: pointer; }
  .topnav a:hover { background: rgba(255,255,255,.08); color: #fff; }
  .topnav a.active { background: var(--yellow); color: var(--brand-navy); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .search-box { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 8px 14px; min-width: 200px; }
  .search-box input { background: transparent; border: none; outline: none; color: #fff; font: 500 13px Barlow, sans-serif; width: 100%; }
  .search-box input::placeholder { color: rgba(255,255,255,.5); }
  .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--yellow); color: var(--brand-navy); font: 700 13px "Barlow Condensed", sans-serif; flex-shrink: 0; border: none; cursor: pointer; }
  .theme-toggle { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); color: #fff; cursor: pointer; font-size: 15px; flex-shrink: 0; }
  .theme-toggle:disabled { opacity: .35; cursor: not-allowed; }

  .hamburger-btn { display: none; width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0; }

  .viewer-wrap { position: relative; }
  .viewer-menu {
    display: none; position: absolute; top: calc(100% + 10px); right: 0; z-index: 30;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop); padding: 8px; min-width: 240px;
  }
  .viewer-menu.open { display: block; }
  .viewer-menu .vm-label { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); padding: 6px 8px 4px; }
  .viewer-menu .vm-item {
    display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer;
    font: 600 13.5px Barlow, sans-serif; color: var(--text-primary);
  }
  .viewer-menu .vm-item:hover { background: var(--card-bg); }
  .viewer-menu .vm-item.selected { background: var(--bg-soft-2); }
  .viewer-menu .vm-item .vm-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border-strong); display: grid; place-items: center; font: 700 10px "Barlow Condensed", sans-serif; flex-shrink: 0; }
  .viewer-menu .vm-clear { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; }
  .vm-item-login { padding: 8px; border-radius: 8px; background: var(--card-bg); }
  .vm-passcode-input { width: 100%; font: 400 13.5px Barlow, sans-serif; color: var(--text-primary); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }

  /* ---- Login gate (shown before any page content until logged in) ---- */
  .login-gate-wrap { max-width: 420px; margin: 48px auto; text-align: center; }
  .login-gate-wrap .brand-mark { width: 56px; height: 56px; font-size: 28px; margin: 0 auto 18px; }
  .login-gate-wrap h1 { font: 700 27px "Barlow Condensed", sans-serif; letter-spacing: .02em; text-transform: uppercase; margin-bottom: 6px; }
  .login-gate-wrap > p { margin-bottom: 26px; }
  .login-gate { text-align: left; display: flex; flex-direction: column; gap: 8px; }
  .login-gate .vm-item { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 8px; cursor: pointer; font: 600 14px Barlow, sans-serif; color: var(--text-primary); background: var(--card-bg); border: 1px solid var(--border); }
  .login-gate .vm-item:hover { background: var(--bg-soft-2); }
  .login-gate .vm-item.selected { background: var(--bg-soft-2); border-color: var(--border-strong); }
  .login-gate .vm-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-strong); display: grid; place-items: center; font: 700 11px "Barlow Condensed", sans-serif; flex-shrink: 0; }
  .login-gate .vm-item-login { border: 1px solid var(--border-strong); }

  .waiting-cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .waiting-cta p { margin: 0; }

  .page-body { background: var(--surface); border-radius: 0 0 var(--radius-lg) var(--radius-lg); box-shadow: var(--shadow-card); padding: 36px; margin-top: 12px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 700 11px/1 "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-current { background: var(--green-bg); color: var(--green-dark); }
  .badge-review-due { background: var(--amber-bg); color: var(--amber-dark); }
  .badge-overdue { background: var(--red-bg); color: var(--red-dark); }
  .badge-draft { background: var(--draft-bg); color: var(--draft-dark); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 10px; padding: 11px 20px; font: 700 14px Barlow, sans-serif; cursor: pointer; transition: transform .08s, box-shadow .12s, background .12s; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-primary { background: var(--yellow); color: var(--brand-navy); }
  .btn-primary:hover { box-shadow: 0 4px 14px rgba(255,229,0,.4); }
  .btn-secondary { background: var(--card-bg); color: var(--navy); border: 1px solid var(--border-strong); }
  .btn-secondary:hover { background: var(--bg-soft-2); }
  .btn-danger { background: var(--red-bg); color: var(--red-dark); border: 1px solid var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }

  .pill-avatar { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--brand-navy); color: #fff; font: 700 11px "Barlow Condensed", sans-serif; flex-shrink: 0; }

  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; }
  .hr { height: 1px; background: var(--border); border: none; margin: 20px 0; }

  /* ---- Home ---- */
  .dash-greeting { margin-bottom: 28px; }
  .dash-greeting h1 { font: 700 27px/1.15 Barlow, sans-serif; letter-spacing: -.01em; margin-bottom: 3px; }
  .dept-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .dept-tile { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; transition: border-color .12s, transform .08s; display: block; cursor: pointer; }
  .dept-tile:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .dept-tile .count { font: 700 30px/1 "Barlow Condensed", sans-serif; color: var(--navy); font-variant-numeric: tabular-nums; }
  .dept-tile .name { font: 600 13px Barlow, sans-serif; color: var(--text-secondary); margin-top: 4px; }
  .dept-tile .bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 12px; overflow: hidden; display: flex; }
  .dept-tile .bar span { height: 100%; }
  .dash-columns { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .dash-columns { grid-template-columns: 1fr; } }
  .panel { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; }
  .panel h2 { font: 700 15px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 14px; }
  .queue-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .queue-item:first-of-type { border-top: none; }
  .queue-item .title { font: 600 14px Barlow, sans-serif; }
  .queue-item .sub { font-size: 12px; color: var(--text-muted); }
  .queue-item .go { margin-left: auto; }
  .health-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .health-row:first-of-type { border-top: none; }
  .health-row .dept-name { flex: 0 0 150px; font: 600 13px Barlow, sans-serif; }
  .health-track { flex: 1; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; display: flex; }
  .health-track span { height: 100%; }
  .health-count { flex: 0 0 auto; font: 600 12px Barlow, sans-serif; color: var(--text-muted); }

  /* ---- Library ---- */
  .library-layout { display: grid; grid-template-columns: 220px 1fr; gap: 32px; }
  @media (max-width: 760px) { .library-layout { grid-template-columns: 1fr; } }
  .sidebar-section { margin-bottom: 26px; }
  .sidebar-section h3 { font: 700 12px "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
  .filter-list { list-style: none; margin: 0; padding: 0; }
  .filter-list li a { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 8px; font: 600 13.5px Barlow, sans-serif; color: var(--text-secondary); cursor: pointer; }
  .filter-list li a:hover { background: var(--bg-soft); }
  .filter-list li a.active { background: var(--brand-navy); color: #fff; }
  .filter-list li a .n { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .filter-list li a.active .n { color: rgba(255,255,255,.6); }
  .filter-list li a .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; display: inline-block; }
  .library-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .library-header h1 { font: 700 34px/1 "Barlow Condensed", sans-serif; letter-spacing: .03em; text-transform: uppercase; }
  .view-toggle { display: flex; gap: 4px; background: var(--card-bg); border-radius: 8px; padding: 3px; }
  .view-toggle button { border: none; background: transparent; padding: 6px 14px; border-radius: 6px; font: 700 12.5px Barlow, sans-serif; color: var(--text-muted); cursor: pointer; }
  .view-toggle button.active { background: var(--surface); color: var(--navy); box-shadow: var(--shadow-card); }
  .sop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .sop-grid.view-list { grid-template-columns: 1fr; }
  .sop-card { background: var(--card-bg); border: 1px solid var(--border); border-top: 4px solid transparent; border-radius: var(--radius-md); padding: 16px; transition: transform .08s, box-shadow .12s; display: block; cursor: pointer; }
  .sop-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
  .sop-card.st-current { border-top-color: var(--green); }
  .sop-card.st-review-due { border-top-color: var(--amber); }
  .sop-card.st-overdue { border-top-color: var(--red); }
  .sop-card.st-draft { border-top-color: var(--draft); }
  .sop-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .sop-card .title { font: 600 15px/1.3 Barlow, sans-serif; color: var(--navy); margin-bottom: 4px; }
  .sop-card .subtitle { font-size: 12.5px; color: var(--text-muted); }
  .sop-card .meta-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .sop-card .meta-row .reviewed { font-size: 12px; color: var(--text-faint); }
  .sop-grid.view-list .sop-card { display: flex; align-items: center; gap: 16px; border-top: none; border-left: 4px solid transparent; }
  .sop-grid.view-list .sop-card.st-current { border-left-color: var(--green); }
  .sop-grid.view-list .sop-card.st-review-due { border-left-color: var(--amber); }
  .sop-grid.view-list .sop-card.st-overdue { border-left-color: var(--red); }
  .sop-grid.view-list .sop-card.st-draft { border-left-color: var(--draft); }
  .sop-grid.view-list .sop-card .top-row { flex: 1; margin-bottom: 0; }
  .sop-grid.view-list .sop-card .meta-row { margin-top: 0; flex: 0 0 auto; }
  .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }

  /* ---- SOP detail ---- */
  .breadcrumb { font: 600 12.5px Barlow, sans-serif; color: var(--text-muted); margin-bottom: 14px; }
  .breadcrumb a { cursor: pointer; }
  .breadcrumb a:hover { color: var(--navy); }
  .breadcrumb .sep { margin: 0 6px; color: var(--text-faint); }
  .sop-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .sop-header h1 { font: 600 38px/1.12 Barlow, sans-serif; letter-spacing: -.02em; max-width: 30ch; text-wrap: balance; }
  .sop-header .subtitle { color: var(--text-muted); margin-top: 8px; font-size: 15px; }
  .sop-actions { display: flex; gap: 8px; flex-shrink: 0; position: relative; }
  .history-panel {
    display: none; position: absolute; top: calc(100% + 10px); left: 0; z-index: 30;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop); padding: 8px; min-width: 280px; max-width: 340px;
  }
  .history-panel.open { display: block; }
  .history-panel .vm-label { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); padding: 6px 8px 4px; }
  .history-row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; font-size: 13px; }
  .history-row .name { flex: 1; }
  .history-row .date { color: var(--text-faint); font-size: 12px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .history-panel p.muted { padding: 6px 8px; }
  .sop-layout { display: grid; grid-template-columns: 1fr 300px; gap: 36px; }
  .sop-layout main, .sop-layout aside { min-width: 0; }
  @media (max-width: 900px) { .sop-layout { grid-template-columns: 1fr; } }
  .never-banner { display: flex; gap: 10px; align-items: flex-start; background: var(--red-bg); color: var(--red-dark); border: 1px solid var(--red); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 24px; font: 600 14px/1.4 Barlow, sans-serif; }
  .never-banner .tag { font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }
  .blackout-banner { background: var(--amber-bg); color: var(--amber-dark); border: 1px solid var(--amber); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 24px; }
  .blackout-banner .tag { display: block; font: 700 11px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
  .blackout-banner ul { margin: 0; padding-left: 18px; }
  .blackout-banner li { font: 600 14px/1.5 Barlow, sans-serif; margin-bottom: 4px; }
  .blackout-banner .flag-note { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(138,75,0,.2); font: 600 13px/1.5 Barlow, sans-serif; }
  .section { margin-bottom: 32px; scroll-margin-top: 20px; }
  .section h2 { font: 600 19px Barlow, sans-serif; margin-bottom: 14px; }
  .before-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .before-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-secondary); cursor: pointer; user-select: none; border-radius: 8px; padding: 4px 6px; margin: 0 -6px; transition: background .12s, color .12s; }
  .before-list li:hover { background: var(--card-bg); }
  .before-list li::before { content: "\2713"; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; background: var(--card-bg); border: 1px solid var(--border-strong); font-size: 11px; color: transparent; flex-shrink: 0; transition: background .12s, border-color .12s, color .12s; }
  .before-list li.checked { color: var(--text-faint); text-decoration: line-through; }
  .before-list li.checked::before { content: "\2713"; background: var(--green); border-color: var(--green); color: var(--surface); }
  .step-row { display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid var(--border); }
  .step-row:first-of-type, .step-row.phase-first { border-top: none; }
  .step-num { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--card-bg); display: grid; place-items: center; font: 700 13px "Barlow Condensed", sans-serif; color: var(--navy); cursor: pointer; user-select: none; border: 2px solid transparent; transition: background .12s, border-color .12s, color .12s; }
  .step-num:hover { border-color: var(--border-strong); }
  .step-row.done .step-num { background: var(--green); color: var(--surface); }
  .step-row.done .step-num::before { content: "\2713"; }
  .step-row.done .step-num span { display: none; }
  .step-row.done h3, .step-row.done p { color: var(--text-faint); text-decoration: line-through; }
  .step-row h3 { font: 600 15.5px Barlow, sans-serif; margin-bottom: 4px; }
  .step-row p { font-size: 13.5px; color: var(--text-muted); margin: 0; }

<script>
/* ============================== DATA ============================== */
const DEPARTMENTS = [
  { id: "operations", name: "Operations" },
  { id: "sales", name: "Sales" },
  { id: "cx", name: "Customer Experience" },
  { id: "installations", name: "Installations" },
  { id: "marketing", name: "Marketing" },
  { id: "accounts", name: "Accounts" },
  { id: "exec", name: "Exec Admin" },
];

const STATUSES = [
  { id: "current", label: "Current" },
  { id: "review-due", label: "Review due" },
  { id: "overdue", label: "Overdue" },
  { id: "draft", label: "Draft" },
];

const DEPT_CODES = { operations: "OPS", sales: "SAL", cx: "CX", installations: "INS", marketing: "MKT", accounts: "ACC", exec: "EXA" };
// There are only 2 shared logins now: Admin (full management rights) and
// Member (can view, suggest, and add a new SOP, but an edit to an
// EXISTING SOP goes in as a pending proposal an Admin must approve --
// see proposeSopEdit/approveSopEdit/rejectSopEdit). DEPARTMENTS above is
// now purely a categorization tag on a SOP (which team it belongs to),
// unrelated to who's logged in.
const LOGINS = [
  { id: "admin", name: "Admin", code: "ADM" },
  { id: "member", name: "Member", code: "MEM" },
];
function isAdmin(viewer) {
  return !!viewer && viewer.id === "admin";
}
// CURRENT_VIEWER also carries `passcode` and `lastName` fields -- the
// shared login passcode and the person's own last name (for attribution
// only, not auth), both cached in this browser so writes don't ask for
// them every time. Neither ever leaves the browser except as arguments to
// the passcode-gated RPC calls in api.js, each of which re-verifies the
// passcode server-side; the last name is never itself verified, only
// recorded.
function getViewer() {
  try {
    const raw = localStorage.getItem("cave-handbook-viewer");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function setViewer(role) {
  try {
    role ? localStorage.setItem("cave-handbook-viewer", JSON.stringify(role)) : localStorage.removeItem("cave-handbook-viewer");
  } catch (e) {}
}
let CURRENT_VIEWER = getViewer();

/* ============================== SUGGESTIONS (shared, per-SOP) ============================== */
let SUGGESTIONS = [];
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return escapeHtml(str || "").replace(/"/g, "&quot;");
}
function initialsFrom(name) {
  return (name || "").split(/\s+/).filter(Boolean).map((w) => w[0]).join("").toUpperCase().slice(0, 3) || "NA";
}
function suggestionsFor(sopId) {
  return SUGGESTIONS.filter((s) => s.sopId === sopId).sort((a, b) => b.ts - a.ts);
}
function suggestionStatus(s) {
  return s.status || "pending";
}
function suggestionsSectionHtml(sop) {
  const list = suggestionsFor(sop.id);
  const items = list.length
    ? list.map((s) => `
      <div class="suggestion-item">
        <div class="suggestion-meta"><span class="suggestion-dept">${escapeHtml(s.lastName)} (${s.loginName})</span><span class="suggestion-status suggestion-status-${suggestionStatus(s)}">${suggestionStatus(s) === "approved" ? "Approved" : "Pending"}</span><span class="suggestion-date">${new Date(s.ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span></div>
        <p class="suggestion-text">${escapeHtml(s.text)}</p>
      </div>`).join("")
    : `<p class="muted small">No suggestions yet. Be the first to flag an improvement.</p>`;
  const prompt = CURRENT_VIEWER
    ? `<div class="suggestion-form">
        <textarea id="suggestion-input" rows="3" placeholder="Suggest an improvement to this SOP..."></textarea>
        <div class="suggestion-form-row">
          <span class="muted small">Posting as <strong>${escapeHtml(CURRENT_VIEWER.lastName)}</strong> (${CURRENT_VIEWER.name})</span>
          <button class="btn btn-primary" id="suggestion-submit">Send suggestion</button>
        </div>
        <p class="muted small" id="suggestion-status" style="min-height:16px"></p>
      </div>`
    : `<div class="suggestion-form suggestion-form-locked">
        <p class="muted small">Log in to leave a suggestion.</p>
        <button class="btn btn-secondary" id="suggestion-pick-viewer">Log in</button>
      </div>`;
  return `<div class="section" id="section-suggestions">
    <h2>Suggestions &amp; feedback</h2>
    <div class="suggestion-list" id="suggestion-list">${items}</div>
    ${prompt}
  </div>`;
}
function wireSuggestionsSection(sop) {
  const pickBtn = document.getElementById("suggestion-pick-viewer");
  if (pickBtn) pickBtn.addEventListener("click", (e) => { e.stopPropagation(); openViewerMenu(); });
  const submitBtn = document.getElementById("suggestion-submit");
  if (!submitBtn) return;
  submitBtn.addEventListener("click", async (e) => {
    const input = document.getElementById("suggestion-input");
    const status = document.getElementById("suggestion-status");
    const text = input.value.trim();
    if (!text) { status.textContent = "Write a suggestion before sending."; return; }
    if (!CURRENT_VIEWER) { e.stopPropagation(); openViewerMenu(); return; }
    submitBtn.disabled = true;
    status.textContent = "Sending...";
    try {
      const id = await API.addSuggestion(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName, text);
      SUGGESTIONS.push({ id, sopId: sop.id, loginId: CURRENT_VIEWER.id, loginName: CURRENT_VIEWER.name, lastName: CURRENT_VIEWER.lastName, text, ts: Date.now(), status: "pending" });
      document.getElementById("suggestion-list").innerHTML = suggestionsFor(sop.id).length
        ? suggestionsFor(sop.id).map((s) => `
          <div class="suggestion-item">
            <div class="suggestion-meta"><span class="suggestion-dept">${escapeHtml(s.lastName)} (${s.loginName})</span><span class="suggestion-status suggestion-status-${suggestionStatus(s)}">${suggestionStatus(s) === "approved" ? "Approved" : "Pending"}</span><span class="suggestion-date">${new Date(s.ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span></div>
            <p class="suggestion-text">${escapeHtml(s.text)}</p>
          </div>`).join("")
        : "";
      input.value = "";
      status.textContent = "Saved to the shared board.";
    } catch (err) {
      status.textContent = "Couldn't send: " + err.message;
    }
    submitBtn.disabled = false;
  });
}

/* ============================== THEME ============================== */
(function initTheme() {
  let stored = null;
  try { stored = localStorage.getItem("cave-handbook-theme"); } catch (e) {}
  if (stored === "dark" || stored === "light") document.documentElement.setAttribute("data-theme", stored);
  updateThemeIcon();
})();
function updateThemeIcon() {
  const attr = document.documentElement.getAttribute("data-theme");
  const btn = document.getElementById("theme-toggle");
  btn.textContent = attr === "dark" ? String.fromCharCode(9728) : attr === "light" ? String.fromCharCode(9789) : String.fromCharCode(9681);
}
document.getElementById("theme-toggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  let next;
  if (!current) next = sysDark ? "light" : "dark";
  else if (current === "dark") next = "light";
  else next = null;
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try { next ? localStorage.setItem("cave-handbook-theme", next) : localStorage.removeItem("cave-handbook-theme"); } catch (e) {}
  updateThemeIcon();
});

    });

/* ============================== ROUTER ============================== */
function parseHash() {
  let hash = location.hash.slice(1) || "/";
  const qIdx = hash.indexOf("?");
  const path = qIdx === -1 ? hash : hash.slice(0, qIdx);
  const params = new URLSearchParams(qIdx === -1 ? "" : hash.slice(qIdx + 1));
  return { path, params };
}
function go(path) { location.hash = "#" + path; }

let NAV_STACK = [];
function pushNav() {
  const h = location.hash || "#/";
  if (NAV_STACK[NAV_STACK.length - 1] !== h) NAV_STACK.push(h);
  if (NAV_STACK.length > 50) NAV_STACK.shift();
}
function updateBackButton() {
  document.getElementById("nav-back-btn").disabled = NAV_STACK.length <= 1;
}
function goBack() {
  if (NAV_STACK.length > 1) {
    NAV_STACK.pop();
    location.hash = NAV_STACK[NAV_STACK.length - 1];
  } else {
    go("/");
  }
}
document.getElementById("nav-back-btn").addEventListener("click", goBack);

document.getElementById("brand-link").addEventListener("click", () => go("/"));
document.getElementById("topnav").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-route]");
  if (!a) return;
  document.getElementById("topnav").classList.remove("open");
  const r = a.dataset.route;
  if (r === "#") return;
  go(r);
});

let librarySearchQuery = "";
const globalSearch = document.getElementById("global-search");
globalSearch.addEventListener("input", (e) => {
  librarySearchQuery = e.target.value;
  const { path } = parseHash();
  if (path === "/library") {
    renderCards();
  } else if (librarySearchQuery.trim()) {
    go("/library");
  }
});

    });

  const loginBtn = document.getElementById("gate-login-btn");
  if (loginBtn) {
    const lastNameInput = document.getElementById("gate-lastname-input");
    const input = document.getElementById("gate-passcode-input");
    const errEl = document.getElementById("gate-login-error");
    const doLogin = async () => {
      const lastName = lastNameInput.value.trim();
      const passcode = input.value;
      if (!lastName) { errEl.textContent = "Enter your last name."; return; }
      if (!passcode) { errEl.textContent = "Enter the passcode."; return; }
      loginBtn.disabled = true;
      loginBtn.textContent = "Checking...";
      try {
        const login = await API.login(gatePendingLoginId, passcode);
        CURRENT_VIEWER = { id: login.id, name: login.name, code: login.code, passcode, lastName };
        setViewer(CURRENT_VIEWER);
        gatePendingLoginId = null;

        loginBtn.textContent = "Log in";
        errEl.textContent = "Wrong passcode.";
      }

    loginBtn.addEventListener("click", (e) => { e.stopPropagation(); doLogin(); });
    input.addEventListener("click", (e) => e.stopPropagation());
    lastNameInput.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
    lastNameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") input.focus(); });
    document.getElementById("gate-login-cancel").addEventListener("click", (e) => {
      e.stopPropagation();
      gatePendingLoginId = null;
      renderLoginGate();
    });
  }
}

function render() {
  if (!CURRENT_VIEWER) {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderLoginGate();
    return;
  }
  const { path, params } = parseHash();
  window.scrollTo(0, 0);
  pushNav();
  updateBackButton();
  document.querySelectorAll("#topnav a").forEach((a) => a.classList.remove("active"));
  if (path === "/") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    document.querySelector('#topnav a[data-route="/"]').classList.add("active");
    renderHome();
  } else if (path === "/library") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    document.querySelectorAll('#topnav a[data-route="/library"]')[0].classList.add("active");
    globalSearch.value = librarySearchQuery;
    renderLibrary(params);
  } else if (path === "/suggestions") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    document.querySelectorAll('#topnav a[data-route="/suggestions"]')[0].classList.add("active");
    renderSuggestionsPage();
  } else if (path === "/directory") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    document.querySelectorAll('#topnav a[data-route="/directory"]')[0].classList.add("active");
    renderDirectory();
  } else if (path === "/directory/new") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderDirectoryNew();
  } else if (path.indexOf("/directory/edit/") === 0) {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderDirectoryEdit(decodeURIComponent(path.slice(16)));
  } else if (path === "/new") {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderSopNew();
  } else if (path.indexOf("/edit/") === 0) {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderSopEdit(decodeURIComponent(path.slice(6)));
  } else if (path.indexOf("/sop/") === 0) {
    appShell.style.display = "block"; runRoot.style.display = "none";
    renderSopDetail(decodeURIComponent(path.slice(5)));
  } else if (path.indexOf("/run/") === 0) {
    appShell.style.display = "none"; runRoot.style.display = "block";
    renderRun(decodeURIComponent(path.slice(5)));
  } else {
    go("/");
  }
}
window.addEventListener("hashchange", render);

/* ============================== HOME ============================== */
function renderHome() {
  const h = new Date().getHours();
  const word = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";

  const tiles = DEPARTMENTS.map((d) => {
    const sops = sopsByDepartment(d.id);
    const total = sops.length;
    const segments = STATUSES.map((s) => {
      const n = sops.filter((x) => x.status === s.id).length;
      if (!n) return "";
      const pct = (n / total) * 100;
      return `<span style="width:${pct}%;background:${STATUS_COLOR[s.id]}"></span>`;
    }).join("");
    return `<a class="dept-tile" data-dept="${d.id}"><div class="count">${total}</div><div class="name">${d.name}</div><div class="bar">${segments}</div></a>`;
  }).join("");

  let waiting;
  if (!CURRENT_VIEWER) {
    waiting = `<div class="waiting-cta"><p class="muted small">Log in to see what needs attention.</p><button class="btn btn-secondary" id="waiting-set-viewer">Log in</button></div>`;
  } else if (!isAdmin(CURRENT_VIEWER)) {
    waiting = `<p class="muted small">SOP approvals are handled by an Admin.</p>`;
  } else {
    const mine = SOPS.filter((s) => s.status === "overdue" || s.status === "review-due");
    waiting = mine.length
      ? mine.map((s) => {
          const label = s.status === "overdue" ? "Sign off" : "Review due";
          return `<div class="queue-item">
            <span class="badge badge-${s.status}">${statusMeta(s.status).label}</span>
            <div><div class="title">${label}: ${s.title}</div><div class="sub">${s.owner.name}</div></div>
            <a class="btn btn-secondary go" data-sop="${s.id}">Open</a>
          </div>`;
        }).join("")
      : `<p class="muted small">Nothing needs attention right now.</p>`;
  }

  const health = DEPARTMENTS.map((d) => {
    const sops = sopsByDepartment(d.id);
    const total = sops.length || 1;
    const segments = STATUSES.map((s) => {
      const n = sops.filter((x) => x.status === s.id).length;
      if (!n) return "";
      const pct = (n / total) * 100;
      return `<span style="width:${pct}%;background:${STATUS_COLOR[s.id]}"></span>`;
    }).join("");
    const overdue = sops.filter((s) => s.status === "overdue").length;
    return `<div class="health-row"><div class="dept-name">${d.name}</div><div class="health-track">${segments}</div><div class="health-count">${overdue ? overdue + " overdue" : "on track"}</div></div>`;
  }).join("");

  pageBody.innerHTML = `
    <div class="dash-greeting">
      <h1>${word}.</h1>
      <p class="muted">${CURRENT_VIEWER ? "Here's what's happening across the Handbook today, " + escapeHtml(CURRENT_VIEWER.lastName) + "." : "Here's what's happening across the Handbook today."}</p>
    </div>
    <div class="dept-tiles">${tiles}</div>
    <div class="dash-columns">
      <div class="panel"><h2>Needs attention</h2>${waiting}</div>
      <div class="panel"><h2>Team health</h2>${health}</div>
    </div>`;

  pageBody.querySelectorAll(".dept-tile").forEach((el) => el.addEventListener("click", () => go("/library?dept=" + el.dataset.dept)));
  const waitingBtn = document.getElementById("waiting-set-viewer");
  if (waitingBtn) waitingBtn.addEventListener("click", (e) => { e.stopPropagation(); openViewerMenu(); });
  pageBody.querySelectorAll("[data-sop]").forEach((el) => el.addEventListener("click", () => go("/sop/" + el.dataset.sop)));
}

let EDIT_PROPOSALS = []; // populated from sop_edit_proposals at boot (see boot())
const EDIT_FIELD_LABELS = {
  title: "Title", subtitle: "Subtitle", never_do_this: "Never do this",
  before_you_start: "Before you start", tools_systems: "Tools & systems", steps: "Steps",
  success_criteria: "Success criteria", escalation: "Escalation path", forms: "Forms",
};
const EDIT_FIELD_CAMEL = {
  title: "title", subtitle: "subtitle", never_do_this: "neverDoThis",
  before_you_start: "beforeYouStart", tools_systems: "toolsSystems", steps: "steps",
  success_criteria: "successCriteria", escalation: "escalation", forms: "forms",
};
function formatFieldValue(v) {
  if (v === null || v === undefined) return "(none)";
  if (typeof v === "string") return v || "(empty)";
  if (Array.isArray(v)) {
    if (!v.length) return "(none)";
    return v.map((item) => (typeof item === "string" ? item : Object.values(item).filter(Boolean).join(" — "))).join("\n");
  }
  return JSON.stringify(v);
}
// Compares the proposal's saved field values against the SOP's CURRENT
// values and returns only the fields that actually differ -- this is what
// lets the review UI highlight just what changed, not the whole SOP.
function diffProposalFields(sop, fields) {
  const out = [];
  Object.keys(fields || {}).forEach((key) => {
    const camel = EDIT_FIELD_CAMEL[key];
    if (!camel) return;
    const oldVal = sop ? sop[camel] : undefined;
    const newVal = fields[key];
    if (JSON.stringify(oldVal == null ? null : oldVal) === JSON.stringify(newVal == null ? null : newVal)) return;
    out.push({ key, label: EDIT_FIELD_LABELS[key] || key, oldVal, newVal });
  });
  return out;
}
let editProposalFilter = "pending";

  const all = EDIT_PROPOSALS.slice().sort((a, b) => b.ts - a.ts);

  const rows = list.length

        const diffHtml = diff.length

            </div>`).join("")
          : `<p class="muted small">No changes detected.</p>`;
        let actionHtml = "";
        if (p.status === "approved") {
          actionHtml = `<span class="review-note">Approved by ${escapeHtml(p.decidedByLastName || "—")}${p.decidedDate ? " · " + p.decidedDate : ""}</span>`;
        } else if (p.status === "rejected") {

        } else if (!isAdmin(CURRENT_VIEWER)) {
          actionHtml = `<button class="btn btn-secondary" disabled title="Only an Admin can decide this">Approve</button> <button class="btn btn-secondary" disabled title="Only an Admin can decide this">Reject</button>`;
        } else {
          actionHtml = `<button class="btn btn-secondary" data-approve-edit="${p.id}">Approve</button> <button class="btn btn-danger" data-reject-edit="${p.id}">Reject</button>`;
        }
        return `<div class="review-item">
          <div class="suggestion-meta">
            <span class="suggestion-dept">${escapeHtml(p.lastName)} (${p.loginName})</span>
            <span class="suggestion-status suggestion-status-${p.status === "approved" ? "approved" : "pending"}">${p.status === "pending" ? "Pending" : p.status === "approved" ? "Approved" : "Rejected"}</span>
            <span class="suggestion-date">${new Date(p.ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span>
          </div>

          <div class="proposal-diff">${diffHtml}</div>
          <div class="review-footer">${actionHtml}</div>
        </div>`;
      }).join("")
    : `<div class="empty-state">No ${editProposalFilter === "all" ? "" : editProposalFilter + " "}edit proposals yet.</div>`;

  return `

const DIRECTORY_FIELD_LABELS = { name: "Name", role: "Role", department: "Department", email: "Email", phone: "Phone", notes: "Notes", reports_to: "Reports to", photo_url: "Photo" };
function personName(id) {
  const p = DIRECTORY.find((x) => x.id === id);

}
function diffDirectoryProposalFields(entry, fields) {
  const out = [];
  Object.keys(fields || {}).forEach((key) => {
    if (!(key in DIRECTORY_FIELD_LABELS)) return;
    const oldVal = entry ? (key === "reports_to" ? entry.reportsTo : key === "photo_url" ? entry.photoUrl : entry[key]) : undefined;
    const newVal = fields[key];
    if ((oldVal || "") === (newVal || "")) return;
    const display = (v) => {
      if (key === "department") return (getDepartment(v) || {}).name || v || "(none)";
      if (key === "reports_to") return v ? (personName(v) || v) : "(none)";
      if (key === "photo_url") return v ? "(photo)" : "(no photo)";
      return v || "(empty)";
    };
    out.push({ key, label: DIRECTORY_FIELD_LABELS[key], oldVal: display(oldVal), newVal: display(newVal) });
  });
  return out;
}

  let editHtml = "";
  if (!CURRENT_VIEWER) {
    editHtml = `<button class="btn btn-secondary" id="edit-btn" disabled title="Log in to edit this SOP">Edit</button>`;
  } else if (isAdmin(CURRENT_VIEWER)) {
    editHtml = `<button class="btn btn-secondary" id="edit-btn" title="Edit this SOP">Edit</button>`;
  } else {
    editHtml = `<button class="btn btn-secondary" id="edit-btn" title="Propose an edit for an Admin to review">Propose edit</button>`;
  }

  let disapproveHtml = "";
  if (!CURRENT_VIEWER) {
    disapproveHtml = `<button class="btn btn-danger" id="disapprove-btn" disabled title="Log in as Admin to remove this SOP">Disapprove</button>`;
  } else if (!isAdmin(CURRENT_VIEWER)) {
    disapproveHtml = `<button class="btn btn-danger" id="disapprove-btn" disabled title="Only an Admin can remove this SOP">Disapprove</button>`;
  } else {
    disapproveHtml = `<button class="btn btn-danger" id="disapprove-btn" title="Remove this SOP permanently">Disapprove</button>`;
  }

  const timeline = sopTimeline(sop.id);
  const historyRows = timeline.length
    ? timeline.map((e) => `
      <div class="history-row"><span class="pill-avatar">${initialsFrom(e.lastName)}</span><span class="name">${escapeHtml(e.lastName)}${e.loginName ? ` (${e.loginName})` : ""} ${e.kind === "edited" ? "edited" : "approved"} this SOP</span><span class="date">${e.fullDate}</span></div>`).join("")
    : `<p class="muted small">No updates yet.</p>`;
  const historyBtnHtml = timeline.length
    ? `<button class="btn btn-secondary" id="history-btn" title="View update history">History</button>`
    : `<button class="btn btn-secondary" id="history-btn" disabled title="No updates yet">History</button>`;

  let neverHtml = "";
  if (sop.neverDoThis) neverHtml = `<div class="never-banner"><span class="tag">Never do this</span><span>${sop.neverDoThis}</span></div>`;

  const pendingEdits = EDIT_PROPOSALS.filter((p) => p.sopId === sop.id && p.status === "pending");
  let pendingEditHtml = "";
  if (pendingEdits.length) {
    pendingEditHtml = `<div class="never-banner" id="section-pending-edit">
      <span class="tag">Edit awaiting approval</span>
      <span>${pendingEdits.length === 1 ? `${escapeHtml(pendingEdits[0].lastName)} proposed changes to this SOP` : `${pendingEdits.length} proposed edits`} &mdash; <a id="pending-edit-link" style="text-decoration:underline;cursor:pointer">review${isAdmin(CURRENT_VIEWER) ? "" : " status"}</a></span>
    </div>`;
  }

  let blackoutHtml = "";
  if (sop.blackoutPeriods && sop.blackoutPeriods.length) {
    blackoutHtml = `<div class="blackout-banner" id="section-blackout">
      <span class="tag">Blackout periods — extra approval required</span>
      <ul>${sop.blackoutPeriods.map((p) => `<li>${p}</li>`).join("")}</ul>
      ${sop.blackoutFlag ? `<div class="flag-note">${sop.blackoutFlag}</div>` : ""}
    </div>`;
  }

  let beforeHtml = "";
  if (sop.beforeYouStart && sop.beforeYouStart.length) beforeHtml = `<div class="section" id="section-before"><h2>Before you start</h2><ul class="before-list">${sop.beforeYouStart.map((b) => `<li>${b}</li>`).join("")}</ul></div>`;

  let toolsHtml = "";
  if (sop.toolsSystems && sop.toolsSystems.length) toolsHtml = `<div class="section" id="section-tools"><h2>Tools &amp; systems</h2><div class="tools-table">${sop.toolsSystems.map((t) => `<div class="tools-row"><div class="name">${t.name}</div><div class="note">${t.note}</div></div>`).join("")}</div></div>`;

  const typeLabel = { info: "", checklist: "Checklist", decision: "Decision point" };
  const tagChip = { approval: `<span class="tag-chip tag-approval">Approval required</span>`, confidential: `<span class="tag-chip tag-confidential">&#128274; Confidential</span>` };
  let lastPhase = null;
  const stepsHtml = sop.steps.map((step, i) => {
    let phaseHtml = "";
    if (step.phase && step.phase !== lastPhase) { phaseHtml = `<div class="phase-heading">${step.phase}</div>`; lastPhase = step.phase; }
    let extra = "";
    if (step.type === "checklist" && step.items) extra = `<ul class="before-list" style="margin-top:8px">${step.items.map((it) => `<li>${it}</li>`).join("")}</ul>`;
    if (step.type === "decision" && step.options) extra = `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${step.options.map((o) => `<span class="badge" style="background:var(--card-bg);color:var(--text-secondary)">${o.label}</span>`).join("")}</div>`;
    const tags = (step.tags || []).map((t) => tagChip[t] || "").join("");
    return `${phaseHtml}<div class="step-row ${phaseHtml ? "phase-first" : ""}">
      <div class="step-num"><span>${i + 1}</span></div>
      <div><h3>${step.title}${typeLabel[step.type] ? `<span class="step-type">${typeLabel[step.type]}</span>` : ""}${tags}</h3><p>${step.body || ""}</p>${extra}</div>
    </div>`;
  }).join("");

  let successHtml = "";
  if (sop.successCriteria && sop.successCriteria.length) successHtml = `<div class="section" id="section-success"><h2>Success criteria</h2><ul class="before-list">${sop.successCriteria.map((c) => `<li>${c}</li>`).join("")}</ul></div>`;

  let escalationHtml = "";
  if (sop.escalation && sop.escalation.length) escalationHtml = `<div class="section" id="section-escalation"><h2>Escalation path</h2><div>${sop.escalation.map((e) => `<div class="escalation-row"><div class="when">${e.when}</div><div class="action">${e.action}</div></div>`).join("")}</div></div>`;

  let formsHtml = "";
  if (sop.forms && sop.forms.length) {
    const formItems = sop.forms.map((f) => {
      const name = typeof f === "string" ? f : f.name;
      const href = typeof f === "string" ? null : f.href;
      const flag = href ? "" : `<span class="form-flag" title="Not yet connected to an actual document">Not linked</span>`;
      return href
        ? `<li><a href="${href}" target="_blank" rel="noopener">&#128196; ${name}</a></li>`
        : `<li><a>&#128196; ${name}${flag}</a></li>`;
    }).join("");
    formsHtml = `<div class="section" id="section-forms"><h2>Forms</h2><ul class="forms-list">${formItems}</ul></div>`;
  }

  let relatedHtml = "";
  if (sop.relatedIds && sop.relatedIds.length) {
    const items = sop.relatedIds.map((rid) => { const r = getSop(rid); return r ? `<li><a data-sop="${r.id}">${r.title}</a></li>` : ""; }).join("");
    relatedHtml = `<div class="section" id="section-related"><h2>Related</h2><ul class="related-list">${items}</ul></div>`;
  }

  const toc = [
    sop.blackoutPeriods && sop.blackoutPeriods.length ? `<li><a href="#section-blackout">Blackout periods</a></li>` : "",
    sop.beforeYouStart && sop.beforeYouStart.length ? `<li><a href="#section-before">Before you start</a></li>` : "",
    sop.toolsSystems && sop.toolsSystems.length ? `<li><a href="#section-tools">Tools &amp; systems</a></li>` : "",
    `<li><a href="#section-steps">Steps</a></li>`,
    sop.successCriteria && sop.successCriteria.length ? `<li><a href="#section-success">Success criteria</a></li>` : "",
    sop.escalation && sop.escalation.length ? `<li><a href="#section-escalation">Escalation path</a></li>` : "",
    sop.forms && sop.forms.length ? `<li><a href="#section-forms">Forms</a></li>` : "",
    sop.relatedIds && sop.relatedIds.length ? `<li><a href="#section-related">Related</a></li>` : "",
    `<li><a href="#section-suggestions">Suggestions &amp; feedback</a></li>`,
  ].join("");

  let signoffHtml = `<p class="muted small">Not yet signed off.</p>`;
  if (sop.signedOffBy && sop.signedOffBy.length) {
    signoffHtml = sop.signedOffBy.map((p) => `<div class="signoff-row"><span class="pill-avatar">${(p.initials || p.name.split(" ").map((w) => w[0]).join("")).toUpperCase()}</span><span class="name">${p.name}</span><span class="date">${p.date}</span></div>`).join("");
  }

  pageBody.innerHTML = `
    <div class="breadcrumb">
      <a id="crumb-lib">Library</a><span class="sep">/</span>
      <a id="crumb-dept">${dept.name}</a><span class="sep">/</span>
      <span>${sop.title}</span>
    </div>
    <div class="sop-header">
      <div>
        <div class="row" style="gap:10px;margin-bottom:10px;">
          <span class="badge badge-${sop.status}">${statusMeta(sop.status).label}</span>
          <span class="faint small">${sop.sopId || ""}</span>
          <span class="faint small">${sop.version || ""}</span>
          ${sop.confidential ? `<span class="confidential-note">&#128274; Confidential</span>` : ""}
        </div>
        <h1>${sop.title}</h1>
        <p class="subtitle">${sop.subtitle || ""}</p>
      </div>
      <div class="sop-actions">
        ${historyBtnHtml}
        <div class="history-panel" id="history-panel">
          <div class="vm-label">Update history</div>
          ${historyRows}
        </div>
        ${approveHtml}
        ${editHtml}
        ${disapproveHtml}
        <a class="btn btn-primary" id="run-btn">Run this SOP</a>
      </div>
    </div>
    <div class="sop-layout">
      <main>
        ${neverHtml}
        ${pendingEditHtml}
        ${blackoutHtml}
        ${beforeHtml}
        ${toolsHtml}
        <div class="section" id="section-steps"><h2>Steps</h2><div>${stepsHtml}</div></div>
        ${successHtml}
        ${escalationHtml}
        ${formsHtml}
        ${relatedHtml}
        ${suggestionsSectionHtml(sop)}
      </main>
      <aside>
        <div class="rail-card"><h3>On this page</h3><ul class="toc-list">${toc}</ul></div>
        <div class="rail-card">
          <h3>Details</h3>
          <div class="meta-line"><span class="k">Owner</span><span class="v"><span class="pill-avatar" style="margin-right:6px">${sop.owner.initials}</span>${sop.owner.name}</span></div>
          <div class="meta-line"><span class="k">Last reviewed</span><span class="v">${sop.lastReviewed || "—"}</span></div>
          <div class="meta-line"><span class="k">Next review</span><span class="v">${sop.nextReview || "—"}</span></div>
        </div>
        <div class="rail-card"><h3>Signed off by</h3>${signoffHtml}</div>
      </aside>
    </div>`;

  document.getElementById("crumb-lib").addEventListener("click", () => go("/library"));
  document.getElementById("crumb-dept").addEventListener("click", () => go("/library?dept=" + dept.id));
  document.getElementById("run-btn").addEventListener("click", () => go("/run/" + sop.id));
  const historyBtn = document.getElementById("history-btn");
  if (historyBtn && !historyBtn.disabled) {
    historyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("history-panel").classList.toggle("open");
    });
  }
  const editBtn = document.getElementById("edit-btn");
  if (editBtn && !editBtn.disabled) {
    editBtn.addEventListener("click", () => go("/edit/" + sop.id));
  }
  const pendingEditLink = document.getElementById("pending-edit-link");
  if (pendingEditLink) {
    pendingEditLink.addEventListener("click", () => go("/suggestions"));
  }
  const approveBtn = document.getElementById("approve-btn");
  if (approveBtn && !approveBtn.disabled) {
    approveBtn.addEventListener("click", async () => {
      approveBtn.disabled = true;
      approveBtn.textContent = "Approving...";
      try {
        await API.approveSop(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName);
        const approval = { lastName: CURRENT_VIEWER.lastName, ...eventStamp() };
        sop.status = "current";
        sop.lastReviewed = approval.monthYear;
        sop.signedOffBy = [...(sop.signedOffBy || []), { name: approval.lastName, initials: initialsFrom(approval.lastName), date: approval.fullDate }];
        EVENTS.push({ sopId: sop.id, kind: "approved", lastName: approval.lastName, loginName: "Admin", ts: approval.ts, fullDate: approval.fullDate });
        renderSopDetail(sop.id);
      } catch (err) {
        approveBtn.disabled = false;
        approveBtn.textContent = "Approve this SOP";
        alert("Couldn't approve: " + err.message);
      }
    });
  }
  const disapproveBtn = document.getElementById("disapprove-btn");
  if (disapproveBtn && !disapproveBtn.disabled) {
    disapproveBtn.addEventListener("click", async () => {
      const ok = confirm(`Remove "${sop.title}" permanently? This deletes the whole page and can't be undone.`);
      if (!ok) return;
      disapproveBtn.disabled = true;
      disapproveBtn.textContent = "Removing...";
      try {
        await API.disapproveSop(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName);
        const idx = SOPS.findIndex((s) => s.id === sop.id);
        if (idx !== -1) SOPS.splice(idx, 1);
        go("/library");
      } catch (err) {
        disapproveBtn.disabled = false;
        disapproveBtn.textContent = "Disapprove";
        alert("Couldn't remove: " + err.message);
      }
    });
  }
  wireSuggestionsSection(sop);
  pageBody.querySelectorAll(".before-list li").forEach((li) => li.addEventListener("click", () => li.classList.toggle("checked")));
  pageBody.querySelectorAll(".step-num").forEach((el) => el.addEventListener("click", () => el.closest(".step-row").classList.toggle("done")));
  pageBody.querySelectorAll("[data-sop]").forEach((a) => a.addEventListener("click", () => go("/sop/" + a.dataset.sop)));
  pageBody.querySelectorAll(".toc-list a").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    const target = document.querySelector(a.getAttribute("href"));
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}

/* ============================== SOP EDIT ============================== */
// A form entry is either a plain string (no linked document yet -- shows
// "Not linked" on the SOP page) or {name, href} once a document URL is
// attached. These two helpers convert between that and the "Name | URL"
// textarea format so linking a document is just filling in the URL half.
function formsToText(forms) {
  return (forms || []).map((f) => (typeof f === "string" ? f : `${f.name}${f.href ? " | " + f.href : ""}`)).join("\n");
}
function textToForms(el) {
  return el.value.split("\n").map((s) => s.trim()).filter(Boolean).map((line) => {
    const [name, href] = line.split("|").map((s) => (s || "").trim());
    return href ? { name, href } : name;
  });
}
function fieldsFromSop(sop) {
  return {
    title: sop.title || "",
    subtitle: sop.subtitle || "",
    neverDoThis: sop.neverDoThis || "",
    beforeYouStart: sop.beforeYouStart || [],
    toolsSystems: sop.toolsSystems || [],
    steps: sop.steps || [],
    successCriteria: sop.successCriteria || [],
    escalation: sop.escalation || [],
    forms: sop.forms || [],
  };
}
function stepEditBlockHtml(step, idx) {
  const st = step || { type: "info" };
  const itemsVal = (st.items || []).join("\n");
  const optionsVal = (st.options || []).map((o) => `${o.label} | ${o.detail || ""}`).join("\n");
  const tags = st.tags || [];
  return `<div class="step-edit-block" data-idx="${idx}">
    <div class="step-edit-row">
      <input class="se-phase" placeholder="Phase (optional)" value="${escapeAttr(st.phase || "")}">
      <select class="se-type">
        <option value="info" ${st.type === "info" || !st.type ? "selected" : ""}>Info</option>
        <option value="checklist" ${st.type === "checklist" ? "selected" : ""}>Checklist</option>
        <option value="decision" ${st.type === "decision" ? "selected" : ""}>Decision</option>
      </select>
      <button type="button" class="btn btn-secondary se-remove">Remove step</button>
    </div>
    <input class="se-title" placeholder="Step title" value="${escapeAttr(st.title || "")}">
    <textarea class="se-body" placeholder="Step description" rows="2">${escapeHtml(st.body || "")}</textarea>
    <div class="se-checklist-wrap" style="display:${st.type === "checklist" ? "block" : "none"}">
      <textarea class="se-items" placeholder="One checklist item per line" rows="3">${escapeHtml(itemsVal)}</textarea>
    </div>
    <div class="se-decision-wrap" style="display:${st.type === "decision" ? "block" : "none"}">
      <textarea class="se-options" placeholder="Label | Detail (one option per line)" rows="3">${escapeHtml(optionsVal)}</textarea>
    </div>
    <div class="se-tags">
      <label><input type="checkbox" class="se-tag-approval" ${tags.includes("approval") ? "checked" : ""}> Approval required</label>
      <label><input type="checkbox" class="se-tag-confidential" ${tags.includes("confidential") ? "checked" : ""}> Confidential</label>
    </div>
  </div>`;
}
function renderSopEdit(id) {
  const sop = getSop(id);
  if (!sop) {
    pageBody.innerHTML = `<p class="muted">SOP not found. <a id="back-lib" style="text-decoration:underline;cursor:pointer">Back to the library</a>.</p>`;
    document.getElementById("back-lib").addEventListener("click", () => go("/library"));
    return;
  }
  if (!CURRENT_VIEWER) {
    pageBody.innerHTML = `<div class="empty-state">
      <p>Log in to edit this SOP.</p>
      <button class="btn btn-secondary" id="back-sop">Back to the SOP</button>
    </div>`;
    document.getElementById("back-sop").addEventListener("click", () => go("/sop/" + sop.id));
    return;
  }

  const f = fieldsFromSop(sop);
  const memberProposing = !isAdmin(CURRENT_VIEWER);

  pageBody.innerHTML = `
    <div class="breadcrumb">
      <a id="crumb-sop">${sop.title}</a><span class="sep">/</span>
      <span>Edit</span>
    </div>
    <h1 style="margin-bottom:6px">Edit SOP</h1>
    ${memberProposing ? `<p class="muted small" style="margin-bottom:14px">Your changes will be submitted as a proposal &mdash; an Admin needs to approve them before they go live.</p>` : ""}

    <div class="edit-field"><label>Title</label><input id="ef-title" class="ef-input" value="${escapeAttr(f.title)}"></div>
    <div class="edit-field"><label>Subtitle</label><input id="ef-subtitle" class="ef-input" value="${escapeAttr(f.subtitle)}"></div>
    <div class="edit-field"><label>Never do this <span class="muted small">(optional)</span></label><input id="ef-never" class="ef-input" value="${escapeAttr(f.neverDoThis)}"></div>
    <div class="edit-field"><label>Before you start <span class="muted small">(one item per line)</span></label><textarea id="ef-before" rows="3">${escapeHtml(f.beforeYouStart.join("\n"))}</textarea></div>
    <div class="edit-field"><label>Tools &amp; systems <span class="muted small">(Name | Note — one per line)</span></label><textarea id="ef-tools" rows="3">${escapeHtml(f.toolsSystems.map((t) => `${t.name} | ${t.note || ""}`).join("\n"))}</textarea></div>

    <div class="edit-field">
      <label>Steps</label>
      <div id="steps-editor">${f.steps.map((s, i) => stepEditBlockHtml(s, i)).join("")}</div>
      <button type="button" class="btn btn-secondary" id="add-step-btn">+ Add step</button>
    </div>

    <div class="edit-field"><label>Success criteria <span class="muted small">(one per line)</span></label><textarea id="ef-success" rows="3">${escapeHtml(f.successCriteria.join("\n"))}</textarea></div>
    <div class="edit-field"><label>Escalation path <span class="muted small">(When | Action — one per line)</span></label><textarea id="ef-escalation" rows="3">${escapeHtml(f.escalation.map((e) => `${e.when} | ${e.action}`).join("\n"))}</textarea></div>
    <div class="edit-field"><label>Forms <span class="muted small">(Name | Link URL — one per line, URL optional)</span></label><textarea id="ef-forms" rows="2">${escapeHtml(formsToText(f.forms))}</textarea></div>

    <div class="edit-actions">
      <button class="btn btn-secondary" id="edit-cancel">Cancel</button>
      <button class="btn btn-primary" id="edit-save">${memberProposing ? "Submit for approval" : "Save changes"}</button>
    </div>
    <p class="muted small" id="edit-status" style="min-height:16px;margin-top:8px"></p>`;

  document.getElementById("crumb-sop").addEventListener("click", () => go("/sop/" + sop.id));
  document.getElementById("edit-cancel").addEventListener("click", () => go("/sop/" + sop.id));

  function bindStepBlock(block) {
    const typeSel = block.querySelector(".se-type");
    const checklistWrap = block.querySelector(".se-checklist-wrap");
    const decisionWrap = block.querySelector(".se-decision-wrap");
    typeSel.addEventListener("change", () => {
      checklistWrap.style.display = typeSel.value === "checklist" ? "block" : "none";
      decisionWrap.style.display = typeSel.value === "decision" ? "block" : "none";
    });
    block.querySelector(".se-remove").addEventListener("click", () => block.remove());
  }
  document.querySelectorAll(".step-edit-block").forEach(bindStepBlock);
  document.getElementById("add-step-btn").addEventListener("click", () => {
    const wrap = document.getElementById("steps-editor");
    const holder = document.createElement("div");
    holder.innerHTML = stepEditBlockHtml({ type: "info" }, wrap.children.length);
    const block = holder.firstElementChild;
    wrap.appendChild(block);
    bindStepBlock(block);
    block.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  document.getElementById("edit-save").addEventListener("click", async () => {
    const saveBtn = document.getElementById("edit-save");
    const statusEl = document.getElementById("edit-status");

    const linesOf = (el) => el.value.split("\n").map((s) => s.trim()).filter(Boolean);
    const pairsOf = (el, keyA, keyB) => linesOf(el).map((line) => {
      const [a, b] = line.split("|").map((s) => (s || "").trim());
      return { [keyA]: a, [keyB]: b || "" };
    });

    const steps = Array.from(document.querySelectorAll(".step-edit-block")).map((block) => {
      const type = block.querySelector(".se-type").value;
      const step = {
        type,
        title: block.querySelector(".se-title").value.trim(),
        body: block.querySelector(".se-body").value.trim(),
      };
      const phase = block.querySelector(".se-phase").value.trim();
      if (phase) step.phase = phase;
      const tags = [];
      if (block.querySelector(".se-tag-approval").checked) tags.push("approval");
      if (block.querySelector(".se-tag-confidential").checked) tags.push("confidential");
      if (tags.length) step.tags = tags;
      if (type === "checklist") step.items = linesOf(block.querySelector(".se-items"));
      else if (type === "decision") step.options = pairsOf(block.querySelector(".se-options"), "label", "detail");
      return step;
    }).filter((s) => s.title);

    const title = document.getElementById("ef-title").value.trim();
    if (!title) { statusEl.textContent = "Title can't be empty."; return; }
    if (!steps.length) { statusEl.textContent = "Add at least one step before saving."; return; }

    const fields = {
      title,
      subtitle: document.getElementById("ef-subtitle").value.trim(),
      beforeYouStart: linesOf(document.getElementById("ef-before")),
      toolsSystems: pairsOf(document.getElementById("ef-tools"), "name", "note"),
      steps,
      successCriteria: linesOf(document.getElementById("ef-success")),
      escalation: pairsOf(document.getElementById("ef-escalation"), "when", "action"),
      forms: textToForms(document.getElementById("ef-forms")),
    };
    const neverVal = document.getElementById("ef-never").value.trim();
    fields.neverDoThis = neverVal || undefined;

    saveBtn.disabled = true;
    saveBtn.textContent = memberProposing ? "Submitting..." : "Saving...";
    const snakeFields = {
      title: fields.title,
      subtitle: fields.subtitle,
      before_you_start: fields.beforeYouStart,
      tools_systems: fields.toolsSystems,
      steps: fields.steps,
      success_criteria: fields.successCriteria,
      escalation: fields.escalation,
      forms: fields.forms,
      never_do_this: neverVal || null,
    };
    try {
      if (memberProposing) {
        const proposalId = await API.proposeSopEdit(sop.id, CURRENT_VIEWER.id, CURRENT_VIEWER.passcode, CURRENT_VIEWER.lastName, snakeFields);
        EDIT_PROPOSALS.push({
          id: proposalId, sopId: sop.id, loginId: CURRENT_VIEWER.id, loginName: CURRENT_VIEWER.name,
          lastName: CURRENT_VIEWER.lastName, fields: snakeFields, status: "pending", ts: Date.now(),
        });

      } else {

    }
  });
}

function renderRun(id) {
  const sop = getSop(id);
  if (!sop) {
    runRoot.innerHTML = `<div class="run-shell"><p class="muted" style="padding:40px 20px">SOP not found. <a id="back-lib2" style="text-decoration:underline;cursor:pointer">Back to the library</a>.</p></div>`;
    document.getElementById("back-lib2").addEventListener("click", () => go("/library"));
    return;
  }

  runRoot.innerHTML = `
    <div class="run-shell" id="run-shell">
      <div class="run-top">
        <div class="run-top-row">
          <a class="exit" id="exit-link">&larr; Exit run</a>
          <button class="pause-btn" id="pause-btn">Pause</button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="step-counter"><span class="small muted" id="step-label">Step 1 of 1</span><span class="small muted" id="step-tag"></span></div>
      </div>
      <div class="run-body" id="run-body"></div>
      <div class="pause-overlay" id="pause-overlay">
        <h3>Paused</h3>
        <p class="muted" style="color:rgba(255,255,255,.7)">Take your time. Nothing is lost if you close the tab.</p>
        <button class="btn btn-primary" id="resume-btn">Resume</button>
      </div>
    </div>`;

  document.getElementById("exit-link").addEventListener("click", () => go("/sop/" + sop.id));
  document.getElementById("pause-btn").addEventListener("click", () => document.getElementById("pause-overlay").classList.add("show"));
  document.getElementById("resume-btn").addEventListener("click", () => document.getElementById("pause-overlay").classList.remove("show"));

  const totalSteps = sop.steps.length + 1;
  let stepIndex = 0;
  const checklistState = sop.steps.map((s) => (s.items ? s.items.map(() => false) : []));
  const decisionChoice = {};
  const flagged = new Set();

  function isStepComplete(i) {
    const step = sop.steps[i];
    if (!step) return true;
    if (step.type === "checklist" && step.items) return checklistState[i].every(Boolean);
    if (step.type === "decision") return decisionChoice[i] !== undefined;
    return true;
  }
  function renderProgress() {
    const pct = Math.min(100, Math.round((stepIndex / (totalSteps - 1)) * 100));
    document.getElementById("progress-fill").style.width = pct + "%";
    const shown = Math.min(stepIndex + 1, totalSteps);
    document.getElementById("step-label").textContent = stepIndex >= sop.steps.length ? "Sign off" : `Step ${shown} of ${sop.steps.length}`;
    document.getElementById("step-tag").textContent = flagged.has(stepIndex) ? "Flagged" : "";
  }
  function renderStep() {
    const body = document.getElementById("run-body");
    if (stepIndex >= sop.steps.length) { renderComplete(body); renderFooterComplete(); renderProgress(); return; }
    const step = sop.steps[stepIndex];
    const tagChip = { approval: `<span class="tag-chip tag-approval">Approval required</span>`, confidential: `<span class="tag-chip tag-confidential">&#128274; Confidential</span>` };
    let inner = `<div class="sop-name">${sop.title}</div>`;
    if (stepIndex === 0 && sop.blackoutPeriods && sop.blackoutPeriods.length) {
      inner += `<div class="blackout-banner"><span class="tag">Blackout periods</span><ul>${sop.blackoutPeriods.map((p) => `<li>${p}</li>`).join("")}</ul></div>`;
    }
    if (step.phase) inner += `<div class="phase-eyebrow">${step.phase}</div>`;
    inner += `<div class="step-card"><h2>${step.title}</h2>`;
    if (step.tags && step.tags.length) inner += `<div class="step-tags">${step.tags.map((t) => tagChip[t] || "").join("")}</div>`;
    if (step.body) inner += `<p class="body-text">${step.body}</p>`;
    if (step.type === "checklist" && step.items) inner += step.items.map((it, idx) => `<div class="check-item ${checklistState[stepIndex][idx] ? "checked" : ""}" data-idx="${idx}"><span class="box">&#10003;</span><span>${it}</span></div>`).join("");
    if (step.type === "decision" && step.options) inner += step.options.map((o, idx) => `<div class="option-item ${decisionChoice[stepIndex] === idx ? "selected" : ""}" data-idx="${idx}"><span class="label">${o.label}</span><span class="detail">${o.detail}</span></div>`).join("");
    inner += `</div><button class="flag-link ${flagged.has(stepIndex) ? "flagged" : ""}" id="flag-btn">${flagged.has(stepIndex) ? "⚑ Flagged as unclear" : "Flag this step as unclear"}</button>`;
    body.innerHTML = inner;
    body.querySelectorAll(".check-item").forEach((el) => el.addEventListener("click", () => { const idx = Number(el.dataset.idx); checklistState[stepIndex][idx] = !checklistState[stepIndex][idx]; renderStep(); renderFooter(); }));
    body.querySelectorAll(".option-item").forEach((el) => el.addEventListener("click", () => { decisionChoice[stepIndex] = Number(el.dataset.idx); renderStep(); renderFooter(); }));
    document.getElementById("flag-btn").addEventListener("click", () => { flagged.has(stepIndex) ? flagged.delete(stepIndex) : flagged.add(stepIndex); renderStep(); renderProgress(); });
    renderFooter(); renderProgress();
  }
  function renderComplete(body) {
    let recapRows = "";
    sop.steps.forEach((s, i) => { if (s.type === "decision" && decisionChoice[i] !== undefined) recapRows += `<div class="recap-row"><span class="muted">${s.title}</span><span style="font-weight:600">${s.options[decisionChoice[i]].label}</span></div>`; });
    body.innerHTML = `<div class="complete-screen">
      <div class="complete-icon">&#10003;</div>
      <h2>${sop.title.split(" — ")[0]}. Done.</h2>
      <p class="sub">${CURRENT_VIEWER ? "Nice work, " + escapeHtml(CURRENT_VIEWER.lastName) + "." : "Nice work."}</p>
      ${recapRows ? `<div class="recap-card"><h3>This run</h3>${recapRows}</div>` : ""}
      ${flagged.size ? `<div class="flag-note">You flagged step${flagged.size > 1 ? "s" : ""} ${[...flagged].map((i) => i + 1).join(", ")} as unclear. ${sop.owner.name} will see it in the review queue.</div>` : ""}
    </div>`;
  }
  function renderFooter() {
    let footer = document.getElementById("run-footer");
    if (!footer) { footer = document.createElement("div"); footer.className = "run-footer"; footer.id = "run-footer"; document.getElementById("run-shell").insertBefore(footer, document.getElementById("pause-overlay")); }
    const complete = isStepComplete(stepIndex);
    const isLast = stepIndex === sop.steps.length - 1;
    footer.innerHTML = `<button class="btn btn-secondary" id="back-btn" ${stepIndex === 0 ? "disabled" : ""}>Back</button><button class="btn btn-primary" id="next-btn" ${complete ? "" : "disabled"}>${isLast ? "Finish & sign off" : "Next step"}</button>`;
    document.getElementById("back-btn").addEventListener("click", () => { if (stepIndex > 0) { stepIndex--; renderStep(); } });
    document.getElementById("next-btn").addEventListener("click", () => { if (!isStepComplete(stepIndex)) return; stepIndex++; renderStep(); });
  }
  function renderFooterComplete() {
    const footer = document.getElementById("run-footer");
    footer.innerHTML = `<a class="btn btn-primary" id="back-to-sop" style="text-align:center">Back to the SOP</a>`;
    document.getElementById("back-to-sop").addEventListener("click", () => go("/sop/" + sop.id));
  }

  renderStep();
}
